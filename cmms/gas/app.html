/** google.script.run เป็น callback — ห่อเป็น Promise ให้เขียนแบบ async ได้ */
const gs = (fn, ...args) => new Promise((resolve, reject) => {
  if (!hasBackend()) return reject(new Error("โหมดทดสอบ — ต้องเปิดผ่าน Web app ของ Apps Script"));
  google.script.run
    .withSuccessHandler(resolve)
    .withFailureHandler((e) => reject(new Error((e && e.message) || String(e))))[fn](...args);
});

const hasBackend = () => typeof google !== "undefined" && !!(google.script && google.script.run);

/** เรียก API ที่ต้องใช้สิทธิ์ — token หมดอายุให้เด้งกลับหน้า login แทนโยน error ดิบ */
async function gsAuth(fn, ...args) {
  if (!isUnlocked()) { forceRelogin(); throw new Error("ต้องเข้าสู่ระบบก่อน"); }
  try {
    return await gs(fn, getToken(), ...args);
  } catch (err) {
    if (/เข้าสู่ระบบ|token|unauthor/i.test(err.message)) forceRelogin();
    throw err;
  }
}

/* มัธยฐาน — ข้อมูลซ่อมบำรุงมีตัวสุดโต่งเสมอ (ใบแพงสุดใบเดียวกินงบ 23%)

const median = (arr) => {
  if (!arr.length) return null;
  const a = [...arr].sort((x, y) => x - y);
  const h = a.length >> 1;
  return a.length % 2 ? a[h] : (a[h - 1] + a[h]) / 2;
};

const ymd = (v) => {
  const d = new Date(v);
  return isNaN(d) ? "" :
    `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
};

/* เทียบที่ระดับวัน ไม่ใช่ timestamp — นัดรับวันนี้ตอนเช้า ยังไม่ถือว่าเลยกำหนด */
const backLate = (t) => t.status === STATUS.OUT && !!t.expect_back && ymd(t.expect_back) < ymd(Date.now());

/** แปลงชั่วโมงเป็นข้อความไทย เช่น 2 ชม. 30 น. */
function fmtDuration(hours) {
  if (!isFinite(hours) || hours < 0) return "";
  const total = Math.round(hours * 60);
  const d = Math.floor(total / 1440), h = Math.floor((total % 1440) / 60), m = total % 60;
  /* หน่วยเวลาต้องเปลี่ยนตามภาษาด้วย ไม่งั้นในโหมดอังกฤษจะได้ "Closed within 3 วัน"
     ตัวแปลแบบเทียบตรงตัวจับไม่ได้ เพราะมีตัวเลขแทรกอยู่ */
  const U = (typeof LANG !== "undefined" && LANG === "en")
    ? ["d", "h", "m"] : ["วัน", "ชม.", "น."];
  return [d && `${d} ${U[0]}`, h && `${h} ${U[1]}`, (m || (!d && !h)) && `${m} ${U[2]}`]
    .filter(Boolean).join(" ");
}

/** ชั่วโมงระหว่างสองเวลา (คืน null ถ้าข้อมูลไม่ครบหรือย้อนกลับ) */
function hoursBetween(startIso, endIso) {
  if (!startIso || !endIso) return null;
  const h = (new Date(endIso) - new Date(startIso)) / 3.6e6;
  return isFinite(h) && h >= 0 ? h : null;
}

/** ชั่วโมงที่ใบนี้ใช้ไป: ปิดแล้วนับถึงวันปิด ยังค้างนับถึงตอนนี้ */
function elapsedHours(t, now = Date.now()) {
  return hoursBetween(t.created_at, t.completed_at || new Date(now).toISOString());
}

function toast(msg, ok = true) {
  const el = $("#toast");
  if (!el) return;
  el.textContent = msg;
  el.className = `toast ${ok ? "toast-ok" : "toast-err"}`;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.add("hidden"), 4200);
}

/* ─────────── storage ───────────
   เก็บ cache ไว้ให้หน้าเปิดเร็วตอนเน็ตช้า แต่ต้องผูกกับ scope เสมอ
   ถ้าเคยล็อกอินแล้วดึงข้อมูลเต็ม (มีค่าใช้จ่าย) มาพัก พอ logout ต้องทิ้งทันที
   ไม่งั้นคนถัดไปที่เปิดเครื่องเดียวกันเห็นข้อมูลที่ไม่ควรเห็น            */
function save() {
  const scope = isUnlocked() ? "full" : "public";
  const slim = tickets.map(({ thumb, ...rest }) => rest);   // thumb กิน quota เร็วมาก ไม่เก็บ
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({ scope, at: Date.now(), tickets: slim }));
  } catch (_) {
    try { localStorage.removeItem(STORE_KEY); } catch (__) {}
  }
}

function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (!raw || !Array.isArray(raw.tickets)) { tickets = []; return; }
    if (raw.scope === "full" && !isUnlocked()) { clearCache(); tickets = []; return; }
    tickets = raw.tickets;
  } catch (_) { tickets = []; }
}

function clearCache() {

/* ─────────── PM รายเดือน ───────────
   เก็บในชีต "PM รายเดือน" ทุกคนเห็นตรงกัน ไม่ใช่ต่างคนต่างเก็บในเครื่อง        */
let pmCache = {};

async function loadPMFromSheet() {
  try { pmCache = await gs("apiGetPM") || {}; } catch (_) { pmCache = {}; }
}

function getPM(year, month) {
  if (month) return pmCache[`${year}-${month}`] || {};
  return Object.entries(pmCache).filter(([k]) => k.startsWith(year + "-"))
    .reduce((a, [, v]) => ({
      workHours: (a.workHours || 0) + (Number(v.workHours) || 0),
      pmPlan:    (a.pmPlan    || 0) + (Number(v.pmPlan)    || 0),
      pmDone:    (a.pmDone    || 0) + (Number(v.pmDone)    || 0),
    }), {});
}

/** บันทึกลงชีต — หน่วง 800ms เพราะผูกกับ oninput ถ้ายิงทุกตัวอักษรจะกินโควตาและชนกันเอง */
let pmSaveTimer = null;
function setPM(year, month, data) {
  pmCache[`${year}-${month}`] = data;
  clearTimeout(pmSaveTimer);
  pmSaveTimer = setTimeout(async () => {
    try { await gsAuth("apiSetPM", year, month, data); }
    catch (err) { toast("บันทึกข้อมูล PM ไม่สำเร็จ: " + err.message, false); }
  }, 800);
}

/* ─────────── image compress ───────────
   ย่อด้านยาวสุดเหลือ maxDim แล้วไล่ลด JPEG quality จนต่ำกว่า maxBytes      */
function compressImage(file, maxBytes, maxDim = 1600, quality = 0.82) {
  const cap = maxBytes || Math.min(1.5 * 1024 * 1024, CONFIG.maxImageBytes || Infinity);
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const draw = (dim, q) => {
        const scale = Math.min(1, dim / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width  = Math.max(1, Math.round(img.width  * scale));
        c.height = Math.max(1, Math.round(img.height * scale));
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#fff";                       // กัน PNG โปร่งใสกลายเป็นดำ
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        return c.toDataURL("image/jpeg", q);
      };
      const bytes = (u) => Math.round((u.length - u.indexOf(",") - 1) * 0.75);

      let q = quality, dim = maxDim, full = draw(dim, q);
      while (bytes(full) > cap && q > 0.35)  { q -= 0.1; full = draw(dim, q); }
      while (bytes(full) > cap && dim > 640) { dim = Math.round(dim * 0.75); full = draw(dim, q); }

      resolve({ full, thumb: draw(420, 0.6), bytes: bytes(full) });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("อ่านไฟล์รูปไม่สำเร็จ")); };
    img.src = url;
  });
}

/* ═══════════ ANALYTICS (ฟังก์ชันบริสุทธิ์ — มี unit test ใน test.js) ═══════════ */

/** หา "รายการซ่อมซ้ำ": เครื่องเดิมเสียอีกครั้งภายใน windowDays */
function findRepeats(list, windowDays = 30) {
  const byMachine = {};
  list.forEach((t) => {
    // งานอาคาร ห้องน้ำ ซิงค์ล้างจาน ไม่มีชื่อเครื่อง ถ้าไม่กันไว้จะถูกจับเป็นซ้ำกันเองทั้งกอง
    if (!t.created_at || !t.machine_name) return;
    (byMachine[t.machine_name] ||= []).push(t);
  });

  const out = [];
  Object.entries(byMachine).forEach(([machine, arr]) => {
    arr.sort((a, b) => a.created_at.localeCompare(b.created_at));
    for (let i = 1; i < arr.length; i++) {
      const gap = (new Date(arr[i].created_at) - new Date(arr[i - 1].created_at)) / 864e5;
      if (gap <= windowDays) {
        out.push({
          machine,
          prev: arr[i - 1],
          curr: arr[i],
          gapDays: Math.round(gap * 10) / 10,
          cost: (Number(arr[i - 1].cost) || 0) + (Number(arr[i].cost) || 0),
        });
      }
    }
  });
  return out.sort((a, b) => a.gapDays - b.gapDays);
}

/** นิยาม "ซ่อมซ้ำ" ของระบบเดิม (ชีท รายการซ่อมซ้ำ):
    นับ "เครื่อง" ที่ถูกแจ้งตั้งแต่ 2 ครั้งขึ้นไปในรอบ ไม่ใช่นับจำนวนใบ */
function repeatByCount(list, minTimes = 2) {
  const c = {};
  list.forEach((t) => { if (t.machine_name) c[t.machine_name] = (c[t.machine_name] || 0) + 1; });
  const machines = Object.entries(c).map(([machine, count]) => ({ machine, count }))
                         .sort((a, b) => b.count - a.count);
  const repeated = machines.filter((m) => m.count >= minTimes);
  return { machines, repeated, rate: pct(repeated.length, machines.length) };
}

/** สถิติรายเครื่องจักร: ครั้ง / ค่าใช้จ่าย / downtime / MTTR / ซ่อมซ้ำ */
function machineStats(list, repeats = []) {
  const m = {};
  const pick = (name) => (m[name] ||= { machine: name, count: 0, cost: 0, downtime: 0, closed: 0, repeat: 0 });

  list.forEach((t) => {
    if (!t.machine_name) return;      // งานอาคาร/ห้องน้ำ ไม่มีเครื่อง อย่าให้โผล่เป็นแท่งไร้ชื่อในกราฟ
    const s = pick(t.machine_name);
    s.count++;
    s.cost += Number(t.cost) || 0;
    // ชื่อช่องคือ downtime จึงต้องเป็นเวลาที่เครื่องรอ ไม่ใช่เวลาที่ช่างลงมือ
    const h = waitHours(t);
    if (h !== null) { s.downtime += h; s.closed++; }
  });
  repeats.forEach((r) => { if (m[r.machine]) m[r.machine].repeat++; });

  return Object.values(m).map((s) => ({ ...s, mttr: s.closed ? s.downtime / s.closed : null }));
}

/* ═══ สองไม้บรรทัดที่วัดคนละเรื่อง ═══
   เดิมมีฟังก์ชันเดียวที่สลับไปมาระหว่างสองอย่างนี้ตามว่าใบไหนมีข้อมูลอะไร —
   ใบที่กดปุ่ม "เริ่มซ่อม" ได้เวลาช่างลงมือ ใบที่ไม่ได้กดได้เวลาที่ใบค้าง
   แล้วเอามาบวกกันเป็นก้อนเดียว ผลคือตัวเลขที่ไม่มีใครรู้ว่ากำลังอ่านอะไรอยู่

   แยกออกเป็นสองตัวโดยตั้งใจ ไม่ได้เลือกอันใดอันหนึ่ง เพราะทั้งคู่จริงทั้งคู่
   และตอบคนละคำถาม — "ช่างยุ่งแค่ไหน" กับ "เครื่องใช้งานไม่ได้นานแค่ไหน" */

/** เวลาที่ช่างลงมือจริง: เริ่มซ่อม → ซ่อมจบ
    ("ใช้เวลา" ในชีตคือค่าที่ server คำนวณจากสองเวลานี้ให้แล้ว และทับค่าที่พิมพ์เองทุกครั้งที่คิดได้)
    ใบที่ไม่เคยกดปุ่ม "เริ่มซ่อม" คืน null = ไม่รู้ ไม่ใช่ 0
    ถ้าเดาเป็น 0 ช่างที่ไม่กดปุ่มจะดูเหมือนทำงานเสร็จในพริบตา */
function wrenchHours(t) {
  const mins = Number(t.repair_minutes);
  if (isFinite(mins) && mins > 0) return mins / 60;
  return hoursBetween(t.started_at, t.completed_at);
}

/** เวลาที่เครื่องต้องรอ: แจ้ง → ซ่อมจบ
    รวมเวลารอคิว รออะไหล่ กลางคืน และวันหยุด — คือช่วงที่เครื่องใช้งานไม่ได้จริง
    ไม่ใช่ช่วงที่ช่างยุ่ง ทุกใบที่ปิดแล้วมีค่านี้เสมอ เพราะวันแจ้งบังคับกรอกอยู่แล้ว */
function waitHours(t) {
  return hoursBetween(t.created_at, t.completed_at);
}

/** ใบนี้ปิดทันกำหนดหรือไม่ — ใช้ due_at รายใบก่อน (SLA แยกตามความสำคัญ)
    ถ้าไม่มี due_at (ข้อมูลเก่า) ค่อย fallback ไปใช้ slaHours ค่าเดียว */
function closedOnTime(t, slaHours) {
  if (t.due_at && t.completed_at) return new Date(t.completed_at) <= new Date(t.due_at);
  // SLA นับจากเวลาที่ "รับแจ้ง" ไม่ใช่จากเวลาที่ช่างเริ่มลงมือ การรอคิวก็เป็นส่วนหนึ่งของ SLA
  const h = waitHours(t);
  return h !== null && h <= slaHours;
}

function isOverdue(t, slaHours, now = Date.now()) {
  if (t.status === STATUS.DONE) return false;
  if (t.due_at) return new Date(t.due_at).getTime() < now;
  return (elapsedHours(t, now) ?? 0) > slaHours;
}

/* %Breakdown เป็นตัวชี้วัด "สายการผลิตหยุดไปกี่ชั่วโมง" ไม่ใช่ "ช่างยุ่งแค่ไหน"
   ซ่อมปริ้นเตอร์ 3 ชม. ทาสีผนัง 2 วัน หรือเปลี่ยนพัดลมให้คนงาน ไม่ใช่เวลาที่การผลิตหยุด
   ถ้านับรวมเข้าไป ตัวเลขจะสูงเกินจริงตลอด แล้วไม่มีใครเชื่อ KPI ตัวนี้อีกเลย

   ทะเบียนเครื่องจักรแยก "เครื่องจักรหลัก/รอง" ออกจากอาคารและเครื่องใช้ไฟฟ้าไว้อยู่แล้ว
   จึงใช้เส้นนั้นแทนการดู "ลักษณะงาน" ซึ่งคนเลือกผิดกันบ่อย (ดูคำอธิบายใต้ช่องลักษณะงาน) */
const PRODUCTION_GROUPS = ["เครื่องจักรหลัก", "เครื่องจักรรอง"];

/* ═══ ช่างเทคนิคประจำสถานี ═══
   ทะเบียนเครื่องจักรใช้ช่อง "ผู้ดูแล" เก็บชื่อสถานี (ช่าง Ext / ช่าง UV / ...) ไม่ใช่ชื่อคน
   เพราะของจริงแบ่งงานเป็นกลุ่มเครื่องตามสายงาน ไม่ได้แบ่งเป็นรายคน
   ฝั่งคนเก็บที่คอลัมน์ "สถานีประจำ" ในชีต Users แล้วมาเจอกันที่ชื่อสถานี */

/** สถานีของคนที่ล็อกอินอยู่ — ไม่มีก็คืนค่าว่าง (หัวหน้าไม่ได้ประจำสถานีไหน) */
const myStation = () =>
  String(ME?.station || TEAM.find((u) => u.name === ME?.name)?.station || "").trim();

/** เครื่องทั้งหมดของสถานีนั้น — ใช้เป็นตัวหารของ "ตรวจครบกี่เครื่อง"

    "ALL" คือคำที่หัวหน้าใช้จริงในชีต Users แปลว่าดูแลทั้งโรงงาน
    ไม่รองรับไว้ ระบบจะอ่านเป็นสถานีชื่อ ALL ที่ไม่มีเครื่องสักตัว
    แล้วขึ้นว่า "คุณประจำ ALL — เครื่องที่รับผิดชอบ 0 เครื่อง" ซึ่งตรงข้ามกับความจริง */
const ALL_STATION = "ALL";
const stationMachines = (station) =>
  !station ? []
  : String(station).trim().toUpperCase() === ALL_STATION ? MACHINES.slice()
  : MACHINES.filter((m) => String(m.owner || "").trim() === station);

const isMyMachine = (name) => {
  const st = myStation();
  return !!st && stationMachines(st).some((m) => m.name === name);
};

/* ช่างคนหนึ่งดูแลไม่กี่เครื่อง แต่หน้าจอโชว์ทั้งโรงงาน 36 เครื่อง
   ของตัวเองขึ้นก่อนอย่างเดียวยังต้องไถหา จึงให้ปิดเครื่องของคนอื่นไปเลยได้

   ค่าเริ่มต้นเปิดเฉพาะช่างที่มีสถานี — หัวหน้ากับวิศวกรต้องเห็นครบทั้งโรงงานเสมอ
   เก็บค่าไว้ในตัวแปรไม่ใช่ใน DOM เพราะหน้าถูกวาดใหม่ทุกครั้งที่เปลี่ยนวันที่ */
const mineOnly = { param: null, check: null };
function mineOnlyOn(page) {
  if (mineOnly[page] === null) mineOnly[page] = !!myStation() && !isLead();
  return !!myStation() && mineOnly[page];
}

/** ผูกสวิตช์เข้ากับหน้าหนึ่ง แล้วคืนรายการที่กรองแล้ว */
function mineOnlyBind(page, wrapId, boxId, list, nameOf, redraw) {
  const wrap = $(wrapId), box = $(boxId);
  const st = myStation();
  if (wrap) wrap.hidden = !st;
  if (!st) return list;
  if (box) {
    box.checked = mineOnlyOn(page);
    if (!box.dataset.bound) {
      box.dataset.bound = "1";
      box.addEventListener("change", () => { mineOnly[page] = box.checked; redraw(); });
    }
  }
  if (!mineOnlyOn(page)) return list;
  const mine = list.filter((x) => nameOf(x));
  /* ไม่มีเครื่องของตัวเองสักตัว (สถานีสะกดไม่ตรงกับช่อง "ผู้ดูแล") ให้โชว์ทั้งหมดไว้ก่อน
     หน้าว่างเปล่าแปลว่าระบบพัง ซึ่งคนละเรื่องกับ "วันนี้คุณไม่มีเครื่องต้องดู" */
  return mine.length ? mine : list;
}

function machineGroupOf(name) {
  const c = String(name || "").trim().toLowerCase();
  if (!c) return "";
  const m = MACHINES.find((x) => String(x.name).trim().toLowerCase() === c);
  return m ? m.group : "";
}

/* ยังไม่ได้โหลดทะเบียน (เปิดหน้าแบบยังไม่ล็อกอิน หรือ setup ยังไม่รัน) = แยกไม่ออกว่าใบไหนเป็นเครื่องจักร
   กรณีนั้นนับทุกใบไปก่อน ดีกว่าคืน 0% เงียบ ๆ ซึ่งดูเหมือนโรงงานไม่เคยมีเครื่องหยุดเลย */
const isProductionStop = (t, group) =>
  group ? machineGroupOf(t.machine_name) === group
        : (!MACHINES.length || PRODUCTION_GROUPS.includes(machineGroupOf(t.machine_name)));

/** จำนวนเครื่องจักรผลิตในทะเบียน — เป็นตัวคูณของตัวหาร %Breakdown
    ยังไม่ได้โหลดทะเบียนคืน 1 = ไม่คูณ ดีกว่าหารด้วย 0 แล้วได้ Infinity */
const productionFleet = (group) =>
  (group ? MACHINES.filter((m) => m.group === group)
         : MACHINES.filter((m) => PRODUCTION_GROUPS.includes(m.group))).length || 1;

/* ─── ดู %Breakdown แยกตามกลุ่มเครื่องจักร ───
   เครื่องจักรหลักหยุด = สายการผลิตหยุด · เครื่องรองหยุดอาจไม่กระทบผลผลิตเลย
   ค่าเดียวที่รวมสองกลุ่มจึงตอบได้แค่ว่า "รวม ๆ แล้วเท่าไหร่" ซึ่งสั่งงานต่อไม่ได้

   ตัวหารขยับตามด้วย — เลือกเฉพาะเครื่องหลักแล้วต้องหารด้วยจำนวนเครื่องหลัก
   ไม่ใช่หารด้วยกองทั้งหมด ไม่งั้นได้เปอร์เซ็นต์ที่เล็กเกินจริงแบบเงียบ ๆ

   ⚠️ แยกกลุ่มจะดีเท่าที่ทะเบียนเครื่องจักรถูก — ถ้าจัดกลุ่มผิดก็ได้เลขผิดสองก้อน */
const bdGroupInput = () => {
  const v = $("#bdGroup")?.value || "";
  return PRODUCTION_GROUPS.includes(v) ? v : "";
};

/* ═══════════ เวลาที่เครื่องหยุด "ในเดือนนี้" ไม่ใช่ "ของใบที่แจ้งเดือนนี้" ═══════════
   เดิมกรองใบตามวันที่แจ้ง แล้วนับเวลาจากแจ้งถึงปิดเต็มช่วง
   ใบที่แจ้ง 25 ส.ค. แล้วปิด 10 ต.ค. จึงถูกโยนเข้าเดือนสิงหาคมทั้งก้อน 46 วัน
   ทั้งที่สิงหาคมมีให้เครื่องละ 24 วัน — เครื่องเดียวกินโควตาทั้งเดือนไปเกือบสองเท่า

   ของจริงที่เจอ: สองใบแบบนี้รวมกัน = 93% ของตัวเศษทั้งก้อน อีก 31 ใบแทบไม่มีผล
   %Breakdown จึงไม่ได้วัดว่าโรงงานหยุดไปเท่าไหร่ แต่วัดว่ามีใบไหนถูกลืมปิดบ้าง

   วิธีใหม่ตัดตามปฏิทิน — ใบนั้นลงสิงหาคมแค่ 6 วัน ที่เหลือไปอยู่ ก.ย. กับ ต.ค. ตามจริง
   และรับ "ใบทั้งหมด" เข้ามา ไม่ใช่เฉพาะใบที่ถูกกรองตามเดือนแล้ว เพราะใบที่แจ้งเดือนก่อน
   แต่ยังค้างอยู่ ต้องนับเข้าเดือนนี้ด้วย — เครื่องมันหยุดอยู่จริง ๆ ไม่ได้กลับมาเดิน */

/** ชั่วโมงที่ช่วง [a1,a2] ทับกับ [b1,b2] — ไม่ทับเลยได้ 0 ไม่ใช่ค่าติดลบ */
const overlapHours = (a1, a2, b1, b2) =>
  Math.max(0, Math.min(a2, b2) - Math.max(a1, b1)) / 36e5;

/** ช่วงที่เครื่องหยุดของใบหนึ่ง — "wait" = แจ้ง→ปิด · "wrench" = ช่วงที่ช่างลงมือ
    ใบที่ยังไม่ปิดนับถึงตอนนี้ เพราะเครื่องยังไม่กลับมาเดิน

    ⚠️ ฝั่ง "ช่างลงมือ" มีที่มาของเวลาสองทาง และต้องรับทั้งคู่ —
    ช่องที่ช่างกรอกเอง ("ใช้เวลา" นาที) กับปุ่มเริ่มซ่อมที่ server จับเวลาให้
    ส่วนใหญ่ของจริงกรอกช่องนาที ไม่ได้กดปุ่ม ถ้าอ่านแต่ปุ่มจะได้ 0% ทั้งที่ข้อมูลมีอยู่
    (เคยพลาดมาแล้วตอนเปลี่ยนมาตัดเวลาตามเดือน — ค่าต่ำกลายเป็น 0 น. ทั้งตาราง)

    ช่องนาทีเป็น "ความยาว" ไม่ใช่ "ช่วงเวลา" จึงต้องเลือกจุดยึดเอง —
    ยึดท้ายไว้ที่เวลาปิดใบ เพราะช่างมักซ่อมเสร็จแล้วค่อยปิด ไม่ใช่ปิดไว้ก่อนแล้วค่อยซ่อม
    เรียงลำดับเดียวกับ wrenchHours() คือเชื่อเลขที่คนกรอกก่อนเลขที่ระบบเดา */
function stopSpan(t, kind, nowMs) {
  if (kind === "wrench") {
    const end = t.completed_at ? Date.parse(t.completed_at)
              : (t.started_at ? nowMs : NaN);
    if (!isFinite(end)) return null;
    const mins = Number(t.repair_minutes);
    if (isFinite(mins) && mins > 0) return [end - mins * 60000, end];
    const st = Date.parse(t.started_at);
    return isFinite(st) && st < end ? [st, end] : null;
  }
  const s = Date.parse(t.created_at);
  if (!isFinite(s)) return null;
  const e = t.completed_at ? Date.parse(t.completed_at) : nowMs;
  return isFinite(e) && e > s ? [s, e] : null;
}

/** ขอบเขตปฏิทินของช่วงที่เลือก + เพดานรายเครื่อง — ใช้เป็นอาร์กิวเมนต์ที่ 5 ของ kpiSummary */
function periodWindow(p) {
  const y = Number(p.year), m = p.month ? Number(p.month) : 0;
  const all = p.all || live(tickets);
  const cap = (p.pm && p.pm.workHours) || Infinity;
  const group = p.group !== undefined ? p.group : bdGroupInput();
  /* ไม่มีปีให้ = ไม่มีขอบเขต ต้องคืนหน้าต่างที่ครอบทุกอย่าง ไม่ใช่ NaN
     หน้าต่าง NaN จะทำให้ทุกใบ "ไม่ทับ" แล้วได้ 0% เงียบ ๆ ซึ่งดูเหมือนโรงงานไม่เคยหยุดเลย */
  if (!isFinite(y)) return { from: -Infinity, to: Infinity, all, cap, group };
  return {
    from: (m ? new Date(y, m - 1, 1) : new Date(y, 0, 1)).getTime(),
    to:   (m ? new Date(y, m, 1)     : new Date(y + 1, 0, 1)).getTime(),
    all, cap, group,
  };
}

/* รวมเวลาหยุดในหน้าต่างที่ให้มา — รายเครื่อง แล้วค่อยเอามาบวกกัน

   ═══ ทำไมต้อง "รวมช่วง" ไม่ใช่ "บวกเวลา" ═══
   เครื่องเดียวมีใบเปิดค้างพร้อมกันได้หลายใบ (แจ้งลูกปืน แล้วแจ้งมอเตอร์ตามมาอีกใบ)
   ถ้าบวกชั่วโมงของทุกใบตรง ๆ จะนับ "เวลาที่เครื่องหยุด" ช่วงเดียวกันซ้ำหลายรอบ
   ทั้งที่เครื่องก็หยุดอยู่ครั้งเดียว — ยิ่งแจ้งละเอียดยิ่งดูเหมือนหยุดนาน ซึ่งกลับหัวกลับหาง
   จึงเอาช่วงเวลาของทุกใบบนเครื่องนั้นมาเรียงแล้วรวมช่วงที่ทับกันเข้าด้วยกันก่อน

   ═══ แล้วทำไมยังต้องมีเพดานอีก ═══
   สิงหาคมมี 31 วันบนปฏิทิน แต่ช่อง "ชั่วโมงทำงาน" อาจกรอกไว้ 576 ชม. (= 24 วัน)
   เครื่องที่หยุดทั้งเดือนจึงได้ 744 ชม. จากปฏิทิน ซึ่งเกินชั่วโมงที่มันควรเดิน
   ปัดลงให้ไม่เกินโควตา แล้วรายงานว่าปัดกี่เครื่อง — ไม่ซ่อนว่ามีการปัด */
function breakdownSpan(list, win, kind) {
  const nowMs = Date.now();
  const byMachine = {};
  let count = 0;
  list.forEach((t) => {
    if (!isProductionStop(t, win.group)) return;
    const sp = stopSpan(t, kind, nowMs);
    if (!sp) return;
    const a = Math.max(sp[0], win.from), b = Math.min(sp[1], win.to);
    if (b <= a) return;                                   // ไม่แตะหน้าต่างนี้เลย
    (byMachine[t.machine_name || "—"] ||= []).push([a, b]);
    count++;
  });

  const cap = win.cap > 0 ? win.cap : Infinity;
  let hours = 0, capped = 0, merged = 0;
  Object.values(byMachine).forEach((spans) => {
    spans.sort((x, y) => x[0] - y[0]);
    let ms = 0, s = spans[0][0], e = spans[0][1];
    for (let i = 1; i < spans.length; i++) {
      if (spans[i][0] <= e) {                             // ทับกับช่วงที่ถืออยู่ = เครื่องหยุดต่อเนื่อง
        if (spans[i][1] > e) e = spans[i][1];
        merged++;
      } else { ms += e - s; s = spans[i][0]; e = spans[i][1]; }
    }
    let h = (ms + (e - s)) / 36e5;
    if (h > cap) { capped++; h = cap; }
    hours += h;
  });
  return { hours, count, capped, merged };
}

/** สรุป KPI ของชุดข้อมูลที่ส่งเข้ามา
    @param {object} [win] ขอบเขตปฏิทินจาก periodWindow() — ไม่ส่ง = ใช้วิธีเดิม (ไม่ตัดตามเดือน) */
function kpiSummary(list, slaHours = 72, pm = {}, repeatWin = 30, win = null) {
  const done = list.filter((t) => t.status === STATUS.DONE);
  const open = list.filter((t) => t.status !== STATUS.DONE);
  const durations = done.map(waitHours).filter((h) => h !== null);
  const wrench    = done.map(wrenchHours).filter((h) => h !== null);
  const onTime   = done.filter((t) => closedOnTime(t, slaHours)).length;
  const cost     = list.reduce((s, t) => s + (Number(t.cost) || 0), 0);
  const reworked = done.filter((t) => (Number(t.reject_count) || 0) > 0).length;
  const verified = done.filter((t) => t.verification_status).length;   // ใบที่ผ่านการตรวจรับจริง
  const paid     = list.map((t) => Number(t.cost) || 0).filter((c) => c > 0);
  const overdue  = open.filter((t) => isOverdue(t, slaHours)).length;
  const downtime = durations.reduce((a, b) => a + b, 0);
  const bdGroup = (win && win.group) || "";
  const prod = done.filter((t) => isProductionStop(t, bdGroup));
  const stops  = prod.map(waitHours).filter((h) => h !== null);
  const hands  = prod.map(wrenchHours).filter((h) => h !== null);
  // 1 ใบนับได้ครั้งเดียว ถึงจะถูกจับคู่ซ้ำกับใบก่อนหน้าหลายคู่ก็ตาม
  const repeatCases = new Set(findRepeats(list, repeatWin).map((r) => r.curr.ticket_id)).size;
  /* มีหน้าต่างเวลา = ตัดตามปฏิทิน · ไม่มี = วิธีเดิม (ใบที่ปิดในชุดที่ส่งมา ไม่ตัดเดือน)
     เก็บทางเดิมไว้เพราะมีที่เรียก kpiSummary โดยไม่มีบริบทเดือน เช่นตอนส่งออก Excel รายปี */
  const bdWait   = win ? breakdownSpan(win.all || list, win, "wait")
                       : { hours: stops.reduce((a, b) => a + b, 0), count: stops.length, capped: 0 };
  const bdWrench = win ? breakdownSpan(win.all || list, win, "wrench")
                       : { hours: hands.reduce((a, b) => a + b, 0), count: hands.length, capped: 0 };
  const machineDowntime = bdWait.hours;
  const machineWrench   = bdWrench.hours;
  const fleet = productionFleet(bdGroup);
  const availHours = (pm && pm.workHours) ? pm.workHours * fleet : 0;

  return {
    total: list.length,
    done:  done.length,
    open:  open.length,
    cost,
    costPerTicket: list.length ? cost / list.length : 0,
    costMedian: median(paid),
    paidCount: paid.length,
    mttr:      durations.length ? downtime / durations.length : null,
    mttrMedian: median(durations),
    downtime,
    onTime,
    onTimeRate: pct(onTime, done.length),
    doneRate:   pct(done.length, list.length),
    // ไม่มีใบไหนถูกตรวจรับเลย = ไม่รู้ผล ไม่ใช่ 100% — ต้องคืน null ไม่งั้นรายงานหลอกผู้บริหาร
    firstTimeFix: verified ? pct(verified - reworked, verified) : null,
    verified,
    reworked,
    overdue,
    // ── KPI ที่ยกมาจากระบบเดิม ──
    /* ═══ %ซ่อมซ้ำ มีสองนิยาม เก็บทั้งคู่ ═══
       ไฟล์ KPI Report ของแผนกใช้ "จำนวนเคสที่ซ่อมซ้ำ ÷ จำนวนใบแจ้งซ่อมทั้งหมด"
       ซึ่งเป็นตัวที่ผู้ตรวจ ISO อ่าน ตัวเลขบนหน้าจอจึงต้องเป็นตัวเดียวกัน

       แบบนับเครื่องยังมีประโยชน์ แต่ตอบคนละคำถาม —
       "ของเสียกระจุกอยู่ที่เครื่องไหน" ไม่ใช่ "งานซ้ำเป็นสัดส่วนเท่าไหร่ของงานทั้งหมด"
       จึงย้ายไปเป็นบรรทัดสองแทนที่จะทิ้ง

       ใช้กรอบวันเดียวกับแท็บ "รายการซ่อมซ้ำ" เพื่อให้สองหน้าไม่พูดคนละเรื่อง */
    repeatCases,
    repeatRate: pct(repeatCases, list.length),                // ตรงกับไฟล์ KPI Report
    repeatMachineRate: repeatByCount(list).rate,              // นับเครื่อง (ของเดิม)
    repeatWin,
    wrenchTotal: wrench.reduce((a, b) => a + b, 0),
    wrenchMedian: median(wrench),
    wrenchCount: wrench.length,
    machineDowntime,
    machineWrench,
    machineStops: bdWait.count,
    machineHandsCount: bdWrench.count,
    // ตัดตามเดือนแล้วหรือยัง และมีเครื่องไหนชนเพดานบ้าง — หน้าจอต้องบอกได้ ไม่ใช่ปัดเงียบ ๆ
    breakdownClipped: !!win,
    cappedMachines: bdWait.capped,
    mergedTickets: bdWait.merged || 0,
    /* ═══ ตัวหารต้องเป็นชั่วโมงของ "ทั้งกองเครื่อง" ไม่ใช่ของเครื่องเดียว ═══
       ตัวเศษคือผลรวมเวลาที่เครื่องหยุดของทุกเครื่องรวมกัน — เครื่อง 5 ตัวพังพร้อมกัน
       ตัวละ 3 วัน ได้ตัวเศษ 15 วัน ทั้งที่ปฏิทินเดินไปแค่ 3 วัน
       ถ้าหารด้วยชั่วโมงของเครื่องเดียว จะได้เปอร์เซ็นต์ทะลุ 100 ได้เรื่อย ๆ
       (เจอจริง: 409.4% — ซึ่งไม่มีความหมายอะไรเลยนอกจากบอกว่าสูตรผิด)

       ช่อง "ชั่วโมงทำงาน" ที่กรอกคือของเครื่องหนึ่งตัว ระบบคูณจำนวนเครื่องให้เอง
       จะได้ไม่ต้องกลับมาแก้ตัวเลขทุกครั้งที่เพิ่มหรือถอดเครื่องออกจากทะเบียน */
    fleet,
    availHours,
    bdGroup,
    breakdownRate: availHours
      ? Math.round((machineDowntime / availHours) * 1000) / 10
      : null,
    wrenchRate: availHours
      ? Math.round((machineWrench / availHours) * 1000) / 10
      : null,
    pmRate: pm && pm.pmPlan ? pct(pm.pmDone, pm.pmPlan) : null,             // % การทำ PM
  };
}

/** นับเป็นตาราง 2 มิติสำหรับ Heatmap */
function heatData(list, mode) {
  if (mode === "weekday") {
    const rows = WEEKDAY_TH.map((label) => ({ label, cells: TIME_BUCKETS.map(() => 0) }));
    list.forEach((t) => {
      if (!t.created_at) return;
      const d = new Date(t.created_at);
      if (isNaN(d)) return;
      rows[d.getDay()].cells[Math.min(5, Math.floor(d.getHours() / 4))]++;
    });
    return { cols: TIME_BUCKETS, rows };
  }
  // เครื่องจักร × เดือน
  const byMachine = {};
  list.forEach((t) => {
    if (!t.created_at) return;
    const d = new Date(t.created_at);
    if (isNaN(d)) return;
    if (!t.machine_name) return;      // งานอาคาร/ห้องน้ำ ไม่มีเครื่อง อย่าให้เป็นแถวไร้ชื่อ
    (byMachine[t.machine_name] ||= Array(12).fill(0))[d.getMonth()]++;
  });
  const rows = Object.entries(byMachine)
    .map(([label, cells]) => ({ label, cells, sum: cells.reduce((a, b) => a + b, 0) }))
    .sort((a, b) => b.sum - a.sum)
    .slice(0, 12);
  return { cols: MONTHS(), rows };
}

function heatColor(v, max) {
  if (!v) return { bg: HEAT_SCALE[0], fg: "#cbd5e1" };
  const i = Math.min(HEAT_SCALE.length - 1, 1 + Math.floor((v / max) * (HEAT_SCALE.length - 2)));
  return { bg: HEAT_SCALE[i], fg: i >= 4 ? "#fff" : "#7c2d12" };
}

/* ═══════════ สถานะการเชื่อมต่อ ═══════════ */
function setFlowChip(text, cls) {
  const el = $("#flowStatus");
  if (!el) return;
  el.textContent = text;
  el.className = "flow-chip " + cls;
}

/* ═══════════ สิทธิ์เข้าถึง ═══════════
   หน้าแจ้งซ่อม + ติดตามสถานะ + ตรวจรับ ISO = เปิดให้ทุกคน
   Dashboard + Export + แก้ไขใบงาน = ต้องปลดล็อก

   การกรองและการตรวจสิทธิ์จริงทำที่ฝั่ง server (Code.gs)
   ฝั่งนี้แค่ซ่อนปุ่ม — ถ้ากรองแต่ฝั่งนี้ ใครเปิด DevTools ก็เห็นอยู่ดี   */
const getToken = () => { try { return sessionStorage.getItem(TOKEN_KEY) || ""; } catch (_) { return ""; } };
const isUnlocked = () => !!getToken();

/* ผู้ใช้ที่ล็อกอินอยู่ {email, name, role}
   TECH = ช่าง  ·  LEAD/ENG = หัวหน้างานขึ้นไป  ·  Requester ไม่ต้องล็อกอิน */
let ME = null;
const RANK_OF = { TECH: 1, LEAD: 2, ENG: 2, ADMIN: 3 };
const isLead = () => !!ME && (RANK_OF[ME.role] || 0) >= 2;
const ROLE_LABEL = { TECH: "ช่างซ่อมบำรุง", LEAD: "หัวหน้างาน/ผู้จัดการ",
                     ENG: "วิศวกร", ADMIN: "ผู้ดูแลระบบ" };

function setMe(user) {
  ME = user || null;
  try { sessionStorage.setItem("mt_me", JSON.stringify(ME)); } catch (_) {}
  loadSeen();          // คนละคน = คนละกองแจ้งเตือน ต้องอ่านของคนใหม่ขึ้นมาแทน
}

function loadMe() {
  try { ME = JSON.parse(sessionStorage.getItem("mt_me") || "null"); } catch (_) { ME = null; }
  loadSeen();          // คีย์ของกระดิ่งผูกกับชื่อคน เพิ่งรู้ว่าเป็นใครก็ตอนนี้
}

async function login(email, pin) {
  const data = await gs("apiLogin", email, pin);
  try { sessionStorage.setItem(TOKEN_KEY, data.token); } catch (_) {}
  setMe(data.user);
  return data;
}

function dropToken() {
  paramData = { rows: [], machines: [], limits: [] };
  try { sessionStorage.removeItem(TOKEN_KEY); } catch (_) {}
  clearCache();                       // ข้อมูล scope full ต้องไม่ค้างในเครื่อง
}

function logout() {
  setMe(null);
  dropToken();
  applyLock();
  showTab("list");
  toast("ออกจากระบบแล้ว");
  refresh();                          // ดึงใหม่เป็นชุด public
}

/** token หมดอายุระหว่างใช้งาน — พากลับไปหน้าล็อกอินแทนขึ้น error ดิบ */
function forceRelogin() {
  if (!isUnlocked()) return;
  dropToken();
  applyLock();
  toast("เซสชันหมดอายุ (8 ชม.) กรุณาเข้าสู่ระบบใหม่", false);
  refresh();
}

/** ซ่อน/แสดงส่วนที่ต้องใช้สิทธิ์ */
/* รูปผู้ใช้จากคอลัมน์ "รูป" ในชีต Users — ไม่มีรูปก็ใช้อักษรย่อของชื่อแทน */
function avatarHtml(u) {
  const initial = esc((u.name || "?").trim().charAt(0));
  const img = u.photo ? `<img src="${esc(u.photo)}" alt="" onerror="this.remove()">` : "";
  return `<span class="avatar">${initial}${img}</span>`;
}

function applyLock() {
  /* token ยังอยู่แต่ไม่รู้ว่าใคร — เกิดได้เมื่อ sessionStorage โดนล้างครึ่ง ๆ หรืออัปเดตเวอร์ชัน
     ถ้าปล่อยผ่าน บรรทัดที่อ่าน ME.name ข้างล่างจะ throw แล้วลากทั้งหน้าไปขาวทั้งใบ */
  if (isUnlocked() && !ME) dropToken();
  const on = isUnlocked() && !!ME;
  const lead = isLead();                 // Dashboard/Export เป็นงานบริหาร เฉพาะหัวหน้างานขึ้นไป
  const onReport = $("#tab-report").dataset.active === "1";

  $("#tab-report").classList.toggle("hidden", !lead || !onReport);
  $("#lockScreen").classList.toggle("hidden", lead || !onReport);
  $("#exportBtn").classList.toggle("hidden", !lead);
  $("#logoutBtn").classList.toggle("hidden", !on);
  $("#loginBtn").classList.toggle("hidden", on);
  // ช่างที่ล็อกอินแล้วไม่ต้องเห็นปุ่มล็อกอินซ้ำในหน้าที่ยังเข้าไม่ได้ ให้เห็นเหตุผลอย่างเดียวพอ
  $("#lockLoginBtn").classList.toggle("hidden", on);
  $("#lockBadge").classList.toggle("hidden", !lead);
  /* เมนูที่ไม่มีประโยชน์กับคนที่ยังไม่ล็อกอิน ให้หายไปเลยดีกว่าโชว์แล้วกดไม่ได้
     คนนอกที่เข้ามาแจ้งซ่อมจะเหลือแค่ 2 เมนูที่เขาใช้จริง — ติดตามสถานะ กับ แจ้งซ่อมใหม่ */
  $$(".needs-login").forEach((el) => el.classList.toggle("hidden", !on));

  // token หมดอายุระหว่างใช้งาน แล้วค้างอยู่บนหน้าที่เพิ่งถูกซ่อน = กดอะไรไม่ได้เลย
  if (!on && NEED_LOGIN.includes(currentTab)) showTab("list");

  /* ลิงก์ข้ามไประบบ Stock อะไหล่ — ขึ้นเฉพาะคนที่ล็อกอินและเฉพาะเมื่อตั้ง URL ไว้จริง
     ปุ่มที่กดแล้วไปหน้า error แย่กว่าไม่มีปุ่ม */
  const stock = $("#navStock");
  const hasStock = on && !!CONFIG.stockUrl;
  stock.href = CONFIG.stockUrl || "#";
  stock.classList.toggle("hidden", !hasStock);
  $("#navExtHead").classList.toggle("hidden", !hasStock);

  const who = $("#whoami");
  who.classList.toggle("hidden", !on);
  who.classList.toggle("flex", on);
  if (on && ME) who.innerHTML = avatarHtml(ME) +
    `<div class="min-w-0 text-left leading-tight">
       <div class="truncate font-bold text-white text-xs">${esc(ME.name)}</div>
       <div class="truncate">${esc(ROLE_LABEL[ME.role] || ME.role)}</div>
     </div>`;

  // ช่างที่ล็อกอินแล้วแต่ยังไม่มีสิทธิ์ดู Dashboard ต้องรู้ว่าทำไมถึงเข้าไม่ได้
  const note = $("#lockNote");
  if (note) {
    note.classList.toggle("hidden", !on || lead);
    if (on && !lead) note.textContent =
      `บัญชี ${ME.name} เป็น${ROLE_LABEL[ME.role] || ME.role} จึงยังไม่เห็นหน้านี้ — ต้องเป็นหัวหน้างานขึ้นไป`;
  }
}

/* ═══════════ สร้างใบแจ้งซ่อม ═══════════ */
/* ต้องตรงกับ needsMachine_ ฝั่ง server — งานอาคาร ห้องน้ำ ไฟถนน ไม่มีเครื่องให้เลือก */
const needsMachine = (workType) => String(workType || "").includes("เครื่องจักร");

function syncMachineRequired() {
  const need = needsMachine($("#workType").value);
  const sel = $("#machineSelect");
  sel.required = need;
  if (!need) sel.value = "";                 // กันค่าเก่าค้างจากตอนเลือกลักษณะงานอื่น
  sel.disabled = !need;
  sel.classList.toggle("opacity-60", !need);
  $("#machineReq").classList.toggle("hidden", !need);
  $("#machineOpt").classList.toggle("hidden", need);
  $("#machineHint").textContent = need
    ? "ไม่พบเครื่องที่ต้องการ? แจ้งผู้ดูแลเพิ่มในทะเบียนเครื่องจักรก่อน"
    : "ลักษณะงานนี้ไม่ต้องระบุเครื่องจักร";

  // อธิบายว่าประเภทที่เพิ่งเลือกหมายถึงงานแบบไหน — เลือกผิดแล้วสถิติรายประเภทเพี้ยนทั้งปี
  const hint = $("#workTypeHint");
  if (hint) hint.textContent = WORK_TYPE_HINT[$("#workType").value] || "";
}

async function handleSubmit(e) {
  e.preventDefault();
  const btn = $("#submitBtn");
  const fd  = new FormData(e.target);
  const done = () => { btn.disabled = false; btn.textContent = "ส่งใบแจ้งซ่อม"; };

  // server reject ชื่อที่ไม่อยู่ในทะเบียนแล้ว จึงต้องกันตั้งแต่ตรงนี้ให้ข้อความอ่านง่ายกว่า
  if (!$("#action_needed").value) {
    toast("กรุณาเลือกความต้องการ — ซ่อมเอง หรือ เรียกช่างซ่อมบำรุง", false);
    return;
  }
  const machine = needsMachine($("#workType").value) ? $("#machineSelect").value : "";
  if (needsMachine($("#workType").value)) {
    if (!machine) { toast("ลักษณะงานเป็นเครื่องจักร ต้องเลือกเครื่องจักรด้วย", false); return; }
    if (!MACHINES.some((m) => m.name === machine)) {
      toast("เครื่องจักรนี้ไม่อยู่ในทะเบียน — แจ้งผู้ดูแลให้เพิ่มในชีต \"ทะเบียนเครื่องจักร\" ก่อน", false);
      return;
    }
  }
  if (!String(fd.get("description") || "").trim()) {
    toast("กรุณากรอกรายละเอียดอาการเสีย", false); return;
  }

  btn.disabled = true;
  btn.textContent = "กำลังส่ง...";

  // ใช้รูปที่บีบอัดไว้ตอนเลือกไฟล์ ไม่บีบซ้ำ (รูป 8MB บีบรอบละ 2-3 วินาที)
  let image = pendingImage;
  const file = $("#photo").files[0];
  if (file && !image) {
    try { image = await compressImage(file); }
    catch (err) { toast(err.message, false); done(); return; }
  }

  const payload = {
    machine_name:   machine,
    description:    String(fd.get("description") || "").trim(),
    cause:          String(fd.get("cause") || "").trim(),
    action_needed:  String(fd.get("action_needed") || "").trim(),
    reporter:       String(fd.get("reporter") || "").trim(),
    department:     String(fd.get("department") || "").trim(),
    work_type:      fd.get("work_type") || "",
    priority:       fd.get("priority") || PRIORITY_DEFAULT,
    image_base64:   image ? image.full : "",
  };

  try {
    // server เป็นคนออกเลขที่ (ล็อกชีตไว้) ไม่งั้นสองคนแจ้งพร้อมกันจะได้เลขซ้ำ
    const res = await gs("apiCreateTicket", payload);
    /* ใบเข้าระบบแล้วแต่รูปไม่ผ่าน — ต้องบอกให้ชัดว่าอะไรสำเร็จอะไรไม่สำเร็จ
       ไม่ใช่ขึ้น "เรียบร้อย" เฉย ๆ แล้วปล่อยให้ไปงงทีหลังว่ารูปหายไปไหน */
    if (res.imageWarning) {
      toast(`ส่งใบ ${res.ticket_id} แล้ว แต่แนบรูปไม่สำเร็จ — ${res.imageWarning}`, false);
    } else {
      toast(`ส่งใบแจ้งซ่อม ${res.ticket_id} เรียบร้อย`);
    }
    e.target.reset();
    pendingImage = null;
    $("#photoPreview").classList.add("hidden");
    $("#photoInfo").textContent = "";
    setPriority(PRIORITY_DEFAULT);
    await refresh();
    showTab("list");                      // ย้ายหน้าเฉพาะตอนสำเร็จจริงเท่านั้น
  } catch (err) {
    toast("ส่งใบแจ้งซ่อมไม่สำเร็จ: " + err.message, false);
  } finally {
    done();
  }
}

/* ═══════════ เปลี่ยนสถานะ / ตรวจรับ ISO ═══════════ */

/**
 * @param {Object} opts { verify: true } = ใช้ช่องทางตรวจรับที่ไม่ต้องล็อกอิน
 * อัปเดตหน้าจอทันทีเพื่อให้ลื่น แต่ถ้า server ปฏิเสธต้องย้อนกลับ ไม่ใช่ปล่อยให้จอโกหก
 */
async function updateTicket(id, changes, msg, opts = {}) {
  const i = tickets.findIndex((x) => x.ticket_id === id);
  if (i === -1) return;
  const snapshot = { ...tickets[i] };

  tickets[i] = { ...tickets[i], ...changes };
  save(); render(); closeModal();

  try {
    if (opts.verify) await gs("apiVerifyTicket", id, changes);
    else             await gsAuth("apiUpdateTicket", id, changes);
    toast(msg);
  } catch (err) {
    tickets[i] = snapshot;                 // ย้อนกลับให้ตรงกับความจริงบนชีต
    save(); render();
    toast("บันทึกไม่สำเร็จ: " + err.message, false);
  }
  refresh();
}

function techAction(id, next) {
  const t = tickets.find((x) => x.ticket_id === id) || {};

  // ส่งเฉพาะฟิลด์ที่ช่างกรอกจริง — started_at / completed_at / repair_minutes
  // ปล่อยให้ server ประทับเวลาและคำนวณเอง ไม่งั้นแก้ตัวเลข MTTR จาก DevTools ได้
  const changes = { status: next };
  const tech = $$("#mTech .chip.active").map((c) => c.dataset.tech).join(", ");
  const act  = $("#mAction")?.value.trim();
  const cost = $("#mCost")?.value;
  const min  = $("#mMin")?.value;

  if (tech) changes.technician = tech;
  if (act)  changes.repair_action = act;
  if (cost !== undefined && cost !== "") changes.cost = Number(cost) || 0;
  if (min && Number(min) > 0) changes.repair_minutes = Number(min);   // กรอกเองถือว่าทับค่าคำนวณ

  /* ส่งค่าว่างไปด้วยโดยตั้งใจ — ลบชื่อร้านทิ้งแล้วต้องลบจริง ไม่ใช่ค้างของเก่าไว้
     เช็คว่ามีช่องอยู่บนจอไหม ไม่ใช่เช็คว่ามีค่าไหม */
  if ($("#mVendor")) changes.vendor = $("#mVendor").value.trim();
  if ($("#mBack"))   changes.expect_back = $("#mBack").value;

  /* ส่งของออกไปแล้วไม่รู้ว่าอยู่ที่ไหน = ของหาย ช่องนี้จึงบังคับเฉพาะตอนกดส่งออก
     ไม่บังคับตอนอื่น เพราะงานส่วนใหญ่ซ่อมเองในโรงงาน */
  if (next === STATUS.OUT && !changes.vendor) {
    toast("กรุณาระบุผู้รับซ่อมภายนอก — ไม่งั้นไม่มีใครรู้ว่าของอยู่ที่ไหน", false);
    return;
  }

  if (next === STATUS.VERIFY) {
    if (!changes.repair_action && !t.repair_action) {
      toast("กรุณากรอก \"การซ่อม\" ก่อนส่งตรวจรับ (ISO ต้องมีบันทึกการแก้ไข)", false);
      return;
    }
    changes.verification_status = "รอตรวจรับ";
    updateTicket(id, changes, "ส่งงานให้ฝ่ายผลิตตรวจสอบแล้ว");
  } else {
    updateTicket(id, changes, `เปลี่ยนสถานะเป็น "${next}"`);
  }
}

/** ISO sign-off A) อนุมัติ — ผ่าน apiVerifyTicket ฝ่ายผลิตไม่ต้องล็อกอิน */
function approve(id) {
  const name = $("#mVerifier").value.trim();
  if (!name) { toast("กรุณากรอกชื่อผู้ตรวจรับงาน", false); return; }
  updateTicket(id, {
    verification_status: "อนุมัติ",
    verified_by: name,
    rejection_note: "",
    // status / verified_at / repair_minutes → server จัดการให้เอง
    status: STATUS.DONE,
    verified_at: new Date().toISOString(),
    rating: starValue($("#mStarsWrap [data-stars]")),
    comment: $("#mComment")?.value.trim() || "",
  }, `ตรวจรับงาน ${id} เรียบร้อย`, { verify: true });
}

/** ISO sign-off B) ส่งกลับแก้ไข */
function reject(id) {
  const name = $("#mVerifier").value.trim();
  const note = $("#mReject").value.trim();
  if (!name) { toast("กรุณากรอกชื่อผู้ตรวจรับงาน", false); return; }
  if (!note) { toast("กรุณาระบุสาเหตุที่ต้องแก้ไขเพิ่ม", false); return; }
  const t = tickets.find((x) => x.ticket_id === id) || {};
  updateTicket(id, {
    verification_status: "ส่งกลับแก้ไข",
    verified_by: name,
    rejection_note: note,
    // ค่าด้านล่างใส่ไว้ให้หน้าจอขยับทันที — server จะคำนวณทับให้ตรงอยู่ดี
    status: STATUS.REPAIR,
    verified_at: new Date().toISOString(),
    reject_count: (Number(t.reject_count) || 0) + 1,
    completed_at: "",
  }, `ส่งงาน ${id} กลับให้ช่างแก้ไขแล้ว`, { verify: true });
}

/* ═══════════ MODAL ═══════════ */
/* ช่วงเวลาสำเร็จรูป — แค่เติมค่าลงช่องวันที่ ตัวกรองจริงอ่านจากสองช่องนั้นอย่างเดียว */
function applyDatePreset() {
  const v = $("#datePreset").value;
  const now = new Date();
  const set = (from, to) => {
    $("#dateFrom").value = from ? ymd(from) : "";
    $("#dateTo").value   = to ? ymd(to) : "";
  };
  const back = (days) => new Date(now.getTime() - days * 864e5);

  if (v === "today")          set(now, now);
  else if (v === "7")         set(back(6), now);
  else if (v === "30")        set(back(29), now);
  else if (v === "month")     set(new Date(now.getFullYear(), now.getMonth(), 1), now);
  else if (v === "lastmonth") set(new Date(now.getFullYear(), now.getMonth() - 1, 1),
                                  new Date(now.getFullYear(), now.getMonth(), 0));
  else set("", "");
  render();
}

/* นาฬิกาบนหัวเว็บ ใช้ปี พ.ศ. ให้ตรงกับเลขที่ใบแจ้งซ่อม */
function startClock() {
  const et = $("#clockTime"), ed = $("#clockDate");
  if (!et) return;
  const DAY = ["อาทิตย์", "จันทร์", "อังคาร", "พุธ", "พฤหัสบดี", "ศุกร์", "เสาร์"];
  const MON = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.",
               "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
  const p2 = (x) => String(x).padStart(2, "0");
  const tick = () => {
    const n = new Date();
    et.textContent = `${p2(n.getHours())}:${p2(n.getMinutes())}:${p2(n.getSeconds())}`;
    ed.textContent = `${DAY[n.getDay()]} ${n.getDate()} ${MON[n.getMonth()]} ${yearLabel(n.getFullYear())}`;
  };
  tick();
  setInterval(tick, 1000);
}

/* ─────────── ข้อความสำหรับวางในแชทไลน์ ─────────── */
function lineText(t) {
  const L = [
    `🔧 ${t.ticket_id}  [${t.priority || PRIORITY_DEFAULT}]`,
    `เครื่อง: ${t.machine_name || "-"}`,
    `อาการ: ${symptom(t) || "-"}`,
  ];
  if (t.description && t.cause) L.push(`สาเหตุ: ${t.cause}`);
  L.push(`ผู้แจ้ง: ${t.reporter || "-"}${t.department ? " (" + t.department + ")" : ""}`);
  L.push(`แจ้งเมื่อ: ${fmtDT(t.created_at)}`);
  L.push(`กำหนดเสร็จ: ${t.due_at ? fmtDT(t.due_at) : "-"}`);
  L.push(`ผู้รับผิดชอบ: ${t.assignee || "ยังไม่มอบหมาย"}`);
  L.push(`สถานะ: ${t.status}`);
  if (t.pr_no) L.push(`เลขที่ PR: ${t.pr_no}`);
  if (t.image_url) L.push(`รูป: ${t.image_url}`);
  L.push(`เปิดใบงาน: ${CONFIG.webAppUrl || location.href}`);
  return L.join("\n");
}

function openLineText(id) {
  const t = tickets.find((x) => x.ticket_id === id);
  if (!t) return;
  openCopyBox("ข้อความสำหรับส่งในไลน์", lineText(t));
}

/* คลิปบอร์ดอัตโนมัติถูกบล็อกบ่อยใน iframe ของ GAS จึงต้องโชว์ข้อความให้เลือกเองได้เสมอ
   ใช้ร่วมกันทั้งใบแจ้งซ่อมรายใบและสรุปงาน PM รายเดือน */
function openCopyBox(title, text) {
  $("#m2Title").textContent = title;
  $("#m2Body").innerHTML = `
    <textarea id="lineBox" class="inp" rows="11" readonly
              style="font-size:14px;line-height:1.7"></textarea>
    <div class="flex flex-wrap items-center gap-3">
      <button id="lineCopy" class="btn" style="background:var(--brand)">📋 คัดลอกข้อความ</button>
      <span id="lineMsg" class="text-sm text-slate-500"></span>
    </div>
    <p class="text-xs text-slate-400">ถ้าปุ่มคัดลอกไม่ทำงาน ให้กดค้างในช่องด้านบนแล้วเลือกทั้งหมดเอง</p>`;
  $("#lineBox").value = text;

  $("#lineCopy").onclick = async () => {
    let ok = false;
    try {
      await navigator.clipboard.writeText(text);
      ok = true;
    } catch (_) {
      const box = $("#lineBox");
      box.removeAttribute("readonly");
      box.focus();
      box.setSelectionRange(0, text.length);   // iOS ไม่สนใจ select() เปล่า ๆ ต้องระบุช่วง
      try { ok = document.execCommand("copy"); } catch (__) {}
      box.setAttribute("readonly", "");
    }
    $("#lineMsg").textContent = ok
      ? "✅ คัดลอกแล้ว เปิดไลน์แล้ววางได้เลย"
      : "คัดลอกอัตโนมัติไม่ได้ — เลือกข้อความในช่องด้านบนเองครับ";
  };
  $("#modal2").classList.remove("hidden");
}

    <div class="flex flex-wrap items-center gap-2 text-sm">
      ${priBadge(t.priority)}

      ${t.assignee ? `<span class="text-slate-500">· ผู้รับผิดชอบ ${esc(t.assignee)}</span>` : ""}
    </div>
    <dl class="space-y-3 border-t border-slate-100 pt-4">
      ${row("รายละเอียดอาการ", symptom(t))}
      ${t.description && t.cause ? row("สาเหตุ", t.cause) : ""}

      class="inline-flex items-center gap-2 text-sm font-semibold" style="color:var(--brand)">
      📷 เปิดดูรูปที่แนบไว้ (Google Drive)</a>`;

  if (t.rejection_note) {

function openMachineHistory(name) {
  const list = tickets.filter((t) => t.machine_name === name)
                      .sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)));
  const info = MACHINES.find((m) => m.name === name);
  const stat = machineStats(list, findRepeats(list, 30))[0] ||
               { count: 0, cost: 0, downtime: 0, mttr: null, repeat: 0 };

  // MTBF = ช่วงเวลาที่เครื่องเดินได้ หารด้วยจำนวนครั้งที่เสีย
  let mtbf = null;
  const times = list.map((t) => new Date(t.created_at)).filter((d) => !isNaN(d)).sort((a, b) => a - b);
  if (times.length > 1) mtbf = (times[times.length - 1] - times[0]) / 36e5 / (times.length - 1);

  $("#m2Title").innerHTML = `📈 ${esc(name)}` +
    (info && info.location ? `<span class="text-sm font-normal text-slate-500 ml-2">${esc(info.location)}</span>` : "");

  $("#m2Body").innerHTML = `
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
      ${[{ ico: "🧾", bg: "#e0e7ff", fg: "#3730a3", label: "แจ้งซ่อมทั้งหมด", num: nf(stat.count) },
         { ico: "💰", bg: "#fef9c3", fg: "#854d0e", label: "ค่าใช้จ่ายสะสม", num: money(stat.cost) },
         { ico: "⏱", bg: "#ffedd5", fg: "#9a3412", label: "เวลาแจ้งถึงปิดงาน (เฉลี่ย)",
           num: stat.mttr === null ? "-" : fmtDuration(stat.mttr) },
         { ico: "🔁", bg: "#dcfce7", fg: "#166534", label: "MTBF เสียห่างกันเฉลี่ย",
           num: mtbf === null ? "-" : fmtDuration(mtbf) },
        ].map(statCard).join("")}
    </div>
    ${info ? `<p class="text-sm text-slate-500">รหัส ${esc(info.code) || "-"} · กลุ่ม ${esc(info.group)}${
      info.owner ? " · ผู้ดูแล " + esc(info.owner) : ""}</p>` : ""}
    <div class="overflow-x-auto">
      <table class="w-full text-sm"><thead><tr>
        <th class="th">เลขที่</th><th class="th">วันที่แจ้ง</th><th class="th">อาการ</th>
        <th class="th">การซ่อม</th><th class="th num">ค่าใช้จ่าย</th><th class="th">สถานะ</th>
      </tr></thead><tbody>${list.length ? list.map((t) => `<tr>
        <td class="td font-semibold" style="color:var(--brand)">${esc(t.ticket_id)}</td>

        <td class="td"><span class="badge ${BADGE[t.status]}">${esc(t.status)}</span></td>

/* ─────────── ใบแจ้งซ่อม PDF สำหรับเอกสาร ISO ─────────── */
/** รับ base64 จาก server แล้วสั่งดาวน์โหลด — ใช้ร่วมกันทั้ง FM-MT-04 และ FM-MT-05 */
function savePdfBlob(res) {
  const bin = atob(res.base64);
  const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  const url = URL.createObjectURL(new Blob([buf], { type: "application/pdf" }));
  const a = document.createElement("a");
  a.href = url; a.download = res.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

async function downloadPdf(id, btn) {
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = "กำลังสร้าง PDF...";
  try {
    const res = await gsAuth("apiTicketPdf", id);
    const bin = atob(res.base64);
    const buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([buf], { type: "application/pdf" }));
    const a = document.createElement("a");
    a.href = url; a.download = res.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast(`ดาวน์โหลด ${res.name} แล้ว`);
  } catch (err) {
    toast("สร้าง PDF ไม่สำเร็จ: " + err.message, false);
  } finally {
    btn.disabled = false; btn.textContent = old;
  }
}

  if (!why) { toast("กรุณาระบุเหตุผลที่ยกเลิก", false); return; }
  updateTicket(id, { status: STATUS.CANCEL, cancel_reason: why },
    `ยกเลิกใบ ${id} แล้ว — กู้คืนได้จากชิป "ยกเลิก"`);
}

function restoreTicket(id) {
  // กลับไปเป็น "รอซ่อม" เสมอ ไม่พยายามเดาสถานะก่อนถูกยกเลิก เพราะไม่ได้เก็บไว้
  updateTicket(id, { status: STATUS.WAIT, cancel_reason: "" }, `กู้คืนใบ ${id} แล้ว`);
}

function savePlan(id) {
  const t = tickets.find((x) => x.ticket_id === id) || {};
  const priority = $("#mPri").value;
  const dueRaw = $("#mDue").value;

  const picked = $$("#mAssign .chip.active").map((c) => c.dataset.assign);
  const changes = { priority, assignee: picked.join(", "), pr_no: $("#mPr").value.trim() };
  // ระบุวันมาเองก็ใช้ตามนั้น ถ้าเปลี่ยนระดับแล้วเว้นว่าง ให้ server คิดกำหนดใหม่จากระดับใหม่
  if (dueRaw) changes.due_at = new Date(dueRaw).toISOString();
  else if (priority === t.priority) changes.due_at = t.due_at || "";

  updateTicket(id, changes, `บันทึกการจัดการงาน ${id} แล้ว`);
}

/* ═══════════ หน้าติดตามสถานะ ═══════════ */
/* โครงร่างระหว่างรอข้อมูล — ใส่จำนวนคอลัมน์ให้ตรงกับตารางจริง
   จะได้ไม่เกิดอาการ "หน้ากระตุก" ตอนข้อมูลมาถึงแล้วความกว้างเปลี่ยน */
function skelRows(tbody, cols, rows) {
  if (!tbody) return;
  const w = ["70%", "45%", "85%", "55%", "60%", "40%", "75%", "50%", "30%"];
  tbody.innerHTML = Array.from({ length: rows || 5 }, () =>
    `<tr>${Array.from({ length: cols }, (_, i) =>
      `<td class="td"><span class="skel" style="width:${w[i % w.length]}"></span></td>`).join("")}</tr>`
  ).join("");
}

function statCard({ ico, bg, fg, label, num, sub }) {
  return `<div class="stat">
    <div class="stat-ico" style="background:${bg};color:${fg}">${ico}</div>
    <div class="min-w-0">
      <p class="stat-label">${esc(label)}</p>
      <p class="stat-num">${num}</p>
      ${sub ? `<p class="stat-sub">${esc(sub)}</p>` : ""}
    </div></div>`;
}

/** แถวเดียวใช้ได้ทั้งหน้าติดตามสถานะและหน้างานของฉัน — คอลัมน์ต้องตรงกันทั้งสองที่ */
function ticketRow(t, repeatIds, bulk) {
  const due = dueInfo(t);
  const critical = t.status !== STATUS.DONE && t.priority === "วิกฤต";
  /* data-label คือป้ายที่ขึ้นหน้าค่าเมื่อตารางถูกพับเป็นการ์ดบนมือถือ (ดู .as-cards)
     ต้องตรงกับหัวคอลัมน์ ไม่งั้นบนมือถือจะอ่านแล้วงง */
  return `<tr data-id="${esc(t.ticket_id)}" class="${critical ? "row-critical" : ""}${isDead(t) ? " row-dead" : ""}">
    ${bulk ? `<td class="td bulk-col" data-label="เลือก"><input type="checkbox" class="bulk-cb"
        data-cb="${esc(t.ticket_id)}" aria-label="เลือก ${esc(t.ticket_id)}"${
        bulkSel.has(t.ticket_id) ? " checked" : ""}></td>` : ""}
    <td class="td font-bold whitespace-nowrap" data-label="เลขที่" style="color:var(--brand)">${esc(t.ticket_id)}</td>
    <td class="td font-medium" data-label="เครื่องจักร">${esc(t.machine_name)}
      ${repeatIds.has(t.ticket_id) ? `<span class="tag-repeat">ซ้ำ</span>` : ""}</td>
    <td class="td max-w-[14rem] truncate text-slate-600" data-label="อาการ" title="${esc(symptom(t))}">
      ${esc(symptom(t))}${t.has_image ? " 📷" : ""}</td>
    <td class="td" data-label="ความสำคัญ">${priBadge(t.priority)}</td>
    <td class="td text-slate-600 max-w-[10rem]" data-label="ผู้รับผิดชอบ">${
      t.assignee ? esc(nameList(t.assignee).join(", "))
                 : `<span class="unassigned">ยังไม่มอบหมาย</span>`}</td>
    <td class="td whitespace-nowrap text-slate-600" data-label="วันที่แจ้ง">${fmtDT(t.created_at)}</td>
    <td class="td whitespace-nowrap" data-label="กำหนดเสร็จ"><span class="${due.cls}">${esc(due.text)}</span></td>
    <td class="td" data-label="สถานะ"><span class="badge ${BADGE[t.status]}">${esc(t.status)}</span></td>
    <td class="td text-slate-300 text-center">›</td>
  </tr>`;
}

/* ตัวกรองของหน้ารายการ ทุกอย่างยกเว้น "สถานะ"
   แยกออกมาเพราะตัวเลขบนชิปสถานะกับแถวในตารางต้องมาจากกองเดียวกัน
   เดิมชิปนับจากใบทั้งระบบ เลือกดูเดือนนี้แล้วชิปขึ้น 340 แต่ตารางมีแถวเดียว
   คนเชื่อเลขบนชิปมากกว่านับแถวเอง ตัวเลขที่ไม่ตรงกันจึงเป็นการโกหก ไม่ใช่แค่ไม่สวย */
const ticketScope = (list, f) => list.filter((t) =>
  (!f.pri || (t.priority || PRIORITY_DEFAULT) === f.pri) &&
  (!f.from || ymd(t.created_at) >= f.from) &&
  (!f.to   || ymd(t.created_at) <= f.to) &&
  (!f.q || [t.ticket_id, t.machine_name, t.description, t.reporter, t.assignee]
             .join(" ").toLowerCase().includes(f.q)));

function render() {
  const repeatWin = Number($("#repeatWindow")?.value) || 30;
  const repeatIds = new Set(findRepeats(tickets, repeatWin).map((r) => r.curr.ticket_id));

  // การ์ดสรุปด้านบน
  $("#miniStats").innerHTML = LIVE_STATUSES.map((s) => {
    const m = STATUS_META[s];
    return statCard({ ico: m.ico, bg: m.bg, fg: m.fg, label: s,
                      num: nf(tickets.filter((t) => t.status === s).length) });
  }).join("");

  // ตาราง
  const q = $("#searchBox").value.trim().toLowerCase();
  const pf = $("#priorityFilter")?.value || "";
  const dFrom = $("#dateFrom")?.value || "";
  const dTo   = $("#dateTo")?.value || "";
  const scope = ticketScope(tickets, { pri: pf, from: dFrom, to: dTo, q });

  const rows = scope.filter((t) =>
    filter === "ALL" || t.status === filter
  ).sort((a, b) => {
    // งานที่ยังไม่ปิดขึ้นก่อน แล้วเรียงตามความเร่งด่วน แล้วตามกำหนดเสร็จที่ใกล้ที่สุด
    const openA = a.status !== STATUS.DONE, openB = b.status !== STATUS.DONE;
    if (openA !== openB) return openA ? -1 : 1;
    if (openA) {
      const r = priRank(a.priority) - priRank(b.priority);
      if (r) return r;
      if (a.due_at && b.due_at) return String(a.due_at).localeCompare(String(b.due_at));
    }
    return String(b.created_at).localeCompare(String(a.created_at));
  });

  /* ช่องติ๊กขึ้นเฉพาะหัวหน้างาน — server ปฏิเสธช่างอยู่แล้ว การโชว์ปุ่มที่กดแล้วโดนปฏิเสธ
     คือการหลอกคนใช้ให้เสียเวลา คลาสบน <body> คุมทั้งหัวตารางและช่องในแถวพร้อมกัน */
  const bulk = isLead();
  document.body.classList.toggle("bulk-on", bulk);
  if (!bulk) bulkSel.clear();
  // ใบที่หลุดจากตัวกรองไปแล้วต้องไม่ค้างอยู่ในกองที่เลือกไว้ ไม่งั้นกดแก้โดนใบที่มองไม่เห็น
  const shown = new Set(rows.map((r) => r.ticket_id));
  bulkSel = new Set([...bulkSel].filter((id) => shown.has(id)));

  $("#ticketBody").innerHTML = rows.length
    ? rows.map((t) => ticketRow(t, repeatIds, bulk)).join("")
    : `<tr><td colspan="${bulk ? 10 : 9}" class="empty">— ไม่พบรายการที่ตรงกับเงื่อนไข —</td></tr>`;
  paintBulk();

  // filter chips
  $$("#filterBar .chip").forEach((c) => {
    const s = c.dataset.status;
    c.querySelector("span").textContent =
      s === "ALL" ? scope.length : scope.filter((t) => t.status === s).length;
    c.classList.toggle("active", s === filter);
  });

  // badge งานค้างบนเมนู
  const open = tickets.filter((t) => t.status !== STATUS.DONE && !isDead(t)).length;
  const pill = $("#navCountOpen");
  pill.textContent = open;
  pill.classList.toggle("zero", open === 0);

  renderMine();
  renderDashboard();
  renderBell();
}

/* ═══════════ กระดิ่งแจ้งเตือนในเว็บ ═══════════
   ตั้งใจไม่ทำตารางแจ้งเตือนในชีต ข้อมูลทุกอย่างที่ต้องใช้อยู่ใน tickets ที่โหลดมาแล้ว
   ชีตใหม่หนึ่งใบแปลว่าต้องเขียน ต้องล้างของเก่า ต้องกันแถวบวม และต้องกู้เมื่อพัง
   ทั้งหมดนั้นเพื่อของที่คำนวณใหม่ได้ในสิบบรรทัด

   "อ่านแล้ว" เก็บใน localStorage ของเครื่องที่เปิด ไม่ได้เก็บบนเซิร์ฟเวอร์
   ช่างเปิดจากมือถือตัวเองเป็นหลัก การซิงก์ข้ามเครื่องไม่คุ้มกับความยุ่งที่เพิ่มขึ้น
   ผลข้างเคียงที่ยอมรับ — เปลี่ยนเครื่องแล้วของเก่าเด้งขึ้นมาใหม่รอบเดียว */

/* แยกคีย์ตามคนที่ล็อกอิน เครื่องกลางในโรงงานมีหลายคนใช้สลับกัน
   ถ้าใช้คีย์เดียว ช่างคนแรกกด "อ่านแล้ว" จะไปปิดแจ้งเตือนของคนถัดไปด้วย */
const seenKey = () => "mt_seen:" + (ME?.name || "-");
let seen = new Set();
let bellOpen = false;

function loadSeen() {
  try { seen = new Set(JSON.parse(localStorage.getItem(seenKey()) || "[]")); }
  catch (_) { seen = new Set(); }
}
function saveSeen() {
  try { localStorage.setItem(seenKey(), JSON.stringify([...seen])); } catch (_) {}
}

/** รายการแจ้งเตือน — คำนวณสดจาก tickets ทุกครั้งที่ render() ไม่มีสถานะค้างให้ผิดเพี้ยน */
function notifItems() {
  if (!ME) return [];                     // ยังไม่ล็อกอิน ก็ยังไม่รู้ว่า "ฉัน" คือใคร
  const out = [];
  const today = ymd(Date.now());
  tickets.forEach((t) => {
    if (t.status === STATUS.DONE || isDead(t)) return;
    const label = t.machine_name || t.ticket_id;
    if (isMine(t)) {
      if (t.status === STATUS.WAIT)
        out.push({ key: `new:${t.ticket_id}`, id: t.ticket_id, ico: "🆕",
                   text: tt(`งานใหม่ที่มอบหมายให้คุณ — ${label}`, `New work assigned to you — ${label}`) });
      /* ใส่จำนวนครั้งไว้ในคีย์ ถูกส่งกลับรอบสองต้องเด้งใหม่
         ไม่งั้นคนที่กดอ่านรอบแรกไปแล้วจะไม่มีทางรู้เลยว่ามีรอบสอง */
      if (t.rejection_note && t.status === STATUS.REPAIR)
        out.push({ key: `rej:${t.ticket_id}:${t.reject_count || 1}`, id: t.ticket_id, ico: "↩",
                   text: tt(`ถูกส่งกลับแก้ไข ${t.ticket_id} — ${String(t.rejection_note).slice(0, 60)}`,
                            `Sent back for rework ${t.ticket_id} — ${String(t.rejection_note).slice(0, 60)}`) });
      /* คีย์มีวันที่กำหนดเสร็จอยู่ด้วย พอหัวหน้าเลื่อนกำหนดให้ใหม่แล้วยังเลยอีก ต้องเด้งซ้ำ */
      if (t.due_at && ymd(t.due_at) < today)
        out.push({ key: `late:${t.ticket_id}:${ymd(t.due_at)}`, id: t.ticket_id, ico: "⏰",
                   text: tt(`เลยกำหนดเสร็จแล้ว — ${label}`, `Past its due date — ${label}`) });
      if (backLate(t))
        out.push({ key: `back:${t.ticket_id}:${ymd(t.expect_back)}`, id: t.ticket_id, ico: "📦",
                   text: tt(`เลยกำหนดรับคืนจาก ${t.vendor || "ผู้รับซ่อมภายนอก"} — ${label}`,
                            `Overdue back from ${t.vendor || "the external repairer"} — ${label}`) });
    } else if (isLead() && !t.assignee) {
      out.push({ key: `free:${t.ticket_id}`, id: t.ticket_id, ico: "👤",
                 text: tt(`ยังไม่ได้มอบหมายให้ใคร — ${label}`, `Not assigned to anyone — ${label}`) });
    }
  });
  return out;
}

function renderBell() {
  const items = notifItems();
  const keys = new Set(items.map((x) => x.key));
  /* ตัดคีย์ของงานที่ปิดไปแล้วทิ้งทุกรอบ ไม่งั้นรายการ "อ่านแล้ว" จะโตขึ้นเรื่อย ๆ
     ตามอายุการใช้งาน จนวันหนึ่งชน quota ของ localStorage */
  const before = seen.size;
  seen = new Set([...seen].filter((k) => keys.has(k)));
  if (seen.size !== before) saveSeen();

  const unread = items.filter((x) => !seen.has(x.key));
  const dot = $("#bellCount");
  if (dot) {
    dot.textContent = unread.length > 9 ? "9+" : String(unread.length);
    dot.classList.toggle("hidden", unread.length === 0);
  }
  const list = $("#bellList");
  if (!list) return;
  list.innerHTML = items.length
    ? items.map((x) => `<button type="button" class="bell-item${seen.has(x.key) ? "" : " unread"}"
        data-bell="${esc(x.key)}" data-id="${esc(x.id)}">
        <span aria-hidden="true">${x.ico}</span><span class="grow">${esc(x.text)}</span></button>`).join("")
    : `<div class="bell-empty">— ไม่มีการแจ้งเตือน —</div>`;
}

function toggleBell(open) {
  bellOpen = open === undefined ? !bellOpen : open;
  $("#bellPanel")?.classList.toggle("hidden", !bellOpen);
  $("#bellBtn")?.setAttribute("aria-expanded", String(bellOpen));
}

function initBell() {
  loadSeen();
  $("#bellBtn")?.addEventListener("click", (e) => { e.stopPropagation(); toggleBell(); });
  $("#bellRead")?.addEventListener("click", () => {
    notifItems().forEach((x) => seen.add(x.key));
    saveSeen();
    renderBell();
  });
  $("#bellList")?.addEventListener("click", (e) => {
    const b = e.target.closest("[data-bell]");
    if (!b) return;
    seen.add(b.dataset.bell);
    saveSeen();
    toggleBell(false);
    renderBell();
    openModal(b.dataset.id);
  });
  // กดที่ไหนก็ได้นอกกระดิ่งแล้วปิด — พฤติกรรมที่คนคาดหวังจาก dropdown ทุกตัว
  document.addEventListener("click", (e) => {
    if (bellOpen && !e.target.closest("#bellWrap")) toggleBell(false);
  });
}

/* ═══════════ จัดการงานทีละหลายใบ ═══════════
   งานใหม่เข้ามาพร้อมกัน 15 ใบหลังไฟดับ แล้วต้องเปิด-กด-ปิดทีละใบ
   คือจังหวะที่หัวหน้าเลิกใช้ระบบแล้วกลับไปสั่งงานทางไลน์ */
let bulkSel = new Set();

function paintBulk() {
  const n = bulkSel.size;
  $("#bulkBar")?.classList.toggle("hidden", n === 0);
  const c = $("#bulkCount");
  if (c) c.textContent = tt(`เลือก ${n} ใบ`, `${n} selected`);
  const all = $("#bulkAll");
  // ติ๊กหัวตารางให้ตรงกับของจริง — เลือกครบทุกแถวที่เห็นอยู่เท่านั้นถึงจะติ๊กเต็ม
  if (all) {
    const shown = $$("#ticketBody .bulk-cb").length;
    all.checked = shown > 0 && n >= shown;
  }
}

function clearBulk() { bulkSel.clear(); $$("#ticketBody .bulk-cb").forEach((c) => (c.checked = false)); paintBulk(); }

/** ตัวเลือกในแถบ — สร้างใหม่ทุกครั้งที่ภาษาหรือรายชื่อทีมเปลี่ยน */
function fillBulkPickers() {
  const opt = (v, label) => `<option value="${esc(v)}">${esc(label)}</option>`;
  /* ไม่มี "ซ่อมเสร็จสมบูรณ์" ในรายการนี้โดยตั้งใจ — ISO ต้องมีผู้ตรวจรับเซ็นรายใบ
     server ก็ปฏิเสธไว้อีกชั้น ที่นี่แค่ไม่ยื่นปืนให้ตั้งแต่แรก */
  const st = $("#bulkStatus");
  if (st) st.innerHTML = opt("", "— เปลี่ยนสถานะ —") +
    [STATUS.WAIT, STATUS.REPAIR, STATUS.OUT, STATUS.VERIFY].map((x) => opt(x, x)).join("");
  const as = $("#bulkAssign");
  if (as) as.innerHTML = opt("", "— มอบหมายให้ —") + TEAM.map((u) => opt(u.name, u.name)).join("");
  const pr = $("#bulkPri");
  if (pr) pr.innerHTML = opt("", "— ความสำคัญ —") + PRIORITIES.map((x) => opt(x.key, x.key)).join("");
}

async function applyBulk() {
  const changes = {};
  const st = $("#bulkStatus").value, as = $("#bulkAssign").value, pr = $("#bulkPri").value;
  if (st) changes.status = st;
  if (as) changes.assignee = as;
  if (pr) changes.priority = pr;
  if (!Object.keys(changes).length) { toast("ยังไม่ได้เลือกสิ่งที่จะแก้", false); return; }

  const ids = [...bulkSel];
  const btn = $("#bulkApply");
  btn.disabled = true;
  try {
    /* ไม่ใช้ confirm() — GAS เสิร์ฟหน้าเว็บใน iframe ที่บล็อก modal ของเบราว์เซอร์
       ความปลอดภัยมาจากที่อื่นแทน: ปิดงานหลายใบไม่ได้ และทุกใบถูกบันทึกลงชีต Audit */
    const r = await gsAuth("apiBulkUpdate", ids, changes);
    toast(tt(`แก้ไขแล้ว ${r.done} ใบ`, `${r.done} tickets updated`) +
      (r.failed.length ? tt(` · ไม่สำเร็จ ${r.failed.length} ใบ`, ` · ${r.failed.length} failed`) : ""),
      !r.failed.length);
    if (r.failed.length) console.warn("แก้ไม่สำเร็จ:", r.failed);
    bulkSel.clear();
    ["#bulkStatus", "#bulkAssign", "#bulkPri"].forEach((x) => ($(x).value = ""));
    await refresh();
  } catch (err) {
    toast(err.message, false);
  } finally {
    btn.disabled = false;
    paintBulk();
  }
}

function initBulk() {
  $("#bulkApply")?.addEventListener("click", applyBulk);
  $("#bulkClear")?.addEventListener("click", clearBulk);
  $("#bulkAll")?.addEventListener("change", (e) => {
    // "ทั้งหมด" = ทั้งหมดที่เห็นอยู่หลังกรอง ไม่ใช่ทั้ง 334 ใบในระบบ
    $$("#ticketBody .bulk-cb").forEach((c) => {
      c.checked = e.target.checked;
      if (e.target.checked) bulkSel.add(c.dataset.cb); else bulkSel.delete(c.dataset.cb);
    });
    paintBulk();
  });
  $("#ticketBody")?.addEventListener("change", (e) => {
    const c = e.target.closest(".bulk-cb");
    if (!c) return;
    if (c.checked) bulkSel.add(c.dataset.cb); else bulkSel.delete(c.dataset.cb);
    paintBulk();
  });
}

/* ═══════════ งานของฉัน ═══════════ */
/* ช่างเข้ามาเพื่อตอบคำถามเดียว "วันนี้ฉันต้องทำอะไร" การให้ไปนั่งกรองเอาเองในหน้ารวม
   300+ ใบ เป็นงานที่ไม่มีใครทำจริง เมนูนี้จึงกรองด้วยชื่อคนที่ล็อกอินให้เลย
   เทียบทั้ง assignee และ technician เพราะหัวหน้ามอบหมายที่ช่องแรก
   แต่ช่างที่ลงมือซ่อมเองจะถูกบันทึกไว้ที่ช่องหลัง */
const isMine = (t) =>
  !!ME && [t.assignee, t.technician].some((v) => hasName(v, ME.name));

let mineRange = "all";                       // day | week | month | all
const MINE_RANGES = [["day", "วันนี้"], ["week", "สัปดาห์นี้"], ["month", "เดือนนี้"], ["all", "ทั้งหมด"]];

/** ขอบของช่วงที่เลือก — สัปดาห์นับ จันทร์→อาทิตย์ แบบไทย */
function rangeBounds(r) {
  if (r === "all") return null;
  const a = new Date(), b = new Date();
  a.setHours(0, 0, 0, 0);
  b.setHours(23, 59, 59, 999);
  if (r === "week") {
    a.setDate(a.getDate() - ((a.getDay() || 7) - 1));
    b.setDate(b.getDate() + (7 - (b.getDay() || 7)));
  }
  if (r === "month") { a.setDate(1); b.setMonth(b.getMonth() + 1, 0); }
  return { a, b };
}

/* งานค้างเทียบ "กำหนดเสร็จ" และตั้งใจไม่ใส่ขอบล่าง — เลือกวันนี้แล้วงานที่เลยกำหนดมา
   ตั้งแต่เมื่อวานต้องยังเห็นอยู่ ไม่งั้นงานค้างจะหายเงียบ ๆ ซึ่งอันตรายกว่าตารางยาว
   ส่วนงานที่ปิดแล้วเทียบ "เวลาซ่อมจบ" แบบมีขอบทั้งสองข้าง เพราะคำถามคือปิดไปกี่งานในช่วงนี้ */
function inMineRange(t, bd) {
  if (!bd) return true;
  const done = t.status === STATUS.DONE;
  const d = new Date(done ? (t.completed_at || t.created_at) : (t.due_at || t.created_at));
  if (isNaN(d)) return true;                 // ข้อมูลเก่าไม่มีวันที่ อย่าซ่อนทิ้ง
  return done ? d >= bd.a && d <= bd.b : d <= bd.b;
}

function renderMine() {
  const mine = live(tickets).filter(isMine);
  const open = mine.filter((t) => t.status !== STATUS.DONE);

  const pill = $("#navMine");
  if (pill) {
    pill.textContent = open.length;
    pill.classList.toggle("zero", open.length === 0);
  }
  if (!ME || !$("#mineBody")) return;

  const late = open.filter((t) => dueInfo(t).cls === "due-late");
  $("#mineStats").innerHTML = [
    { ico: "🧰", bg: "#ede9fe", fg: "#5b21b6", label: "งานที่ยังไม่เสร็จ", num: nf(open.length) },
    { ico: "⏰", bg: "#fee2e2", fg: "#991b1b", label: "เลยกำหนดเสร็จ", num: nf(late.length) },
    { ico: "🔧", bg: "#fef9c3", fg: "#854d0e", label: "กำลังซ่อมอยู่",
      num: nf(open.filter((t) => t.status === STATUS.REPAIR).length) },
    { ico: "✅", bg: "#dcfce7", fg: "#166534", label: "ปิดงานแล้วทั้งหมด",
      num: nf(mine.filter((t) => t.status === STATUS.DONE).length) },
  ].map(statCard).join("");

  // ตัวเลขบนชิปนับจากงานที่จะแสดงจริงในโหมดนั้น ๆ ไม่งั้นกดแล้วได้ไม่ตรงกับที่เห็น
  const pool = $("#mineDone").checked ? mine : open;
  $$("#mineRange .chip").forEach((c) => {
    const bd = rangeBounds(c.dataset.range);
    c.querySelector("span").textContent = pool.filter((t) => inMineRange(t, bd)).length;
    c.classList.toggle("active", c.dataset.range === mineRange);
  });
  $("#mineRangeNote").textContent = mineRange === "all" ? ""
    : "งานค้าง = ถึงกำหนดภายใน" + MINE_RANGES.find((x) => x[0] === mineRange)[1] +
      " (รวมงานที่เลยกำหนดมาแล้ว) · งานที่ปิดแล้ว = ปิดใน" +
      MINE_RANGES.find((x) => x[0] === mineRange)[1];

  const repeatIds = new Set(findRepeats(tickets, Number($("#repeatWindow")?.value) || 30)
    .map((r) => r.curr.ticket_id));
  const bd = rangeBounds(mineRange);
  const rows = pool.filter((t) => inMineRange(t, bd));
  $("#mineBody").innerHTML = rows.length
    ? rows.map((t) => ticketRow(t, repeatIds)).join("")
    : `<tr><td colspan="9" class="empty">— ${!mine.length
        ? "ยังไม่มีงานที่มอบหมายให้ " + esc(ME.name)
        : pool.length ? "ไม่มีงานในช่วงเวลานี้" : "ไม่มีงานค้าง เคลียร์หมดแล้ว 👍"} —</td></tr>`;
}

/** แผน PM อยู่คนละชีต ต้องถามเซิร์ฟเวอร์ ไม่ได้ติดมากับ tickets */
async function loadMinePm() {
  const body = $("#minePmBody"), tag = $("#minePmDue");
  if (!ME || !body) return;
  body.innerHTML = `<tr><td colspan="6" class="empty">กำลังโหลด...</td></tr>`;
  let plan = [];
  try { plan = await gsAuth("apiGetPMPlan"); }
  catch (err) { body.innerHTML = `<tr><td colspan="6" class="empty">${esc(err.message)}</td></tr>`; return; }

  const mine = plan.filter((x) => hasName(x.owner, ME.name));
  const due = mine.filter((x) => x.daysLeft <= 0).length;
  tag.textContent = tt(`ถึงกำหนดแล้ว ${nf(due)} รายการ`, `${nf(due)} due now`);
  tag.classList.toggle("hidden", due === 0);

  body.innerHTML = mine.length ? mine.map((x) => {
    const cls = x.daysLeft <= 0 ? "age-late" : x.daysLeft <= 7 ? "age-warn" : "age-ok";
    return `<tr>
      <td class="td font-semibold">${esc(x.machine)}</td>
      <td class="td">${esc(x.task)}</td>
      <td class="td num">${nf(x.cycle)}</td>
      <td class="td whitespace-nowrap text-slate-600">${x.last ? fmtDT(x.last) : "ยังไม่เคยทำ"}</td>
      <td class="td whitespace-nowrap text-slate-600">${x.due ? fmtDT(x.due) : "-"}</td>
      <td class="td num"><span class="age ${cls}">${x.daysLeft <= 0 ? tt("ถึงกำหนด", "Due") : tt(x.daysLeft + " วัน", x.daysLeft + " d")}</span></td>
    </tr>`;
  }).join("")
    : `<tr><td colspan="6" class="empty">— ยังไม่มีงาน PM ที่ระบุชื่อ ${esc(ME.name)} ในชีต "แผน PM" —</td></tr>`;
}

function period() {
  const year  = Number($("#yearPicker").value) || new Date().getFullYear();
  const month = $("#monthPicker").value;                 // "" = ทั้งปี | "01".."12"
  // ยกเลิกแล้ว = ไม่เคยเป็นงานจริง ต้องไม่ไปโผล่ในต้นทุน MTTR ซ่อมซ้ำ หรือ KPI ใด ๆ
  const yearList = live(tickets).filter((t) => monthKey(t).slice(0, 4) === String(year));
  const list = month ? yearList.filter((t) => monthKey(t).slice(5, 7) === month) : yearList;
  return { year, month, list, yearList, pm: getPM(year, month) };
}

/* ── 1.5) Pivot สรุปรายเดือน — ชุดกราฟที่ผู้จัดการใช้พรีเซนต์ ── */
const PIE = ["#2563eb", "#f97316", "#16a34a", "#eab308", "#8b5cf6", "#ec4899", "#0891b2",
             "#dc2626", "#65a30d", "#7c3aed", "#0d9488", "#b45309", "#64748b"];

function panelPivot(p) {
  const st  = $("#pvStatus").value;                 // "" | ซ่อมแล้ว | รอซ่อม
  const mc  = $("#pvMachine").value;
  const top = Number($("#pvTop").value) || 0;

  let list = p.list;
  if (st) list = list.filter((t) => legacyStatus(t.status) === st);
  if (mc) list = list.filter((t) => t.machine_name === mc);

  const agg = {};
  list.forEach((t) => {
    const m = t.machine_name;
    if (!m) return;          // งานอาคาร/ห้องน้ำ ไม่มีเครื่อง อย่านับเป็นชิ้น "(ว่าง)" ในกราฟ
    (agg[m] ||= { machine: m, count: 0, cost: 0 });
    agg[m].count++;
    agg[m].cost += Number(t.cost) || 0;
  });
  const all = Object.values(agg).sort((a, b) => b.cost - a.cost || b.count - a.count);
  const rows = top ? all.slice(0, top) : all;
  const totalCost  = all.reduce((a, b) => a + b.cost, 0);
  const totalCount = all.reduce((a, b) => a + b.count, 0);

  $("#pvStats").innerHTML = [
    { ico: "🧾", bg: "#e0e7ff", fg: "#3730a3", label: "จำนวนรายการแจ้งซ่อม", num: nf(totalCount) },
    { ico: "💰", bg: "#fef9c3", fg: "#854d0e", label: "ค่าใช้จ่ายรวม (บาท)", num: money(totalCost) },
    { ico: "🏭", bg: "#fee2e2", fg: "#991b1b", label: "เครื่องที่ใช้เงินสูงสุด",
      num: all[0] ? money(all[0].cost) : "-", sub: all[0] ? all[0].machine : "" },
    { ico: "📄", bg: "#dbeafe", fg: "#1e40af", label: "เฉลี่ยต่อรายการ (บาท)",
      num: totalCount ? money(totalCost / totalCount) : "0" },
  ].map(statCard).join("");

  drawChart("chartPvCount", {
    type: "pie",
    data: {
      labels: rows.map((x) => x.machine),
      datasets: [{ data: rows.map((x) => x.count), backgroundColor: PIE, borderWidth: 2, borderColor: "#fff" }],
    },
    options: {
      plugins: {
        legend: { position: "right", labels: { boxWidth: 10, padding: 8, font: { size: 11 } } },
        tooltip: { callbacks: { label: (c) => `${c.label}: ${c.parsed} ครั้ง (${pct(c.parsed, totalCount)}%)` } },
        datalabels: COUNT_LABEL,
      },
    },
  });

  /* เอาเฉพาะเครื่องที่มีค่าใช้จ่ายจริง และตัดที่ 5 อันดับ
     เครื่องที่ยอด 0 ทำให้กราฟเป็นแถวว่างเปล่า ส่วนชื่อเครื่องยาว ๆ เกิน 5 แท่งก็เบียดจนอ่านไม่ออก */
  const costTop = rows.filter((x) => x.cost > 0).slice(0, 5);
  $("#pvCostNote").textContent = costTop.length
    ? `${costTop.length} อันดับแรกที่มีค่าใช้จ่าย จาก ${all.filter((x) => x.cost > 0).length} เครื่อง`
    : "ยังไม่มีเครื่องที่บันทึกค่าใช้จ่ายในช่วงนี้";

  drawChart("chartPvCost", {
    type: "bar",
    data: {
      labels: costTop.map((x) => x.machine),
      datasets: [{ label: "ค่าใช้จ่าย (บาท)", data: costTop.map((x) => x.cost),
                   backgroundColor: "#84cc16", borderRadius: 5, maxBarThickness: 72 }],
    },
    options: {
      layout: { padding: { top: 24 } },          // เผื่อที่ให้ตัวเลขบนหัวแท่งไม่โดนตัด
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: (c) => "฿" + money(c.parsed.y) } },
        datalabels: { anchor: "end", align: "top", offset: 2, clamp: true,
                      color: "#3f6212", font: { size: 11, weight: "700" },
                      formatter: (v) => (v ? money(v) : "") },
      },
      scales: {
        y: { beginAtZero: true, ticks: { callback: (v) => money(v) } },
        x: {
          ticks: {
            font: { size: 10 }, autoSkip: false, maxRotation: 0, minRotation: 0,
            // ชื่อเครื่องยาวให้ตัดลงสองบรรทัด ดีกว่าเอียง 45 องศาแบบเดิม
            callback(v) {
              const t = String(this.getLabelForValue(v));
              if (t.length <= 13) return t;
              return [t.slice(0, 13), t.slice(13, 26) + (t.length > 26 ? "…" : "")];
            },
          },
        },
      },
    },
  });

  const totalRow = (val) =>
    `<tr style="background:#fefce8"><td class="td font-bold">ผลรวมทั้งหมด</td>
      <td class="td num font-bold">${val}</td></tr>`;

  $("#pvCostBody").innerHTML = (rows.length
    ? rows.map((x) => `<tr><td class="td">${esc(x.machine)}</td>
        <td class="td num">${x.cost ? "฿" + money(x.cost) : ""}</td></tr>`).join("")
    : `<tr><td colspan="2" class="empty">— ไม่มีข้อมูล —</td></tr>`)
    + (rows.length ? totalRow("฿" + money(totalCost)) : "");

  $("#pvCountBody").innerHTML = (rows.length
    ? rows.map((x) => `<tr><td class="td">${esc(x.machine)}</td>
        <td class="td num">${nf(x.count)}</td></tr>`).join("")
    : `<tr><td colspan="2" class="empty">— ไม่มีข้อมูล —</td></tr>`)
    + (rows.length ? totalRow(nf(totalCount)) : "");

  // เติมรายชื่อเครื่องใน slicer โดยคงค่าที่เลือกไว้
  const sel = $("#pvMachine");
  const names = [...new Set(p.list.map((t) => t.machine_name).filter(Boolean))].sort();
  const keep = sel.value;
  sel.innerHTML = `<option value="">ทั้งหมด</option>` +
    names.map((n) => `<option value="${esc(n)}">${esc(n)}</option>`).join("");
  if (names.includes(keep)) sel.value = keep;
}

/* ── 2) จำนวนแจ้งซ่อม-ค่าใช้จ่ายรวม ── */
function panelCost(p) {
  const k = kpiSummary(p.list, slaInput(), p.pm);
  const maxCost = machineStats(p.list).sort((a, b) => b.cost - a.cost)[0];

  $("#costStats").innerHTML = [
    { ico: "🧾", bg: "#e0e7ff", fg: "#3730a3", label: "จำนวนใบแจ้งซ่อม", num: nf(k.total) },
    { ico: "💰", bg: "#fef9c3", fg: "#854d0e", label: "ค่าใช้จ่ายรวม (บาท)", num: money(k.cost) },
    { ico: "📄", bg: "#dbeafe", fg: "#1e40af", label: "เฉลี่ยต่อใบ (บาท)", num: money(k.costPerTicket) },
    { ico: "🏭", bg: "#fee2e2", fg: "#991b1b", label: "เครื่องที่ใช้เงินสูงสุด",
      num: maxCost ? money(maxCost.cost) : "-", sub: maxCost ? maxCost.machine : "" },
  ].map(statCard).join("");

  const cnt = Array(12).fill(0), cost = Array(12).fill(0), done = Array(12).fill(0);
  p.yearList.forEach((t) => {
    const d = new Date(t.created_at);
    if (isNaN(d)) return;
    const m = d.getMonth();
    cnt[m]++;
    cost[m] += Number(t.cost) || 0;
    if (t.status === STATUS.DONE) done[m]++;
  });

  drawChart("chartCostMix", {
    data: {
      labels: MONTHS(),
      datasets: [
        { type: "bar", label: "จำนวนใบ", data: cnt, backgroundColor: "#60a5fa", borderRadius: 5, yAxisID: "y" },
        { type: "line", label: "ค่าใช้จ่ายรวม (บาท)", data: cost, borderColor: "#f59e0b",
          backgroundColor: "#f59e0b", tension: .35, borderWidth: 2.5, pointRadius: 3, yAxisID: "y1" },
      ],
    },
    options: {
      scales: {
        y:  { beginAtZero: true, position: "left",  title: { display: true, text: "จำนวนใบ" }, ticks: { precision: 0 } },
        y1: { beginAtZero: true, position: "right", title: { display: true, text: "บาท" },
              grid: { drawOnChartArea: false }, ticks: { callback: (v) => money(v) } },
      },
    },
  });

  /* Pareto — 5 ใบแพงสุดกินงบ 44% ของทั้งโรงงาน เรียงมากไปน้อยแล้วดูเส้นสะสม
     จะเห็นทันทีว่าต้องไปจัดการเครื่องไหนก่อนถึงจะคุ้มแรง */
  const byCost = machineStats(p.list)
    .filter((m) => m.machine && m.cost > 0)
    .sort((a, b) => b.cost - a.cost);
  const sumCost = byCost.reduce((acc, m) => acc + m.cost, 0);
  const par = byCost.slice(0, 15);
  let run = 0;
  const cum = par.map((m) => { run += m.cost; return Math.round((run / sumCost) * 1000) / 10; });
  const vital = cum.findIndex((c) => c >= 80) + 1;      // findIndex คืน -1 ถ้าไม่ถึง 80% → vital = 0

  drawChart("chartPareto", {
    data: {
      labels: par.map((m) => m.machine),
      datasets: [
        { type: "bar", label: "ค่าใช้จ่าย (บาท)", data: par.map((m) => m.cost),
          backgroundColor: "#f97316", borderRadius: 5, yAxisID: "y" },
        { type: "line", label: "สัดส่วนสะสม (%)", data: cum, borderColor: "#0f766e",
          backgroundColor: "#0f766e", tension: .25, borderWidth: 2.5, pointRadius: 3, yAxisID: "y1" },
      ],
    },
    options: {
      plugins: { tooltip: { callbacks: {
        label: (c) => (c.datasetIndex ? `สะสม ${c.parsed.y}%` : "฿" + money(c.parsed.y)) } } },
      scales: {
        y:  { beginAtZero: true, position: "left", ticks: { callback: (v) => money(v) } },
        y1: { beginAtZero: true, max: 100, position: "right", grid: { drawOnChartArea: false },
              ticks: { callback: (v) => v + "%" } },
        x:  { ticks: { maxRotation: 60, minRotation: 45, font: { size: 10 } } },
      },
    },
  });

  $("#paretoNote").innerHTML = vital
    ? `เครื่องจักร <b>${vital}</b> เครื่องแรกกินค่าใช้จ่าย <b>${cum[vital - 1]}%</b>
       ของทั้งหมด (${money(sumCost)} บาท) — จัดการกลุ่มนี้ก่อนได้ผลสูงสุด`
    : (par.length ? "ค่าใช้จ่ายกระจายตัว ไม่มีกลุ่มไหนกินสัดส่วนถึง 80%" : "ยังไม่มีใบที่กรอกค่าใช้จ่าย");

  $("#costMonthBody").innerHTML = cnt.map((c, m) => ({ m, c, cost: cost[m], done: done[m] }))
    .filter((r) => r.c)
    .map((r) => `<tr>
      <td class="td font-semibold">${MONTHS()[r.m]} ${yearLabel(p.year)}</td>
      <td class="td num">${nf(r.c)}</td>
      <td class="td num text-green-700 font-semibold">${nf(r.done)}</td>
      <td class="td num">${money(r.cost)}</td>
      <td class="td num text-slate-500">${money(r.cost / r.c)}</td></tr>`).join("")
    || `<tr><td colspan="5" class="empty">— ยังไม่มีข้อมูลในปีนี้ —</td></tr>`;
}

/* ── 3) รายการซ่อมซ้ำ ── */

  const reps = findRepeats(p.list, win);
  const machines = new Set(reps.map((r) => r.machine));
  const worst = machineStats(p.list, reps).sort((a, b) => b.repeat - a.repeat)[0];

  const byCount = repeatByCount(p.list);
  $("#repeatStats").innerHTML = [
    { ico: "📊", bg: "#fee2e2", fg: "#991b1b", label: "% ซ่อมซ้ำ (สูตรเดิมใน Excel)",
      num: byCount.rate + "%", sub: `${nf(byCount.repeated.length)} จาก ${nf(byCount.machines.length)} เครื่องที่แจ้งในรอบ` },

      sub: worst && worst.repeat ? `หนักสุด: ${worst.machine} (${worst.repeat} ครั้ง)` : "" },

/* ── 4) Heatmap ── */
function panelHeat(p) {
  const mode = $("#heatMode").value;
  const { cols, rows } = heatData(p.yearList, mode);
  $("#heatTitle").textContent = mode === "weekday"
    ? `ช่วงเวลาที่เครื่องเสียบ่อย · ปี ${yearLabel(p.year)}`
