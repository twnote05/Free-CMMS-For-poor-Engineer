/* ── 5) Machine Ranking ── */
function panelRank(p) {
  const key  = $("#rankBy").value;
  const reps = findRepeats(p.list, Number($("#repeatWindow").value) || 30);
  const stats = machineStats(p.list, reps).sort((a, b) => (b[key] || 0) - (a[key] || 0));
  const maxV = Math.max(1, ...stats.map((s) => s[key] || 0));

  // Pareto: เรียงตามจำนวนครั้งเสมอ แล้วสะสม % จนถึง 80% = 🎯 Critical (ตามสูตรชีท Machine Ranking)
  const totalCount = stats.reduce((a, b) => a + b.count, 0) || 1;
  const byCount = [...stats].sort((a, b) => b.count - a.count);
  let cum = 0;
  const pareto = new Map();
  byCount.forEach((x) => { cum += x.count / totalCount; pareto.set(x.machine, cum); });

  $("#rankBody").innerHTML = stats.length ? stats.map((s, i) => {
    const [, riskLabel, riskColor] = riskLevel(s.count);
    const cumPct = pareto.get(s.machine) || 0;
    return `<tr>
      <td class="td num font-bold ${i < 3 ? "text-red-600" : "text-slate-400"}">${["🥇", "🥈", "🥉"][i] || i + 1}</td>
      <td class="td font-semibold">${esc(s.machine)}
        ${cumPct <= 0.8 ? `<span class="tag-repeat" style="background:#fef3c7;color:#92400e">🎯 Critical</span>` : ""}</td>
      <td class="td num">${nf(s.count)}</td>
      <td class="td" style="color:${riskColor};font-weight:700;white-space:nowrap">${riskLabel}</td>
      <td class="td num ${s.repeat ? "text-red-600 font-bold" : "text-slate-300"}">${s.repeat || "-"}</td>
      <td class="td num">${money(s.cost)}</td>
      <td class="td num text-slate-600">${fmtDuration(s.downtime) || "-"}</td>
      <td class="td num text-slate-600">${s.mttr === null ? "-" : fmtDuration(s.mttr)}</td>
      <td class="td num text-slate-500">${Math.round((s.count / totalCount) * 1000) / 10}%</td>
      <td class="td num font-semibold">${Math.round(cumPct * 1000) / 10}%</td>
      <td class="td"><div class="kpi-bar" style="margin:0"><i style="width:${((s[key] || 0) / maxV) * 100}%;background:#2563eb"></i></div></td>
    </tr>`;
  }).join("")
    : `<tr><td colspan="11" class="empty">— ยังไม่มีข้อมูลในช่วงเวลานี้ —</td></tr>`;
}

/* ── 6) KPI ── */
/* ═══════════ กระดานภาระงานช่าง ═══════════
   หัวหน้าเพิ่งได้ปุ่มจ่ายงานทีละหลายใบ แต่ยังจ่ายโดยไม่รู้ว่าใครถืออยู่กี่ใบ
   ข้อมูลมีครบอยู่แล้วทั้งช่องผู้รับผิดชอบและสถานะ ขาดแค่จัดกลุ่มแล้ววาด

   ตั้งใจให้ "งานค้าง" ไม่ขึ้นกับตัวกรองช่วงเวลาด้านบน — คำถามคือ *ตอนนี้* ใครว่าง
   ไม่ใช่เดือนมกราคมใครว่าง ส่วนคอลัมน์ที่มองย้อนหลัง (ปิดไปกี่ใบ · MTTR) ใช้ช่วงที่เลือก */
function workloadRows(p) {
  const byName = {};
  const touch = (n) => (byName[n] ||= {
    name: n, open: 0, urgent: 0, late: 0, closed: 0, mins: [], byStatus: {},
  });

  // งานค้าง = ดูจากทั้งระบบ ไม่ใช่เฉพาะช่วงที่เลือก
  live(tickets).filter((t) => t.status !== STATUS.DONE).forEach((t) => {
    nameList(t.assignee).forEach((n) => {
      const r = touch(n);
      r.open++;
      r.byStatus[t.status] = (r.byStatus[t.status] || 0) + 1;
      if (priRank(t.priority) <= 1) r.urgent++;          // วิกฤต + ด่วน
      if (dueInfo(t).cls === "due-late") r.late++;
    });
  });

  // ปิดไปกี่ใบ และใช้เวลาเท่าไหร่ — อันนี้ใช้ช่วงเวลาที่เลือกด้านบน
  p.list.filter((t) => t.status === STATUS.DONE).forEach((t) => {
    // เทียบ "ผู้เข้าซ่อม" ก่อน เพราะคนที่ลงมือจริงคือคนที่ควรได้เครดิต
    nameList(t.technician || t.assignee).forEach((n) => {
      const r = touch(n);
      r.closed++;
      // ภาระงานช่างต้องเป็นเวลาที่เขาลงมือจริง ใบที่ค้างรออะไหล่ 5 วันไม่ใช่ภาระของช่าง
      const h = wrenchHours(t);
      if (h !== null) r.mins.push(h);
    });
  });

  return Object.values(byName).map((r) => ({
    ...r,
    mttr: r.mins.length ? r.mins.reduce((a, b) => a + b, 0) / r.mins.length : null,
  })).sort((a, b) => b.open - a.open || b.closed - a.closed);
}

   เก็บรวมที่เดียวเพื่อให้แต่ละตำแหน่งแค่เลือกหยิบไปใช้ ไม่ต้องเขียนตารางใหม่ทั้งใบ */
const TS_COL = {
  ftfRate:       ["First-Time Fix", (r) => r.ftfRate,    "pct", (v) => v < 90,  "ftf"],
  onTimeRate:    ["ปิดทันกำหนด",    (r) => r.onTimeRate, "pct", (v) => v < 90,  "onTime"],
  logRate:       ["วินัยการบันทึก", (r) => r.logRate,    "pct", (v) => v < 90,  "log"],
  repeatRate:    ["ซ่อมซ้ำ",        (r) => r.repeatRate, "pct", (v) => v > 0,   "repeat"],
  pmRate:        ["PM ตามแผน",      (r) => r.pmRate,     "pct", (v) => v < 100, "pm"],
  open:          ["งานค้าง",         (r) => r.open,       "num", () => false,    "open"],
  backlogWeeks:  ["Backlog",         (r) => r.backlogWeeks, "wk", () => false,   "open"],
  station:       ["สถานี",           (r) => r.station || null, "txt", () => false, ""],
  checkDays:     ["วันที่ออกตรวจ",   (r) => r.checkDays,  "num", () => false,    ""],
  shouldMachines:["เครื่องที่ต้องตรวจ", (r) => r.shouldMachines || null, "num", () => false, ""],
  coverRate:     ["ตรวจครบ",         (r) => r.coverRate,  "pct", (v) => v < 100, ""],
  checkMachines: ["เครื่องที่ตรวจ",  (r) => r.checkMachines, "num", () => false, ""],
  abnormalFound: ["เจอผิดปกติ",      (r) => r.abnormalFound, "num", () => false, ""],
  ticketsRaised: ["แจ้งซ่อมจากการตรวจ", (r) => r.ticketsRaised, "num", () => false, "raised"],
  assignedRate:  ["ใบที่จ่ายงานแล้ว", (r) => r.assignedRate, "pct", (v) => v < 100, ""],
  verifyCount:   ["ตรวจรับงาน",      (r) => r.verifyCount, "num", () => false,   "verify"],
  teamOpen:      ["งานค้างของทีม",   (r) => r.teamOpen,   "num", () => false,    ""],
  teamOverdue:   ["เลยกำหนดของทีม",  (r) => r.teamOverdue, "num", (v) => v > 0,  ""],
};

/* ตัวที่ยิ่งน้อยยิ่งดี ต้องกลับด้านก่อนเอาไปรวมเป็นคะแนน
   ไม่งั้นช่างที่ซ่อมซ้ำเยอะจะได้คะแนนสูง ซึ่งกลับหัวกลับหางทั้งระบบ */
const TECH_INVERTED = ["repeat"];

/**
 * คะแนนรวมถ่วงน้ำหนัก 0–100
 * ตัวที่ยังไม่มีข้อมูล (null) ถูกตัดออกจาก *ทั้งตัวเศษและตัวหาร* ไม่ใช่นับเป็น 0 —
 * ช่างที่เดือนนั้นไม่มีงาน PM ให้ทำ ต้องไม่โดนหักคะแนนจากงานที่ไม่มีใครมอบหมายให้
 * @returns {{score:number, parts:object[], usedWeight:number}|null} null = ข้อมูลไม่พอ
 */
function techTotal(r, weights) {
  if (!r.enough) return null;
  const w = { ...TECH_WEIGHT_DEFAULT, ...(weights || {}) };
  const parts = [];
  let sum = 0, used = 0;
  Object.keys(w).forEach((key) => {
    const raw = r[key + "Rate"];
    if (raw === null || raw === undefined || !w[key]) return;
    const points = TECH_INVERTED.includes(key) ? Math.max(0, 100 - raw) : raw;
    parts.push({ key, raw, points, weight: w[key] });
    sum += points * w[key];
    used += w[key];
  });
  if (!used) return null;
  return { score: Math.round((sum / used) * 10) / 10, parts, usedWeight: used };
}

function techScore(list, o = {}) {
  const sla  = o.sla || 72;
  const win  = o.repeatWin || 30;
  const pmItems = o.pmItems || pmCal?.items || [];
  const openAll = o.open || live(tickets).filter((t) => t.status !== STATUS.DONE);
  const weekHours = o.weekHours || 45;

  const by = {};
  const touch = (n) => (by[n] ||= {
    name: n, closed: 0, hours: [], verified: 0, ftfPass: 0,
    onTimeBase: 0, onTimePass: 0, logged: 0, repeats: 0,
    pmPlan: 0, pmDone: 0, open: 0,
  });

  // เครดิตงานให้ "ผู้เข้าซ่อม" ก่อน เพราะคือคนที่ลงมือจริง — ตกลงมาที่ผู้รับผิดชอบเมื่อไม่ได้กรอก
  // ใบเดียวมีช่างหลายคนได้ ทุกคนได้เครดิตเต็มใบ (ส่งเสริมการช่วยกัน ยอดรวมจึงเกินจำนวนใบจริงได้)
  const crew = (t) => nameList(t.technician || t.assignee);

  list.filter((t) => t.status === STATUS.DONE).forEach((t) => {
    crew(t).forEach((n) => {
      const r = touch(n);
      r.closed++;
      const h = wrenchHours(t);
      if (h !== null) r.hours.push(h);
      if (loggedWell(t)) r.logged++;
      if (t.verification_status) {
        r.verified++;
        if (!(Number(t.reject_count) > 0)) r.ftfPass++;
      }
      if (!waitedOutside(t)) {
        r.onTimeBase++;
        if (closedOnTime(t, sla)) r.onTimePass++;
      }
    });
  });

  /* ซ่อมซ้ำ: ความรับผิดอยู่ที่คนที่ปิด "ใบก่อนหน้า" — เขาซ่อมแล้วมันกลับมาเสียอีก
     ไม่ใช่คนที่มารับใบใหม่ ซึ่งเป็นคนรับกรรม */
  findRepeats(list, win).forEach((r) => {
    // โทษได้เฉพาะงานที่เขาปิดไปแล้วจริง ๆ — ใบที่ยังค้างอยู่ยังไม่ถือว่าซ่อมเสร็จแล้วกลับมาเสีย
    // และถ้าไม่กันไว้ repeats จะมากกว่า closed ได้ แล้ว %ซ่อมซ้ำของคนนั้นทะลุ 100%
    if (r.prev.status !== STATUS.DONE) return;
    crew(r.prev).forEach((n) => { touch(n).repeats++; });
  });

  // PM ตามแผน — มีเฉพาะเดือนที่เปิดหน้า "แผน PM" ไว้ ถ้าไม่มีก็คืน null ไม่ใช่ 0
  pmItems.forEach((x) => {
    nameList(x.owner).forEach((n) => {
      const r = touch(n);
      r.pmPlan++;
      if (x.actual) r.pmDone++;
    });
  });

  openAll.forEach((t) => { nameList(t.assignee).forEach((n) => { touch(n).open++; }); });

  const weights = o.weights || CONFIG.techWeights || TECH_WEIGHT_DEFAULT;

  return Object.values(by).map((r) => {
    const med = median(r.hours);
    const out = {
      ...r,
      enough: r.closed >= TECH_MIN_N,
      wrenchTotal: r.hours.reduce((a, b) => a + b, 0),
      wrenchMedian: med,
      ftfRate:    r.verified ? pct(r.ftfPass, r.verified) : null,
      onTimeRate: r.onTimeBase ? pct(r.onTimePass, r.onTimeBase) : null,
      logRate:    r.closed ? pct(r.logged, r.closed) : null,
      repeatRate: r.closed ? pct(r.repeats, r.closed) : null,
      pmRate:     r.pmPlan ? pct(r.pmDone, r.pmPlan) : null,
      /* ponytail: ประมาณชั่วโมงงานค้างจากมัธยฐานของงานที่คนนั้นเคยปิด
         ใบแจ้งซ่อมไม่มีช่อง "ชั่วโมงที่คาดว่าจะใช้" จึงไม่มีตัวเลขจริงให้ใช้
         ถ้าวันหนึ่งเพิ่มช่องนั้น ให้เปลี่ยนมาบวกชั่วโมงจริงแทนมัธยฐาน */
      backlogWeeks: med === null || !r.open ? null
        : Math.round((r.open * med / weekHours) * 10) / 10,
    };
    out.total = techTotal(out, weights);
    return out;
  }).sort((a, b) => (b.total?.score ?? -1) - (a.total?.score ?? -1) || b.closed - a.closed);
}

/* ตารางเดียวจบ ไม่มีหน้า "รายละเอียดของคนนี้" คั่นกลาง —
   ตารางแสดงครบทั้งเจ็ดตัวอยู่แล้ว หน้าคั่นจะเป็นแค่การวาดแถวเดิมให้ใหญ่ขึ้น
   กดที่ตัวเลขแล้วเห็นใบเลยจึงสั้นกว่าและตอบคำถามเดียวกัน */
/* คะแนนรวมต้องกดดู/ชี้ดูที่มาได้เสมอ — เลขก้อนเดียวที่อธิบายไม่ได้
   คือเลขที่คนจะเถียงในห้องประเมินแล้วไม่มีใครชนะ */
function scoreBreakdown(total) {
  const name = { ftf: "First-Time Fix", onTime: "ปิดทันกำหนด", log: "วินัยการบันทึก",
                 repeat: "ไม่ซ่อมซ้ำ", pm: "PM ตามแผน" };
  return total.parts.map((x) =>
    `${name[x.key] || x.key} ${x.points}% × น้ำหนัก ${x.weight}`).join("\n") +
    `\nรวมน้ำหนักที่ใช้ ${total.usedWeight} (ตัวที่ยังไม่มีข้อมูลถูกตัดออกทั้งเศษและส่วน)`;
}

/* เช็คชีตรายคนในช่วงที่เลือก — โหลดเมื่อต้องใช้เท่านั้น
   ตำแหน่งอื่นไม่ได้ใช้ข้อมูลก้อนนี้ ยิงทุกครั้งที่เปิดหน้า KPI จะเสียเวลาเปล่า */
let checkScore = null, checkScoreKey = "";

async function loadCheckScore(p) {
  const key = `${p.year}-${p.month || "all"}`;
  if (checkScoreKey === key) return checkScore;
  const from = p.month ? `${p.year}-${p.month}-01` : `${p.year}-01-01`;
  const to   = p.month ? `${p.year}-${p.month}-31` : `${p.year}-12-31`;
  try { checkScore = await gsAuth("apiCheckScore", from, to); }
  catch (e) { checkScore = { people: [], machines: 0, days: 0, error: e.message }; }
  checkScoreKey = key;
  return checkScore;
}

/* ═══ แปลงข้อมูลดิบเป็นแถวของตารางตามตำแหน่งที่เลือก ═══
   ทุกตำแหน่งคืนรูปร่างเดียวกัน { name, ...ตัวชี้วัด, enough, total } เพื่อให้ตารางเดียววาดได้หมด */
function roleRows(roleKey, p) {
  const def = ROLE_KPI[roleKey];
  if (!def) return [];
  const sla = slaInput();
  const win = Number($("#repeatWindow")?.value) || 30;

  if (def.source === "ticket") {
    return techScore(p.list, { sla, repeatWin: win, weights: def.weights });
  }

  if (def.source === "check") {
    const raised = {};
    p.list.filter((t) => String(t.source || "").indexOf("เช็คชีต") > -1 ||
                         String(t.source || "").indexOf("พารามิเตอร์") > -1)
      .forEach((t) => { const n = String(t.reporter || "").trim();
                        if (n) raised[n] = (raised[n] || 0) + 1; });

    const people = (checkScore?.people || []).slice();
    // คนที่แจ้งซ่อมจากการตรวจแต่ชื่อไม่โผล่ในเช็คชีต ต้องยังเห็น ไม่ใช่หายไปเฉย ๆ
    Object.keys(raised).forEach((n) => {
      if (!people.some((x) => x.name === n)) people.push({ name: n, checks: 0, abnormal: 0, machines: 0, days: 0 });
    });

    /* ตัวหารที่ขาดมาตลอดได้แล้ว — "ควรตรวจกี่เครื่อง" = เครื่องของสถานีที่เขาประจำ
       ก่อนหน้านี้ไม่มีข้อมูลนี้ จึงให้คะแนนตำแหน่งนี้ไม่ได้
       คนที่ยังไม่ได้ระบุสถานีใน Users ยังคงไม่มีตัวหาร — ขึ้น null ไม่ใช่เดาเป็นทั้งโรงงาน */
    const stationOf = (n) => String(TEAM.find((u) => u.name === n)?.station || "").trim();

    return people.map((r) => {
      const st = stationOf(r.name);
      const should = stationMachines(st).length;
      const coverRate = should ? pct(Math.min(r.machines, should), should) : null;
      const out = {
        name: r.name, station: st,
        checkDays: r.days, checkMachines: r.machines, shouldMachines: should,
        coverRate, abnormalFound: r.abnormal, ticketsRaised: raised[r.name] || 0,
        enough: true,
      };
      out.total = techTotal({ ...out, enough: !!should }, def.weights);
      return out;
    }).sort((a, b) => (b.total?.score ?? -1) - (a.total?.score ?? -1) || b.checkDays - a.checkDays);
  }

  if (def.source === "lead") {
    /* หัวหน้าช่างเทคนิควัดที่ "จ่ายงานครบไหม" กับ "ตรวจรับงานไหม"
       ระบบไม่มีตารางทีม จึงนับคนที่ลงมือทำสองอย่างนี้จริงจากใบ ไม่ใช่เดาจากตำแหน่งในชีต Users */
    const by = {};
    const touch = (n) => (by[n] ||= { name: n, verifyCount: 0, teamOpen: 0, teamOverdue: 0,
                                      assignedRate: null, enough: true, total: null });
    p.list.forEach((t) => {
      const v = String(t.verified_by || "").trim();
      if (v) touch(v).verifyCount++;
    });
    const openAll = live(tickets).filter((t) => t.status !== STATUS.DONE);
    const assigned = p.list.filter((t) => nameList(t.assignee).length).length;
    const deptRate = pct(assigned, p.list.length);
    Object.values(by).forEach((r) => {
      r.assignedRate = deptRate;                 // เป็นตัวเลขของทั้งแผนก แสดงซ้ำทุกแถวเพื่อให้เทียบง่าย
      r.teamOpen = openAll.length;
      r.teamOverdue = openAll.filter((t) => isOverdue(t, sla)).length;
    });
    return Object.values(by).sort((a, b) => b.verifyCount - a.verifyCount);
  }

  return [];                                     // dept = ไม่มีตารางรายคน
}

/* ตารางผลงานรายคน — คอลัมน์เปลี่ยนตามตำแหน่งที่เลือก
   ตารางเดียวทุกตำแหน่ง เพราะโครงเหมือนกันหมด (ชื่อ + ตัวเลขหลายช่อง + คะแนนถ้ามี)
   ต่างกันแค่หยิบคอลัมน์ไหนมาจาก TS_COL ซึ่งทำให้เพิ่มตำแหน่งใหม่เป็นการแก้ข้อมูล ไม่ใช่แก้โค้ด */
function panelTech(p, roleKey) {
  const def = ROLE_KPI[roleKey];
  const box = $("#rolePanel"), gap = $("#roleGap");
  if (!def) { if (box) box.hidden = true; return; }
  box.hidden = false;

  $("#roleTitle").textContent = tt(`ผลงานรายคน — ${def.label}`, `Per person — ${def.label}`);
  $("#roleNote").textContent = tt(def.note, def.note);

  // ตัวชี้วัดที่ยังวัดให้ไม่ได้ ต้องบอกตรง ๆ ว่าขาดอะไร ไม่ใช่เงียบแล้วให้เข้าใจว่าครบแล้ว
  gap.hidden = !def.missing.length;
  $("#roleGapList").innerHTML = def.missing.map(([what, why]) => `<div class="flex gap-3">
      <dt class="font-bold shrink-0 w-56 text-slate-700">${esc(what)}</dt>
      <dd class="text-slate-600">${esc(why)}</dd></div>`).join("");

  if (def.source === "dept") {
    $("#tsHead").innerHTML = "";
    $("#tsBody").innerHTML = `<tr><td class="empty">${esc(tt(
      "ตัวชี้วัดของตำแหน่งนี้คือ KPI ของทั้งแผนก — ดูการ์ดด้านบนของหน้านี้",
      "This role is measured by the department KPIs — see the cards above"))}</td></tr>`;
    $("#tsNote").textContent = "";
    return;
  }

  const hideFew = $("#tsHideFew")?.checked;
  const all = roleRows(roleKey, p);
  const rows = hideFew ? all.filter((r) => r.enough !== false) : all;
  const cols = def.cols.map((key) => [key, ...TS_COL[key]]);
  const scored = all.some((r) => r.total);

  $("#tsHead").innerHTML = `<th class="th">${esc(tt("ชื่อ", "Name"))}</th>` +
    (scored ? `<th class="th num">${esc(tt("คะแนนรวม", "Score"))}</th>` : "") +
    (def.source === "ticket" ? `<th class="th num">${esc(tt("ใบที่ปิด", "Closed"))}</th>` : "") +
    cols.map(([, label]) => `<th class="th num">${esc(label)}</th>`).join("");

  const fmt = { pct: (v) => v + "%", num: (v) => nf(v), wk: (v) => v + tt(" สัปดาห์", " wk"),
                txt: (v) => esc(String(v)) };

  $("#tsBody").innerHTML = rows.length ? rows.map((r) => `<tr>
    <td class="td font-medium" data-label="ชื่อ">${esc(r.name)}${r.enough === false ?
      ` <span class="ts-few">${tt("ข้อมูลไม่พอ", "low n")}</span>` : ""}</td>
    ${scored ? `<td class="td num">${r.total
      ? `<b class="ts-score" style="color:${r.total.score >= 80 ? "#16a34a"
          : r.total.score >= 60 ? "#ca8a04" : "#dc2626"}"
           title="${esc(scoreBreakdown(r.total))}">${r.total.score}</b>`
      : `<span class="text-slate-300">—</span>`}</td>` : ""}
    ${def.source === "ticket" ? tsCell(r, "closed", nf(r.closed)) : ""}
    ${cols.map(([, , get, kind, isBad, drill]) => {
      const v = get(r);
      if (v === null || v === undefined) return `<td class="td num text-slate-300">—</td>`;
      return tsCell(r, drill, fmt[kind](v), isBad(v));
    }).join("")}
  </tr>`).join("")
    : `<tr><td colspan="${cols.length + 3}" class="empty">— ${
        esc(tt("ยังไม่มีข้อมูลของตำแหน่งนี้ในช่วงที่เลือก", "no data for this role in the selected period"))} —</td></tr>`;

  $("#tsNote").textContent = def.source === "ticket"
    ? tt(`เครดิตงานไปที่ช่อง "ผู้เข้าซ่อม" (ไม่ได้กรอกจึงใช้ "ผู้รับผิดชอบ") · ` +
         `ใบที่ช่วยกันหลายคนนับให้ทุกคน · "งานค้าง"/"Backlog" ดูทั้งระบบ ไม่ขึ้นกับช่วงเวลา · ` +
         `คะแนนรวมถ่วงน้ำหนักตามชีต "ตั้งค่า" — ชี้ที่ตัวเลขเพื่อดูที่มา`,
         "Credited to the technician field, falling back to the assignee")
    : def.source === "check"
    ? tt(`นับจากชีต "Daily Check" ในช่วงที่เลือก · ` +
         `ยังไม่ให้คะแนนรวมกับตำแหน่งนี้ เพราะตัวหารที่ถูกต้องคือ "ควรตรวจกี่ครั้งตามตารางเวร" ซึ่งระบบยังไม่มี · ` +
         `"แจ้งซ่อมจากการตรวจ" นับใบที่เกิดจากเช็คชีตและพารามิเตอร์เครื่องจักร`,
         "From the Daily Check sheet · no composite score yet: the correct denominator (shift roster) is not in the system")
    : tt(`นับจากช่อง "ผู้ตรวจรับงาน" ในใบแจ้งซ่อม · ` +
         `"ใบที่จ่ายงานแล้ว" กับ "งานค้างของทีม" เป็นตัวเลขของทั้งแผนก จึงเท่ากันทุกแถว`,
         "From the verifier field · department-wide figures repeat on every row");
}

/** เซลล์ตัวเลขที่กดดูใบได้ — ไม่มีคีย์ drill ก็เป็นเซลล์ธรรมดา */
function tsCell(r, drill, text, bad) {
  if (!drill) return `<td class="td num"${bad ? ' style="color:#dc2626;font-weight:700"' : ""}>${text}</td>`;
  return `<td class="td num ts-cell" data-ts="${esc(r.name)}" data-tsm="${esc(drill)}"
    ${bad ? 'style="color:#dc2626;font-weight:700"' : ""}>${text}</td>`;
}

function panelWorkload(p) {
  const hideEmpty = $("#wlHideEmpty")?.checked;
  const all = workloadRows(p);
  const rows = hideEmpty ? all.filter((r) => r.open > 0) : all;
  const totalOpen = all.reduce((a, b) => a + b.open, 0);
  const withWork = all.filter((r) => r.open > 0);
  const unassigned = live(tickets).filter((t) => t.status !== STATUS.DONE && !nameList(t.assignee).length);

  $("#wlStats").innerHTML = [
    { ico: "🧑‍🔧", bg: "#e0e7ff", fg: "#3730a3", label: "ช่างที่มีงานค้าง", num: nf(withWork.length),
      sub: tt(`จากทั้งหมด ${nf(all.length)} คน`, `of ${nf(all.length)} people`) },
    { ico: "📦", bg: "#fef9c3", fg: "#854d0e", label: "งานค้างเฉลี่ยต่อคน",
      num: withWork.length ? (totalOpen / withWork.length).toFixed(1) : "0" },
    { ico: "⚖️", bg: "#ffedd5", fg: "#9a3412", label: "คนที่ถืองานมากที่สุด",
      num: withWork.length ? nf(withWork[0].open) : "0",
      sub: withWork.length ? withWork[0].name : "" },
    { ico: "👤", bg: "#fee2e2", fg: "#991b1b", label: "ยังไม่มอบหมาย", num: nf(unassigned.length),
      sub: tt("เลือกในหน้าติดตามสถานะแล้วจ่ายทีเดียว", "select in the list and assign in one go") },
  ].map(statCard).join("");

  // แถบสัดส่วนยาวเท่ากับคนที่ถือเยอะสุด เทียบกันด้วยตาได้ทันทีว่าใครหนักกว่าใคร
  const maxOpen = Math.max(1, ...all.map((r) => r.open));
  $("#wlBody").innerHTML = rows.length ? rows.map((r) => `<tr>
    <td class="td font-medium" data-label="ช่าง">${esc(r.name)}</td>
    <td class="td num font-bold" data-label="งานค้าง"
        style="color:${r.open ? "var(--brand)" : "#94a3b8"}">${nf(r.open)}</td>
    <td class="td" data-label="สัดส่วนตามสถานะ">
      <div class="wl-bar" style="width:${Math.round((r.open / maxOpen) * 100)}%">${
        LIVE_STATUSES.filter((st) => st !== STATUS.DONE).map((st) => {
          const n = r.byStatus[st] || 0;
          if (!n) return "";
          return `<i style="flex:${n};background:${STATUS_META[st].chart}"
                     title="${esc(st)} ${n}"></i>`;
        }).join("")}</div></td>
    <td class="td num" data-label="วิกฤต/ด่วน">${r.urgent
      ? `<b style="color:#dc2626">${nf(r.urgent)}</b>` : "-"}</td>
    <td class="td num" data-label="เลยกำหนด">${r.late
      ? `<b style="color:#dc2626">${nf(r.late)}</b>` : "-"}</td>
    <td class="td num text-slate-600" data-label="ปิดในช่วงที่เลือก">${nf(r.closed)}</td>
    <td class="td num text-slate-600" data-label="MTTR">${r.mttr === null ? "-" : fmtDuration(r.mttr)}</td>
  </tr>`).join("")
    : `<tr><td colspan="7" class="empty">— ยังไม่มีงานที่มอบหมายให้ใคร —</td></tr>`;
}


/* ═══════════ กดการ์ด KPI แล้วเห็นใบที่ประกอบเป็นตัวเลขนั้น ═══════════
   ตัวเลขเดี่ยว ๆ ที่ตรวจสอบไม่ได้คือตัวเลขที่คนจะเถียงในที่ประชุมแล้วไม่มีใครชนะ
   "39.1% มาจากไหน" ต้องตอบได้ภายในคลิกเดียว ไม่ใช่กลับไปเปิดชีตไล่ดูเอง

   ทุกชุดคืนสูตรที่ใช้จริงมาด้วย ไม่ใช่แค่รายการ — เห็นทั้งตัวเศษ ตัวหาร และใบที่ถูกนับ
   จะได้รู้ว่าตัวเลขผิดเพราะข้อมูลผิด หรือเพราะเข้าใจนิยามคนละอย่าง */

/* ใบที่ประกอบเป็นตัวเลขของคนนั้น — ใช้โมดอลเดียวกับ KPI ของทั้งแผนก ไม่สร้างใหม่
   ตัวเลขรายคนจะถูกเอาไปคุยกับเจ้าตัว จึงต้องกดดูใบได้ทุกตัวโดยไม่ต้องกลับไปเปิดชีต */
function techDrill(metric, name, p, sla) {
  const mine = (t) => hasName(t.technician || t.assignee, name);
  const done = p.list.filter((t) => t.status === STATUS.DONE && mine(t));
  const base = (t) => [t.ticket_id, t.machine_name || "—", symptom(t)];
  const H = ["เลขที่", "เครื่องจักร", "อาการ"];
  const who = (s) => `${s} — ${name}`;

  switch (metric) {
    case "closed":
      return { title: who("ใบที่ปิดแล้ว"), head: [...H, "ปิดเมื่อ", "ช่างลงมือ"],
        formula: tt(`ปิดไป ${nf(done.length)} ใบในช่วงที่เลือก`,
                    `${nf(done.length)} tickets closed in this period`),
        rows: done.map((t) => dRow(t.ticket_id, [...base(t), fmtDT(t.completed_at),
          wrenchHours(t) === null ? tt("ไม่ได้ลงเวลาซ่อม", "no repair time")
                                  : fmtDuration(wrenchHours(t))])) };

    case "ftf": {
      const seen = done.filter((t) => t.verification_status);
      return { title: who("First-Time Fix"), head: [...H, "ผลการตรวจรับ", "ถูกส่งกลับ"],
        formula: tt(`ผ่านครั้งแรก ${nf(seen.filter((t) => !(Number(t.reject_count) > 0)).length)} ` +
                    `÷ ใบที่ถูกตรวจรับ ${nf(seen.length)} ใบ · ใบที่ยังไม่ถูกตรวจรับไม่อยู่ในตัวหาร`,
                    `first-time passes ÷ ${nf(seen.length)} verified tickets`),
        rows: seen.sort((a, b) => (Number(b.reject_count) || 0) - (Number(a.reject_count) || 0))
          .map((t) => { const n = Number(t.reject_count) || 0;
            return dRow(t.ticket_id, [...base(t), t.verification_status,
              n ? tt(n + " ครั้ง", n + "×") : tt("ไม่เคย", "never")], n > 0); }) };
    }

    case "onTime": {
      const judged = done.filter((t) => !waitedOutside(t));
      const skipped = done.filter(waitedOutside);
      return { title: who("ปิดทันกำหนด"), head: [...H, "กำหนดเสร็จ", "ปิดจริง", "ผล"],
        formula: tt(`ทัน ${nf(judged.filter((t) => closedOnTime(t, sla)).length)} ÷ ${nf(judged.length)} ใบ · ` +
                    `ตัดใบที่รอของจากข้างนอกออก ${nf(skipped.length)} ใบ (ช่างเร่งเองไม่ได้)`,
                    `on time ÷ ${nf(judged.length)} · ${nf(skipped.length)} excluded (waiting on outside)`),
        rows: [...judged.map((t) => { const ok = closedOnTime(t, sla);
                 return dRow(t.ticket_id, [...base(t),
                   t.due_at ? thDay(t.due_at) : tt(`ไม่ได้ตั้ง (ใช้ ${sla} ชม.)`, `not set (${sla} h)`),
                   fmtDT(t.completed_at), ok ? tt("ทัน", "on time") : tt("เลยกำหนด", "late")], !ok); }),
               ...skipped.map((t) => dRow(t.ticket_id, [...base(t), "—", fmtDT(t.completed_at),
                   tt("ไม่นับ — รอของจากข้างนอก", "excluded — waiting on outside")]))] };
    }

    case "log":
      return { title: who("วินัยการบันทึก"), head: [...H, "เวลาซ่อม", "สิ่งที่ทำ", "ผล"],
        formula: tt(`ใบที่บันทึกครบ ${nf(done.filter(loggedWell).length)} ÷ ${nf(done.length)} ใบ · ` +
                    `ครบ = มีเวลาซ่อม (ช่องใช้เวลา หรือปุ่มเริ่มซ่อม) และมีสิ่งที่ทำไปจริง`,
                    `complete records ÷ ${nf(done.length)} closed`),
        rows: [...done].sort((a, b) => loggedWell(a) - loggedWell(b)).map((t) => {
          const ok = loggedWell(t);
          return dRow(t.ticket_id, [...base(t),
            wrenchHours(t) === null ? tt("ไม่ได้ลง", "missing") : fmtDuration(wrenchHours(t)),
            String(t.repair_action || "").trim() || tt("ไม่ได้ลง", "missing"),
            ok ? tt("ครบ", "complete") : tt("ไม่ครบ", "incomplete")], !ok); }) };

    case "repeat": {
      const pairs = findRepeats(p.list, Number($("#repeatWindow")?.value) || 30)
        .filter((r) => r.prev.status === STATUS.DONE && mine(r.prev));
      return { title: who("งานที่กลับมาเสียซ้ำ"), head: ["เครื่องจักร", "ใบที่เขาปิด", "อาการครั้งนั้น",
                 "ใบที่กลับมาซ้ำ", "อาการครั้งใหม่", "ห่างกัน"],
        formula: tt(`ใบที่เขาปิดแล้วเครื่องเดิมถูกแจ้งซ้ำ ${nf(pairs.length)} ครั้ง ÷ ปิดไป ${nf(done.length)} ใบ · ` +
                    `ความรับผิดอยู่ที่คนที่ปิดใบก่อนหน้า ไม่ใช่คนที่มารับใบใหม่`,
                    `${nf(pairs.length)} came back ÷ ${nf(done.length)} closed`),
        rows: pairs.sort((a, b) => a.gapDays - b.gapDays).map((r) =>
          dRow(r.curr.ticket_id, [r.machine, r.prev.ticket_id, symptom(r.prev),
            r.curr.ticket_id, symptom(r.curr), tt(r.gapDays + " วัน", r.gapDays + " d")], true)) };
    }

    case "pm": {
      const items = (pmCal?.items || [])
        .filter((x) => hasName(x.owner, name));
      return { title: who("PM ตามแผน"), head: ["เครื่องจักร", "งาน PM", "วันที่วางแผน", "ทำจริง", "สถานะ"],
        formula: tt(`ทำแล้ว ${nf(items.filter((x) => x.actual).length)} ÷ ที่ได้รับมอบหมาย ${nf(items.length)} ครั้ง · ` +
                    `เฉพาะเดือนที่เปิดหน้า "แผน PM" ไว้`,
                    `done ÷ ${nf(items.length)} assigned (only the month loaded in the PM tab)`),
        rows: items.map((x) => dRow("", [x.machine, x.task, x.planned || "—",
          x.actual || "—", x.status], !x.actual)) };
    }

    case "open": {
      const mineOpen = live(tickets).filter((t) => t.status !== STATUS.DONE && hasName(t.assignee, name));
      return { title: who("งานค้างตอนนี้"), head: [...H, "สถานะ", "ค้างมาแล้ว", "กำหนดเสร็จ"],
        formula: tt(`ค้างอยู่ ${nf(mineOpen.length)} ใบ — ดูทั้งระบบ ไม่ขึ้นกับช่วงเวลาที่เลือกด้านบน`,
                    `${nf(mineOpen.length)} open — system-wide, not period-bound`),
        rows: mineOpen.sort((a, b) => (elapsedHours(b) ?? 0) - (elapsedHours(a) ?? 0)).map((t) =>
          dRow(t.ticket_id, [...base(t), t.status, fmtDuration(elapsedHours(t)),
            t.due_at ? thDay(t.due_at) : "—"], dueInfo(t).cls === "due-late")) };
    }
  }
  return null;
}

/** แถวหนึ่งของตารางรายละเอียด — id ใส่ไว้เพื่อให้กดเปิดใบต่อได้ */
const dRow = (id, cells, bad) => ({ id: id || "", cells, bad: !!bad });

function kpiDrill(key, k, p, sla, into) {
  // ผลงานรายคนใช้โมดอลเดียวกัน แต่กรองด้วย "ชื่อคน" ซึ่ง switch ด้านล่างไม่มีช่องให้ส่ง
  if (key.indexOf("tech:") === 0) return techDrill(key.slice(5), into, p, sla);
  const list = p.list;
  const done = list.filter((t) => t.status === STATUS.DONE);
  const open = list.filter((t) => t.status !== STATUS.DONE);
  const base = (t) => [t.ticket_id, t.machine_name || "—", symptom(t)];
  const H = ["เลขที่", "เครื่องจักร", "อาการ"];

  switch (key) {
    case "onTime": {
      const rows = [...done].sort((a, b) => closedOnTime(a, sla) - closedOnTime(b, sla)).map((t) => {
        const ok = closedOnTime(t, sla);
        return dRow(t.ticket_id, [...base(t),
          t.due_at ? thDay(t.due_at) : tt(`ไม่ได้ตั้ง (ใช้เกณฑ์ ${sla} ชม.)`, `not set (fallback ${sla} h)`),
          t.completed_at ? fmtDT(t.completed_at) : "—",
          ok ? tt("ทัน", "On time") : tt("เลยกำหนด", "Late")], !ok);
      });
      return { title: "ปิดงานทันกำหนด", head: [...H, "กำหนดเสร็จ", "ปิดจริง", "ผล"],
               formula: tt(`ทัน ${nf(k.onTime)} ÷ ปิดแล้ว ${nf(k.done)} ใบ = ${k.onTimeRate}%`,
                           `${nf(k.onTime)} on time ÷ ${nf(k.done)} closed = ${k.onTimeRate}%`), rows };
    }
    case "mttr": {
      /* สองคอลัมน์เวลาอยู่คู่กันโดยตั้งใจ — ใบที่ "เครื่องรอ 6 วัน" แต่ "ช่างลงมือ 40 นาที"
         คือใบที่รออะไหล่ ไม่ใช่ใบที่ซ่อมยาก ซึ่งแก้คนละวิธีกันสิ้นเชิง */
      const rows = [...done].sort((a, b) => (waitHours(b) ?? 0) - (waitHours(a) ?? 0))
        .map((t) => dRow(t.ticket_id,
          [...base(t), waitHours(t) === null ? "—" : fmtDuration(waitHours(t)),
           wrenchHours(t) === null ? tt("ไม่ได้ลงเวลาซ่อม", "repair time not recorded")
                                   : fmtDuration(wrenchHours(t))]));
      return { title: "เวลาตั้งแต่แจ้งจนปิดงาน", head: [...H, "เครื่องรอ", "ช่างลงมือ"],
               formula: tt(`เครื่องรอ: มัธยฐาน ${fmtDuration(k.mttrMedian)} · รวม ${fmtDuration(k.downtime)} จาก ${nf(done.length)} ใบ` +
                           ` · ช่างลงมือ: มัธยฐาน ${fmtDuration(k.wrenchMedian)} · รวม ${fmtDuration(k.wrenchTotal)} จาก ${nf(k.wrenchCount)} ใบ`,
                           `Machine waiting: median ${fmtDuration(k.mttrMedian)} · total ${fmtDuration(k.downtime)} over ${nf(done.length)}` +
                           ` · Hands-on: median ${fmtDuration(k.wrenchMedian)} · total ${fmtDuration(k.wrenchTotal)} over ${nf(k.wrenchCount)}`),
               rows };
    }
    case "doneRate": {
      const rows = list.map((t) => dRow(t.ticket_id,
        [...base(t), t.status, t.assignee || tt("ยังไม่มอบหมาย", "Unassigned")], t.status !== STATUS.DONE));
      return { title: "อัตราปิดงานสำเร็จ", head: [...H, "สถานะ", "ผู้รับผิดชอบ"],
               formula: tt(`ปิดแล้ว ${nf(k.done)} ÷ ทั้งหมด ${nf(list.length)} ใบ = ${k.doneRate}%`,
                           `${nf(k.done)} closed ÷ ${nf(list.length)} total = ${k.doneRate}%`), rows };
    }
    case "ftf": {
      const v = done.filter((t) => t.verification_status);
      const rows = v.map((t) => {
        const n = Number(t.reject_count) || 0;
        return dRow(t.ticket_id, [...base(t), t.verification_status,
          n ? tt(`ถูกส่งกลับ ${n} ครั้ง`, `sent back ${n}×`)
            : tt("ผ่านตั้งแต่ครั้งแรก", "passed first time")], n > 0);
      });
      return { title: "First-Time Fix", head: [...H, "ผลตรวจรับ", "ประวัติการส่งกลับ"],
               formula: v.length
                 ? tt(`ผ่านครั้งแรก ${nf(k.verified - k.reworked)} ÷ ตรวจรับแล้ว ${nf(k.verified)} ใบ = ${k.firstTimeFix}%`,
                      `${nf(k.verified - k.reworked)} first-pass ÷ ${nf(k.verified)} verified = ${k.firstTimeFix}%`)
                 : tt("ยังไม่มีใบไหนถูกตรวจรับ จึงยังไม่รู้ผล", "No ticket has been verified yet"), rows };
    }
    case "cost": {
      const rows = list.filter((t) => Number(t.cost) > 0)
        .sort((a, b) => Number(b.cost) - Number(a.cost))
        .map((t) => dRow(t.ticket_id, [...base(t), money(Number(t.cost)) + " ฿", t.status]));
      return { title: "ค่าใช้จ่าย", head: [...H, "ค่าใช้จ่าย", "สถานะ"],
               sums: [null, null, null, tt(`รวม ${money(k.cost)} ฿`, `${money(k.cost)} THB total`), null],
               formula: tt(`รวม ${money(k.cost)} ฿ จาก ${nf(k.paidCount)} ใบที่มีค่าใช้จ่าย · ` +
                           `เฉลี่ยต่อใบทั้งหมด ${money(k.costPerTicket)} ฿ · มัธยฐาน ${money(k.costMedian || 0)} ฿`,
                           `${money(k.cost)} THB total over ${nf(k.paidCount)} billed tickets · ` +
                           `${money(k.costPerTicket)} per ticket · median ${money(k.costMedian || 0)}`),
               rows };
    }
    case "open": {
      /* ใบที่เลยกำหนดขึ้นก่อนและขึ้นพื้นแดง แต่แสดงใบคงค้างทั้งหมด
         เพราะ KPI ของแผนกนับทุกใบที่ยังไม่ปิด ไม่ใช่เฉพาะใบที่เลยกำหนด */
      const rows = [...open]
        .sort((a, b) => (isOverdue(b, sla) - isOverdue(a, sla)) ||
                        ((elapsedHours(b) ?? 0) - (elapsedHours(a) ?? 0)))
        .map((t) => dRow(t.ticket_id, [...base(t), t.status,
          t.due_at ? thDay(t.due_at) : tt("ไม่ได้ตั้ง", "not set"),
          fmtDuration(elapsedHours(t)),
          t.assignee || tt("ยังไม่มอบหมาย", "Unassigned")], isOverdue(t, sla)));
      return { title: "ใบแจ้งซ่อมคงค้าง", head: [...H, "สถานะ", "กำหนดเสร็จ", "ค้างมาแล้ว", "ผู้รับผิดชอบ"],
               formula: tt(`ยังไม่ปิด ${nf(open.length)} ใบ (เป้า 0) · ในนั้นเลยกำหนดเสร็จ ${nf(k.overdue)} ใบ`,
                           `${nf(open.length)} still open (target 0) · ${nf(k.overdue)} already past due`), rows };
    }
    case "breakdown": {
      /* แยกให้เห็นสองกอง — ใบที่ถูกนับ กับใบที่ถูกตัดทิ้งพร้อมเหตุผล
         ไม่งั้นคนจะสงสัยว่าทำไมใบที่ตัวเองปิดไปไม่อยู่ในนี้ แล้วเลิกเชื่อตัวเลข */
      /* โชว์สองคอลัมน์คู่กัน — "หยุดในเดือนนี้" คือตัวที่ถูกนับ ส่วน "ทั้งใบ" คือความยาวจริง
         ใบที่สองเลขไม่เท่ากันคือใบที่คร่อมเดือน ซึ่งเป็นต้นเหตุที่ตัวเลขเก่าเพี้ยน
         ต้องเห็นได้ทันทีว่าใบไหนถูกหั่น ไม่งั้นคนจะงงว่าทำไม 46 วันเหลือ 6 วัน */
      const win = periodWindow(p);
      const nowMs = Date.now();
      const rows = win.all.map((t) => {
        const sp = stopSpan(t, "wait", nowMs);
        if (!sp) return null;
        const inMonth = overlapHours(sp[0], sp[1], win.from, win.to);
        if (inMonth <= 0) return null;                      // ไม่แตะเดือนนี้เลย = ไม่เกี่ยว
        const wsp = stopSpan(t, "wrench", nowMs);
        return { t, inMonth, full: (sp[1] - sp[0]) / 36e5,
                 wIn: wsp ? overlapHours(wsp[0], wsp[1], win.from, win.to) : null,
                 inn: isProductionStop(t, win.group), g: machineGroupOf(t.machine_name) };
      }).filter(Boolean)
        .sort((a, b) => (b.inn - a.inn) || (b.inMonth - a.inMonth))
        .map((r) => dRow(r.t.ticket_id, [...base(r.t),
          fmtDuration(r.inMonth),
          r.full - r.inMonth > 0.02 ? fmtDuration(r.full) : "—",
          r.wIn === null ? tt("ไม่ได้ลงเวลาซ่อม", "repair time not recorded") : fmtDuration(r.wIn),
          r.inn ? (r.g || tt("นับ (ยังไม่ได้โหลดทะเบียน)", "counted (registry not loaded)"))
                : (r.g || tt("ไม่มีเครื่องในทะเบียน", "not in the registry")) + tt(" — ไม่นับ", " — not counted")], !r.inn));
      /* รวมเฉพาะใบที่ถูกนับ ไม่ใช่ทุกแถวที่แสดง — ในตารางมีใบของอาคาร/เครื่องใช้ไฟฟ้าปนอยู่
         เพื่อให้เห็นว่าอะไรถูกตัดออกและเพราะอะไร ถ้าบวกรวมไปด้วยจะไม่ตรงกับตัวเลขบนการ์ด */
      const sums = [null, null, null,
        tt(`รวมที่นับ ${fmtDuration(k.machineDowntime)}`, `counted ${fmtDuration(k.machineDowntime)}`),
        null,
        tt(`รวมที่นับ ${fmtDuration(k.machineWrench)}`, `counted ${fmtDuration(k.machineWrench)}`),
        null];
      return { title: k.bdGroup ? `% Breakdown — ${k.bdGroup}` : "% Breakdown", sums,
               head: [...H, "หยุดในเดือนนี้", "ทั้งใบ (คร่อมเดือน)", "ช่างลงมือในเดือนนี้", "กลุ่มในทะเบียน"],
               formula: k.breakdownRate === null
                 ? tt(`เครื่องรอ ${fmtDuration(k.machineDowntime)} · ช่างลงมือ ${fmtDuration(k.machineWrench)} จาก ${nf(k.machineStops)} ใบ — ยังไม่ได้ใส่ชั่วโมงทำงานรวมของเดือน`,
                      `waiting ${fmtDuration(k.machineDowntime)} · hands-on ${fmtDuration(k.machineWrench)} over ${nf(k.machineStops)} tickets — monthly operating hours not entered yet`)
                 : tt((k.bdGroup ? `เฉพาะ${k.bdGroup} · ` : "") +
                      `ตัวหาร ${nf(k.fleet)} เครื่อง × ${nf(p.pm.workHours)} ชม. = ${nf(k.availHours)} ชม. · ` +
                      `ค่าสูง (เครื่องรอ) ${fmtDuration(k.machineDowntime)} = ${k.breakdownRate}% · ` +
                      `ค่าต่ำ (ช่างลงมือ) ${fmtDuration(k.machineWrench)} = ${k.wrenchRate}% · ` +
                      `นับเฉพาะส่วนที่อยู่ในเดือนนี้` +
                      (k.mergedTickets ? ` · ใบที่เวลาซ้อนกันบนเครื่องเดียวกัน ${nf(k.mergedTickets)} ใบ นับครั้งเดียว ` +
                        `(ยอดรวมหัวตารางจึงน้อยกว่าเอาทุกแถวมาบวกกัน)` : "") +
                      (k.cappedMachines ? ` · ปัดลงเพราะชนเพดานของเดือน ${nf(k.cappedMachines)} เครื่อง` : ""),
                      (k.bdGroup ? `${k.bdGroup} only · ` : "") +
                      `denominator ${nf(k.fleet)} machines × ${nf(p.pm.workHours)} h = ${nf(k.availHours)} h · ` +
                      `upper ${fmtDuration(k.machineDowntime)} = ${k.breakdownRate}% · ` +
                      `lower ${fmtDuration(k.machineWrench)} = ${k.wrenchRate}% · ` +
                      `counting only the part inside this month` +
                      (k.mergedTickets ? ` · ${nf(k.mergedTickets)} overlapping tickets counted once` : "") +
                      (k.cappedMachines ? ` · ${nf(k.cappedMachines)} machines capped` : "")),
               rows };
    }
    case "repeat": {
      const r = repeatByCount(list);
      /* กดที่เครื่องแล้วเข้าไปดูใบทั้งหมดของเครื่องนั้นได้ — ตัวเลข "แจ้ง 8 ครั้ง" อย่างเดียว
         ยังตอบไม่ได้ว่าเป็นอาการเดียวกันซ้ำ ๆ (ซ่อมไม่หาย) หรือคนละเรื่องกันทั้ง 8 ครั้ง (เครื่องเก่า)
         ซึ่งเป็นสองปัญหาที่ต้องแก้คนละวิธีสิ้นเชิง */
      const rows = r.machines.map((m) => {
        const x = dRow("", [m.machine, tt(nf(m.count) + " ครั้ง", nf(m.count) + "×"),
          m.count >= 2 ? tt("นับเป็นซ่อมซ้ำ", "counted as repeat") : "—"], m.count >= 2);
        x.into = m.machine;
        return x;
      });
      return { title: "% ซ่อมซ้ำ", head: ["เครื่องจักร", "จำนวนครั้งในรอบนี้", "ผล"],
               formula: tt(`ตามไฟล์ KPI: ซ่อมซ้ำ ${nf(k.repeatCases)} เคส ÷ ใบแจ้งซ่อม ${nf(k.total)} ใบ = ${k.repeatRate}% (เป้า ≤ 10%) · ` +
                           `รายเครื่อง: ${nf(r.repeated.length)} จาก ${nf(r.machines.length)} เครื่อง = ${r.rate}%`,
                           `Per KPI file: ${nf(k.repeatCases)} cases ÷ ${nf(k.total)} tickets = ${k.repeatRate}% (target ≤ 10%) · ` +
                           `by machine: ${nf(r.repeated.length)} of ${nf(r.machines.length)} = ${r.rate}%`),
               rows };
    }
    case "repeatMachine": {
      /* เรียงเก่า -> ใหม่ เพราะคนอ่านเพื่อไล่ว่า "ครั้งก่อนซ่อมอะไรไว้ แล้วครั้งนี้เป็นอะไรอีก"
         ต่างจากชุดอื่นที่เรียงใหม่ก่อน */
      const mine = list.filter((t) => t.machine_name === into)
        .sort((a, b) => String(a.created_at).localeCompare(String(b.created_at)));
      const rows = mine.map((t, i) => {
        const prev = mine[i - 1];
        const gap = prev
          ? Math.round((new Date(t.created_at) - new Date(prev.created_at)) / 864e5 * 10) / 10
          : null;
        return dRow(t.ticket_id, [
          fmtDT(t.created_at), symptom(t),
          String(t.cause || "—"), String(t.solution || "—"),
          gap === null ? tt("ครั้งแรกในรอบนี้", "first this period")
                       : tt(`ห่างจากครั้งก่อน ${gap} วัน`, `${gap} days after previous`),
        ], gap !== null && gap <= 30);
      });
      return { title: `ซ่อมซ้ำ — ${into}`,
               head: ["วันที่แจ้ง", "อาการ", "สาเหตุ", "การซ่อม", "ระยะห่าง"],
               formula: tt(`แจ้ง ${nf(mine.length)} ครั้งในรอบนี้ — เทียบอาการกับการซ่อมดูว่าเป็นเรื่องเดียวกันหรือไม่`,
                           `${nf(mine.length)} tickets this period — compare symptom and fix to see if it is the same fault`),
               rows, back: true };
    }
    default: return null;
  }
}

let drillKey = "", drillInto = "";

function openKpiDrill(key, into) {
  drillKey = key;
  drillInto = into || "";
  const p = period();
  const sla = slaInput();
  /* ต้องส่งอาร์กิวเมนต์ชุดเดียวกับ panelKpi เป๊ะ ๆ ไม่งั้นการ์ดกับรายละเอียดจะคนละเลข
     ซึ่งเป็นอาการที่ทำลายความเชื่อถือของทั้งหน้าเร็วกว่าตัวเลขผิดเสียอีก */
  const d = kpiDrill(key, kpiSummary(p.list, sla, p.pm,
    Number($("#repeatWindow")?.value) || 30, periodWindow(p)), p, sla, drillInto);
  if (!d) return;

  $("#kdBack").classList.toggle("hidden", !d.back);
  $("#kdTitle").textContent = tt(d.title, d.title);
  $("#kdFormula").textContent = d.formula;
  $("#kdCount").textContent = tt(`${nf(d.rows.length)} รายการ`, `${nf(d.rows.length)} rows`);
  /* ยอดรวมอยู่ที่หัวคอลัมน์ ไม่ใช่แถวท้ายตาราง — ตารางนี้ยาวหลายสิบแถวและเลื่อนดู
     ถ้าวางไว้ท้ายสุดต้องเลื่อนจนสุดถึงจะเห็น ซึ่งเป็นเลขที่คนอยากเห็นก่อนอ่านรายการด้วยซ้ำ */
  $("#kdHead").innerHTML = drillHead(d);
  $("#kdBody").innerHTML = drillBody(d);
  $("#kpiDrillModal").classList.remove("hidden");
}

const closeKpiDrill = () => $("#kpiDrillModal").classList.add("hidden");

/* หัวและตัวตารางรายละเอียด แยกออกมาเพราะตอนนี้มีสองที่ที่วาด —
   โมดอล (กดการ์ด) กับในหน้า KPI (เลือกดูทีละตัว) ถ้าลอกโค้ดไว้สองที่เดี๋ยวแก้ที่เดียวแล้วลืมอีกที่ */
const drillHead = (d) => d.head.map((h, i) => `<th class="th">${esc(h)}${
  d.sums && d.sums[i] ? `<span class="kd-sum">${esc(d.sums[i])}</span>` : ""}</th>`).join("");

const drillBody = (d) => d.rows.length
  ? d.rows.map((r) => `<tr class="${r.bad ? "param-out" : ""}${r.id || r.into ? " kd-click" : ""}"
      ${r.id ? `data-kd="${esc(r.id)}"` : ""}${r.into ? ` data-kd-into="${esc(r.into)}"` : ""}>${
      r.cells.map((c) => `<td class="td">${esc(c)}</td>`).join("")}</tr>`).join("")
  : `<tr><td colspan="${d.head.length}" class="empty">— ไม่มีรายการ —</td></tr>`;

/* ทะเบียน KPI ที่เจาะดูได้ — ลำดับตรงกับการ์ดบนหน้าจอ
   ไม่ไปอ่านจาก DOM เพราะการ์ดบางใบไม่มี drill (เช่นตอนยังไม่ได้กรอกชั่วโมงทำงาน)
   แล้วรายการจะเปลี่ยนไปมาตามข้อมูล ซึ่งทำให้ค่าที่เลือกไว้หายเองโดยไม่มีสาเหตุ */
const KPI_PICK = [
  ["repeat",    "% ซ่อมซ้ำ"],
  ["open",      "ใบแจ้งซ่อมคงค้าง"],
  ["breakdown", "% Breakdown"],
  ["onTime",    "ปิดงานทันกำหนด"],
  ["mttr",      "เวลาตั้งแต่แจ้งจนปิดงาน"],
  ["doneRate",  "อัตราปิดงานสำเร็จ"],
  ["ftf",       "First-Time Fix"],
  ["cost",      "ค่าใช้จ่าย"],
];

function panelKpi(p) {
  const sla    = slaInput();
  const target = Number($("#slaTarget").value) || 90;
  // ⚠️ ต้องส่ง p.pm ไม่งั้น %Breakdown/%PM เป็น null ตลอด
  const k = kpiSummary(p.list, sla, p.pm, Number($("#repeatWindow")?.value) || 30, periodWindow(p));

  /* การ์ดที่ยังคำนวณไม่ได้กดแล้วพาไปที่ช่องที่ขาด — เขียนว่า "กรอกด้านล่าง" อย่างเดียว
     แปลว่าคนต้องเลื่อนหาเองว่าช่องไหน ซึ่งเป็นจังหวะที่คนเลิกกรอก */
  /* การ์ดที่ยังคำนวณไม่ได้กดแล้วพาไปที่ช่องที่ขาด · การ์ดที่คำนวณได้กดแล้วเห็นใบที่ประกอบเป็นตัวเลขนั้น
     เขียนว่า "กรอกด้านล่าง" อย่างเดียวแปลว่าคนต้องเลื่อนหาเองว่าช่องไหน ซึ่งเป็นจังหวะที่คนเลิกกรอก
     และตัวเลขที่ตรวจสอบไม่ได้คือตัวเลขที่คนจะเถียงในที่ประชุมแล้วไม่มีใครชนะ */
  /* ดาวต้องมาก่อนชื่อ ไม่ใช่ต่อท้าย — .kpi-drill เติม " ›" ไว้ท้าย .kpi-label อยู่แล้ว
     และต้องเป็น element แยก ไม่ใช่เติมลงในสตริง label เพราะตัวแปลภาษาจำ text node ทั้งก้อน
     ถ้าเอา "⭐ " ไปต่อหน้าชื่อ จะหาไม่เจอใน DICT_EN แล้วการ์ดสี่ใบนี้จะไม่แปลเป็นอังกฤษ */
  const card = ({ label, value, note, note2, bar, color, badge, jump, drill, star, goal }) => `<div class="kpi${
      star ? " kpi-main" : ""}${jump ? " kpi-jump" : drill ? " kpi-drill" : ""}"
    ${jump ? `role="button" tabindex="0" data-jump="${jump}" title="กดเพื่อไปที่ช่องที่ต้องกรอก"`
     : drill ? `role="button" tabindex="0" data-drill="${drill}" title="กดเพื่อดูใบที่ประกอบเป็นตัวเลขนี้"` : ""}>
    <div class="kpi-head"><span class="kpi-label">${star
      ? `<b class="kpi-star" title="${tt("หัวข้อที่ไฟล์ KPI Report ของแผนกใช้ประเมิน", "Scored in the department KPI Report")}">★</b>`
      : ""}${esc(label)}</span>${badge || ""}</div>
    <p class="kpi-num" style="color:${color}">${value}</p>
    ${goal ? `<p class="kpi-goal"><i>🎯</i>${esc(goal)}</p>` : ""}
    <p class="kpi-note">${esc(note)}</p>
    ${note2 ? `<p class="kpi-note2">${esc(note2)}</p>` : ""}
    ${bar === undefined ? "" : `<div class="kpi-bar"><i style="width:${Math.min(100, bar)}%;background:${color}"></i></div>`}
  </div>`;

  const ok   = (cond) => (cond ? "#16a34a" : "#dc2626");
  const flag = (cond) => `<span class="trend ${cond ? "trend-down" : "trend-up"}">${cond ? "ผ่านเป้า" : "ต่ำกว่าเป้า"}</span>`;

  /* ═══ เป้าหมาย — คัดจากแถว "เป้าหมาย" หัวชีตของไฟล์ KPI Report ตรงตัว ไม่ตีความใหม่ ═══
     ผู้ตรวจอ่านบรรทัดนี้ในเอกสาร หน้าจอจึงต้องขึ้นเลขเดียวกัน ไม่ใช่เลขที่เราคิดเอง

     ⚠️ สองชีตในไฟล์ "เป้าหมายที่เขียนไว้" กับ "สูตร Judgement" ไม่ตรงกัน —
     ซ่อมซ้ำเขียน ≤10% แต่สูตรเช็ค =0 · Breakdown เขียนไม่เกิน 3% แต่สูตรเช็ค <=100 (ผ่านตลอด)
     ระบบยึด "เป้าหมายที่เขียนไว้" เพราะเป็นบรรทัดที่คนอ่าน ส่วนสูตรเป็นของที่พิมพ์ค้างไว้
     รายละเอียดอยู่ในหัวข้อนิยาม KPI ด้านล่าง จะได้ไม่ต้องเชื่อหน้าจอโดยไม่รู้ที่มา */
  const GOAL = {
    repeat:    tt("เป้าตามเอกสาร: %การซ่อมเครื่องจักรซ้ำ ≤ 10%", "Target on file: repeat repairs ≤ 10%"),
    open:      tt("เป้าตามเอกสาร: ใบแจ้งซ่อมคงค้างเป็น 0", "Target on file: 0 open tickets"),
    pm:        tt("เป้าตามเอกสาร: ทำตามแผนซ่อมบำรุง (PM) 100%", "Target on file: 100% of the PM plan"),
    breakdown: tt("เป้าตามเอกสาร: ไม่เกิน 3% ต่อเดือน", "Target on file: ≤ 3% per month"),
  };
  /* ใช้คำเดียวกับช่อง Judgement ในไฟล์ ไม่ใช่ "ผ่านเป้า/ต่ำกว่าเป้า" ของเรา
     หัวหน้าจะได้ลอกลงเอกสารได้ตรงคำโดยไม่ต้องแปลในหัว */
  const judge = (pass) => `<span class="trend ${pass ? "trend-down" : "trend-up"}">${
    tt(pass ? "บรรลุเป้าหมาย" : "ไม่บรรลุเป้าหมาย", pass ? "Achieve" : "Non-Achieve")}</span>`;

  /* ⭐ สี่ตัวนี้คือ KPI ที่ไฟล์ KPI Report ของแผนกใช้ตัดเกรด — ผู้ตรวจ ISO อ่านสี่หัวข้อนี้
     ที่เหลือเป็นเครื่องมือวิเคราะห์ของเราเอง มีประโยชน์ แต่ไม่ใช่ตัวที่ถูกประเมิน

     ก่อนหน้านี้ทั้งเก้าใบเรียงปนกันในตารางเดียว คนเปิดหน้านี้จึงต้องรู้มาก่อนว่าต้องดูใบไหน
     ซึ่งเป็นความรู้ที่อยู่ในหัวคนทำระบบ ไม่ได้อยู่บนหน้าจอ

     เรียงตามลำดับชีตในไฟล์ จะได้ไล่เทียบกับเอกสารทีละหน้าโดยไม่ต้องกวาดสายตาหา */
  const kpiSection = (title, sub, cards, cols) => `<section>
    <div class="kpi-sec"><h3 class="kpi-sec-title">${title}</h3>
      <p class="kpi-sec-sub">${sub}</p></div>
    <div class="grid ${cols} gap-4">${cards.join("")}</div></section>`;

  $("#kpiCards").innerHTML =
    kpiSection(
      tt("⭐ KPI หลักที่ใช้ประเมินแผนก", "⭐ Department KPIs"),
      tt("สี่หัวข้อตามไฟล์ KPI Report ของแผนก — เรียงตามลำดับชีตในไฟล์",
         "The four scored in the department KPI Report, in the file's sheet order"),
      [
    card({ label: "% ซ่อมซ้ำ", value: k.repeatRate + "%",
           goal: GOAL.repeat,
           badge: judge(k.repeatRate <= 10),
           note: tt(`ซ่อมซ้ำ ${nf(k.repeatCases)} เคส ÷ ใบแจ้งซ่อม ${nf(k.total)} ใบ (ซ้ำภายใน ${k.repeatWin} วัน)`,
                    `${nf(k.repeatCases)} repeat cases ÷ ${nf(k.total)} tickets (within ${k.repeatWin} days)`),
           note2: tt(`รายเครื่อง: เครื่องที่แจ้งตั้งแต่ 2 ครั้ง = ${k.repeatMachineRate}% ของเครื่องที่ถูกแจ้งทั้งหมด`,
                     `By machine: ${k.repeatMachineRate}% of machines were reported 2+ times`),
           bar: k.repeatRate, color: ok(k.repeatRate <= 10), drill: "repeat", star: true }),
    /* ไฟล์ KPI Report นับ "ใบแจ้งซ่อมคงค้าง" (ใบที่ยังไม่ปิด) เป้า 0 ใบ
       ของเดิมโชว์เฉพาะใบที่เลยกำหนด ซึ่งเป็นสับเซตที่เล็กกว่าและไม่ตรงกับเอกสาร */
    card({ label: "ใบแจ้งซ่อมคงค้าง", value: nf(k.open) + " ใบ",
           goal: GOAL.open,
           badge: judge(!k.open),
           note: tt(`ใบที่ยังไม่ปิด ณ ตอนนี้`, `Tickets still open right now`),
           note2: k.overdue
             ? tt(`ในนั้นเลยกำหนดเสร็จแล้ว ${nf(k.overdue)} ใบ — ต้องเร่งติดตามทันที`,
                  `${nf(k.overdue)} of them are already past due`)

      <dd class="text-slate-600">${esc(desc)}</dd></div>`).join("");
}

/* เลือกดู KPI ของตำแหน่งไหน — สี่ตำแหน่งวัดกันคนละเรื่อง จึงเป็นคนละตารางไม่ใช่คนละแถว
   "— ภาพรวมแผนก —" คือค่าตั้งต้น เพราะคนเปิดหน้านี้ส่วนใหญ่มาดูตัวเลขของแผนกก่อน */
function paintRolePick(p) {
  const sel = $("#rolePick");
  if (!sel) return;
  const keep = sel.value;
  sel.innerHTML = `<option value="">— ภาพรวมแผนก —</option>` +
    Object.entries(ROLE_KPI).map(([key, d]) => `<option value="${key}">${esc(d.label)}</option>`).join("");
  sel.value = ROLE_KPI[keep] ? keep : "";

  if (!sel.value) { $("#rolePanel").hidden = true; return; }

  /* ตำแหน่งที่ใช้ข้อมูลเช็คชีตต้องโหลดก่อน — โหลดเสร็จค่อยวาดใหม่
     วาดด้วยของว่างไปก่อนหนึ่งรอบ ดีกว่าให้หน้าค้างรอ API */
  if (ROLE_KPI[sel.value].source === "check" && checkScoreKey !== `${p.year}-${p.month || "all"}`) {
    loadCheckScore(p).then(() => { if ($("#rolePick").value === sel.value) panelTech(p, sel.value); });
  }
  panelTech(p, sel.value);
}

/* เลือกดู KPI ทีละตัว — มีเฉพาะตอนเข้าทางเมนู "KPI" (หน้า Dashboard เต็มไม่ต้องมี)
   เลือกแล้วซ่อนการ์ดใบอื่นและเอารายละเอียดมาวางในหน้าเลย ไม่ต้องเปิดหน้าต่างซ้อน
   ซึ่งเป็นสิ่งที่ต่างจากการกดการ์ด: อันนั้นคือ "แวะดู" อันนี้คือ "มาดูตัวนี้โดยเฉพาะ" */
function paintKpiPick(k, p) {
  const bar = $("#kpiPickBar"), box = $("#kpiInline"), sel = $("#kpiPick");
  if (!bar) return;
  bar.hidden = !kpiOnly;
  if (!kpiOnly) {
    box.hidden = true;
    $("#rolePanel").hidden = true;
    $("#kpiCards").querySelectorAll("section").forEach((x) => (x.hidden = false));
    return;
  }
  paintRolePick(p);

  const keep = sel.value;
  sel.innerHTML = `<option value="">— ดูทุกตัว —</option>` +
    KPI_PICK.map(([key, label]) => `<option value="${key}">${esc(label)}</option>`).join("");
  sel.value = KPI_PICK.some(([key]) => key === keep) ? keep : "";

  const pick = sel.value;
  // ซ่อนการ์ดใบอื่น แต่ไม่ลบทิ้ง — กลับมา "ดูทุกตัว" ต้องไม่ต้องคำนวณใหม่
  $$("#kpiCards .kpi").forEach((c) => {
    c.hidden = !!pick && c.dataset.drill !== pick && c.dataset.jump !== pick;
  });
  $$("#kpiCards section").forEach((sec) => {
    sec.hidden = !!pick && !sec.querySelector(".kpi:not([hidden])");
  });

  if (!pick) { box.hidden = true; return; }
  const d = kpiDrill(pick, k, p, slaInput());
  if (!d) {                       // การ์ดนั้นยังคำนวณไม่ได้ (ยังไม่ได้กรอกข้อมูลที่ขาด)
    box.hidden = false;
    $("#kiTitle").textContent = KPI_PICK.find(([key]) => key === pick)[1];
    $("#kiFormula").textContent = tt("ยังคำนวณตัวนี้ไม่ได้ — ดูที่การ์ดด้านบนว่าขาดข้อมูลอะไร",
                                     "not computable yet — see the card above for what is missing");
    $("#kiHead").innerHTML = ""; $("#kiBody").innerHTML = "";
    return;
  }
  box.hidden = false;
  $("#kiTitle").textContent = tt(d.title, d.title);
  $("#kiFormula").textContent = d.formula;
  $("#kiHead").innerHTML = drillHead(d);
  $("#kiBody").innerHTML = drillBody(d);
}

/* ป้ายตัวเลขมาตรฐานของทุกกราฟ — กราฟไหนต้องการแบบอื่นให้ override ใน plugins ของตัวเอง

/* ป้ายเป็น % กลางชิ้น สำหรับกราฟวงกลม — ชิ้นเล็กกว่า 5% ไม่ติด ไม่งั้นเลขทับกันเละ */
/* จำนวนใบกลางชิ้น — ชิ้นที่เล็กกว่า 4% ไม่ติดเลข ไม่งั้นตัวเลขทับกันจนอ่านไม่ออก */
const COUNT_LABEL = {
  color: "#fff",
  font: { size: 11, weight: "800" },
  anchor: "center",
  align: "center",
  offset: 0,
  formatter: (v, ctx) => {
    if (!v) return "";
    const total = ctx.dataset.data.reduce((a, b) => a + (Number(b) || 0), 0);
    return total && v / total < 0.04 ? "" : nf(v);
  },
};

const PIE_LABEL = {
  color: "#fff",
  font: { size: 10, weight: "800" },
  anchor: "center",
  align: "center",
  offset: 0,
  formatter: (v, ctx) => {
    const total = ctx.dataset.data.reduce((a, b) => a + (Number(b) || 0), 0);
    if (!total || !v) return "";
    const pc = Math.round((v / total) * 100);
    return pc >= 5 ? pc + "%" : "";

};

/* ─────────── บันทึกกราฟเป็นรูป ───────────
   แคปหน้าจอเอาไปแปะสไลด์แล้วมักได้ภาพขาด ๆ เกิน ๆ ปุ่มนี้ได้เฉพาะตัวกราฟพอดีกรอบ
   ติดปุ่มให้อัตโนมัติทุกกราฟ ไม่ต้องไปเพิ่มใน HTML ทีละอัน */
function saveChartJpg(id, name) {
  const chart = charts[id];
  if (!chart) return;

  // วาดใหม่ที่ความละเอียด 3 เท่าก่อนแคป ไม่งั้นได้ภาพเล็ก เอาไปขยายบนสไลด์แล้วแตก
  const prevDpr = chart.options.devicePixelRatio;
  const prevAnim = chart.options.animation;
  let url;
  try {
    chart.options.devicePixelRatio = 3;
    chart.options.animation = false;        // ต้องปิด ไม่งั้นแคปได้เฟรมกลางทางของอนิเมชัน
    chart.resize();

    const src = chart.canvas;
    const out = document.createElement("canvas");
    out.width = src.width;
    out.height = src.height;
    const ctx = out.getContext("2d");
    // canvas ของ Chart.js พื้นหลังโปร่งใส เซฟเป็น JPG ตรง ๆ พื้นจะกลายเป็นดำ ต้องรองขาวก่อน
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, out.width, out.height);
    ctx.drawImage(src, 0, 0);
    url = out.toDataURL("image/jpeg", 0.95);
  } finally {
    chart.options.devicePixelRatio = prevDpr;
    chart.options.animation = prevAnim;
    chart.resize();                          // คืนขนาดเดิมให้หน้าจอเสมอ แม้แคปพลาด
  }

  const a = document.createElement("a");
  a.href = url;
  a.download = safeFileName(name || id) + "_" + ymd(new Date()) + ".jpg";
  a.click();
  toast("บันทึกรูปกราฟแล้ว — อยู่ในโฟลเดอร์ Downloads");
}

/** ตัดอักขระที่ Windows ห้ามใช้ในชื่อไฟล์ออก */
function safeFileName(t) {
  return String(t || "chart").trim().replace(/[\\/:*?"<>|]/g, "").slice(0, 60) || "chart";
}

/* ตารางไม่ใช่ canvas จึงต้องวาดเป็นรูปเอง
   ตั้งใจไม่ใช้ไลบรารีจับภาพ HTML เพราะ GAS มีปัญหากับสคริปต์ที่ฉีดเข้ามาทีหลัง (ดู README)
   ข้อดีอีกอย่างคือได้ทุกแถวรวมส่วนที่ต้องเลื่อนดู ซึ่งแคปหน้าจอไม่ได้ */
function saveTableJpg(table, title) {
  const trs = [...table.querySelectorAll("tr")].filter((tr) => tr.children.length);
  if (!trs.length) { toast("ตารางนี้ยังไม่มีข้อมูลให้บันทึก", false); return; }

  const SCALE = 3, PAD = 12, ROW_H = 28, HEAD_H = 40, FOOT_H = 22;
  const FONT = (w, sz) => `${w} ${sz}px Sarabun, system-ui, sans-serif`;

  const rows = trs.map((tr) => ({
    head: tr.parentElement.tagName === "THEAD",
    hi: /background/i.test(tr.getAttribute("style") || ""),
    cells: [...tr.children].map((c) => ({
      t: c.textContent.trim().replace(/\s+/g, " "),
      right: /\bnum\b/.test(c.className),
      span: Number(c.getAttribute("colspan")) || 1,
    })),
  }));

  // แถวที่ใช้ colspan (เช่น "ไม่มีข้อมูล") ไม่เอามาคิดความกว้างคอลัมน์
  const grid = rows.filter((r) => r.cells.every((c) => c.span === 1));
  const cols = Math.max(1, ...grid.map((r) => r.cells.length));

  const probe = document.createElement("canvas").getContext("2d");
  probe.font = FONT(700, 13);
  const colW = [];
  for (let i = 0; i < cols; i++) {
    let w = 0;
    grid.forEach((r) => { if (r.cells[i]) w = Math.max(w, probe.measureText(r.cells[i].t).width); });
    colW[i] = Math.ceil(w) + PAD * 2;
  }
  const W = colW.reduce((a, b) => a + b, 0);
  const H = HEAD_H + rows.length * ROW_H + FOOT_H;

  const cv = document.createElement("canvas");
  cv.width = W * SCALE;
  cv.height = H * SCALE;
  const g = cv.getContext("2d");
  g.scale(SCALE, SCALE);
  g.fillStyle = "#ffffff";
  g.fillRect(0, 0, W, H);
  g.textBaseline = "middle";

  g.fillStyle = "#05924a";
  g.font = FONT(700, 15);
  g.fillText(title || "ตาราง", PAD, HEAD_H / 2);

  let y = HEAD_H;
  rows.forEach((r) => {
    if (r.head)     { g.fillStyle = "#f1f5f9"; g.fillRect(0, y, W, ROW_H); }
    else if (r.hi)  { g.fillStyle = "#fefce8"; g.fillRect(0, y, W, ROW_H); }

    g.strokeStyle = "#e2e8f0";
    g.lineWidth = 1;
    g.beginPath();
    g.moveTo(0, y + ROW_H - 0.5);
    g.lineTo(W, y + ROW_H - 0.5);
    g.stroke();

    g.font = FONT(r.head || r.hi ? 700 : 400, 13);
    g.fillStyle = r.head ? "#475569" : "#0f172a";

    let x = 0;
    r.cells.forEach((c, i) => {
      let w = 0;
      for (let k = 0; k < c.span; k++) w += colW[i + k] || 0;
      if (!w) w = W - x;
      g.textAlign = c.right ? "right" : "left";
      g.fillText(c.t, c.right ? x + w - PAD : x + PAD, y + ROW_H / 2);
      x += w;
    });
    y += ROW_H;
  });

  g.textAlign = "left";
  g.font = FONT(400, 10);
  g.fillStyle = "#94a3b8";
  g.fillText("ระบบแจ้งซ่อมบำรุง YOUR COMPANY · " + fmtDT(new Date()), PAD, H - FOOT_H / 2);

  const a = document.createElement("a");
  a.href = cv.toDataURL("image/jpeg", 0.95);
  a.download = safeFileName(title) + "_" + ymd(new Date()) + ".jpg";
  a.click();
  toast("บันทึกรูปตารางแล้ว — อยู่ในโฟลเดอร์ Downloads");
}
