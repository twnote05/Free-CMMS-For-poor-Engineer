function drawChart(id, cfg) {
  const el = $("#" + id);
  if (!el || !window.Chart) return;
  if (!dataLabelsReady && window.ChartDataLabels) {
    Chart.register(window.ChartDataLabels);
    dataLabelsReady = true;
  }
  charts[id]?.destroy();
  const { plugins, ...restOpts } = cfg.options || {};
  charts[id] = new Chart(el, {
    ...cfg,
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 300 },
      interaction: { mode: "index", intersect: false },
      layout: { padding: { top: 20, right: 12 } },   // เผื่อที่ให้ป้ายตัวเลขไม่โดนตัด
      plugins: {
        legend: { labels: { boxWidth: 12, padding: 14 } },
        datalabels: DATA_LABEL,
        ...(plugins || {}),
      },
      ...restOpts,
    },
  });
  attachChartSave(id);
}

/* ═══════════ EXPORT EXCEL ═══════════
   ชื่อชีตและหัวคอลัมน์ตรงกับไฟล์ แจ้งซ่อม.xlsx เดิม เพื่อให้เปิดต่อ
   หรือวางทับ Sheet1 แล้วสูตร/Pivot ที่มีอยู่ยังทำงานได้                     */
const SHEET1_HEADERS = ["ลำดับ", "เวลาแจ้ง", "วันที่แจ้ง", "ฝ่าย", "ผู้แจ้ง", "ลักษณะงาน",
  "เครื่องจักร", "ระบุรายละเอียด", "สาเหตุ", "ระบุความต้องการ", "หมายเลขแจ้งซ่อม",
  "ค่าใช้จ่าย", "เลขที่ PR", "สถานะ", "ลำดับความสำคัญ", "กำหนดเสร็จ", "ผู้รับผิดชอบ",
  "เริ่มซ่อม", "เวลาซ่อมจบ", "ผู้เข้าซ่อม", "การซ่อม", "ใช้เวลา",
  "ผู้ตรวจรับงาน", "วันที่ตรวจรับ", "ผลการตรวจรับ", "สาเหตุที่ส่งกลับแก้ไข", "รูป",
  "ผู้รับซ่อมภายนอก", "กำหนดรับคืน"];   // ฝ่ายจัดซื้อขอดูว่าของอยู่ที่ร้านไหน ค้างมากี่วัน

/** วันที่แบบ Excel อ่านออก (ไม่ใช่ ISO string) */
const xlDate = (iso) => (iso ? new Date(iso) : "");

function sheet1Rows(list) {
  return list.map((t, i) => [
    i + 1,
    xlDate(t.created_at),
    xlDate(t.created_at),
    t.department || "",
    t.reporter || "",
    t.work_type || "",
    t.machine_name || "",
    t.description || "",
    t.cause || "",
    t.action_needed || "",
    t.ticket_id || "",
    Number(t.cost) || 0,
    t.pr_no || "",                          // เลขใบขอซื้อ ERP ไว้ให้บัญชีกระทบยอด
    legacyStatus(t.status),                 // "ซ่อมแล้ว"/"รอซ่อม" ให้สูตรเดิมนับได้
    t.priority || "",
    xlDate(t.due_at),
    t.assignee || "",
    xlDate(t.started_at),
    xlDate(t.completed_at),
    t.technician || "",
    t.repair_action || "",
    Number(t.repair_minutes) || "",         // นาที — %Breakdown ใช้ค่านี้
    t.verified_by || "",
    xlDate(t.verified_at),
    t.verification_status || "",
    t.rejection_note || "",
    t.has_image ? "มีรูปแนบ" : "",
    t.vendor || "",
    xlDate(t.expect_back),
  ]);
}

function exportExcel() {
  if (!isUnlocked()) { toast("ต้องเข้าสู่ระบบก่อนจึงจะส่งออกข้อมูลได้", false); return; }
  if (!window.XLSX) { toast("ยังโหลดไลบรารี Excel ไม่เสร็จ ลองใหม่อีกครั้ง", false); return; }
  const p = period();
  if (!p.list.length) { toast("ไม่มีข้อมูลในช่วงเวลาที่เลือก", false); return; }

  const sla = slaInput();
  const k   = kpiSummary(p.list, sla, p.pm);
  const aoa = (rows) => XLSX.utils.aoa_to_sheet(rows);
  const wb  = XLSX.utils.book_new();
  const add = (name, ws) => XLSX.utils.book_append_sheet(wb, ws, name.slice(0, 31));

  // 1) Sheet1 — ข้อมูลดิบ
  const s1 = aoa([SHEET1_HEADERS, ...sheet1Rows(p.list)]);
  s1["!cols"] = SHEET1_HEADERS.map((h) => ({ wch: ["ระบุรายละเอียด", "การซ่อม", "สาเหตุ"].includes(h) ? 38 : 16 }));

  // SheetJS ใส่รูปแบบ m/d/yy มาให้ — เปลี่ยนเป็นแบบไทย วัน/เดือน/ปี
  const DATE_FMT = { "เวลาแจ้ง": "dd/mm/yyyy hh:mm", "วันที่แจ้ง": "dd/mm/yyyy",
                     "กำหนดเสร็จ": "dd/mm/yyyy hh:mm", "เริ่มซ่อม": "dd/mm/yyyy hh:mm",
                     "เวลาซ่อมจบ": "dd/mm/yyyy hh:mm", "วันที่ตรวจรับ": "dd/mm/yyyy hh:mm",
                     "กำหนดรับคืน": "dd/mm/yyyy" };
  Object.entries(DATE_FMT).forEach(([header, fmt]) => {
    const c = SHEET1_HEADERS.indexOf(header);
    if (c === -1) return;
    for (let r = 1; r <= p.list.length; r++) {
      const cell = s1[XLSX.utils.encode_cell({ r, c })];
      if (cell && cell.t === "n") cell.z = fmt;
    }
  });
  s1["!autofilter"] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: p.list.length, c: SHEET1_HEADERS.length - 1 } }) };
  add("Sheet1", s1);

  // 2) จำนวนแจ้งซ่อม-ค่าใช้จ่ายรวม
  const cnt = Array(12).fill(0), cost = Array(12).fill(0);
  p.yearList.forEach((t) => {
    const d = new Date(t.created_at);
    if (isNaN(d)) return;
    cnt[d.getMonth()]++; cost[d.getMonth()] += Number(t.cost) || 0;
  });
  add("จำนวนแจ้งซ่อม-ค่าใช้จ่ายรวม", aoa([
    ["ประจำเดือน", "จำนวนเคสซ่อม", "ค่าใช้จ่ายรายเดือน"],
    ...MONTHS().map((m, i) => [`${m} ${yearLabel(p.year)}`, cnt[i], cost[i]]),
    ["ผลรวมทั้งหมด", cnt.reduce((a, b) => a + b, 0), cost.reduce((a, b) => a + b, 0)],
  ]));

  // 3) รายการซ่อมซ้ำ
  const rc = repeatByCount(p.list);
  add("รายการซ่อมซ้ำ", aoa([
    ["เครื่องจักร", "จำนวนครั้งที่แจ้ง", "สถานะ", "ความเสี่ยง"],
    ...rc.machines.map((m) => [m.machine, m.count, m.count >= 2 ? "🚨 ซ่อมซ้ำ" : "✅ ปกติ", riskLevel(m.count)[1]]),
  ]));

  // 4) Heatmap เครื่องจักร × เดือน
  const heat = heatData(p.yearList, "machine");
  add("Heatmap", aoa([
    ["เครื่องจักร", "ความเสี่ยง", ...MONTHS(), "รวม"],
    ...heat.rows.map((r) => {
      const sum = r.cells.reduce((a, b) => a + b, 0);
      return [r.label, riskLevel(sum)[1], ...r.cells, sum];
    }),
  ]));

  // 5) Machine Ranking (+ Pareto)
  const stats = machineStats(p.list, findRepeats(p.list, Number($("#repeatWindow").value) || 30))
                  .sort((a, b) => b.count - a.count);
  const tot = stats.reduce((a, b) => a + b.count, 0) || 1;
  let cum = 0;
  add("Machine Ranking", aoa([
    ["RANK", "เครื่องจักร", "จำนวนครั้ง", "ความเสี่ยง", "%", "Pareto Cumulative %", "สถานะ",
     "ค่าใช้จ่ายรวม", "Downtime (ชม.)", "MTTR (ชม.)"],
    ...stats.map((x, i) => {
      cum += x.count / tot;
      return [i + 1, x.machine, x.count, riskLevel(x.count)[1], x.count / tot, cum,
              cum <= 0.8 ? "🎯 Critical" : "", x.cost,
              Math.round(x.downtime * 10) / 10,
              x.mttr === null ? "" : Math.round(x.mttr * 10) / 10];
    }),
  ]));

  // 6) KPI
  const period_th = `${p.month ? MONTHS()[+p.month - 1] : "ทั้งปี"} ${yearLabel(p.year)}`;
  add("KPI", aoa([
    ["KPI งานซ่อม"], ["ช่วงข้อมูล", period_th], [],
    ["ตัวชี้วัด", "ค่า", "หมายเหตุ"],
    ["จำนวนรายการทั้งหมด", k.total, "นับเลขแจ้งซ่อมในช่วงที่เลือก"],
    ["ซ่อมแล้ว", k.done, "สถานะ “ซ่อมแล้ว”"],
    ["รอซ่อม", k.open, "ยังไม่ปิดงาน"],
    ["ค่าใช้จ่ายรวม", k.cost, "รวมค่าใช้จ่ายในช่วงที่เลือก"],
    ["ค่าใช้จ่ายเฉลี่ย/เคส", Math.round(k.costPerTicket), "ค่าใช้จ่ายรวม ÷ จำนวนรายการ"],
    ["% ซ่อมแล้ว", k.doneRate / 100, "ซ่อมแล้ว ÷ จำนวนรายการทั้งหมด"],
    ["% Breakdown", k.breakdownRate === null ? "" : k.breakdownRate / 100, "ชั่วโมงซ่อม ÷ ชั่วโมงทำงาน"],
    ["% ซ่อมซ้ำ", k.repeatRate / 100, "เคสที่ซ่อมซ้ำ ÷ ใบแจ้งซ่อมทั้งหมด (ตรงกับไฟล์ KPI Report) · เป้า ≤ 10%"],
    ["% ซ่อมซ้ำ (รายเครื่อง)", k.repeatMachineRate / 100, "เครื่องที่แจ้ง ≥ 2 ครั้ง ÷ เครื่องที่แจ้งทั้งหมด"],
    ["ใบแจ้งซ่อมคงค้าง", k.open, "ใบที่ยังไม่ปิด — เป้าตามไฟล์ KPI Report คือ 0 ใบ"],
    ["% การทำ PM", k.pmRate === null ? "" : k.pmRate / 100, "PM เสร็จ ÷ แผน PM"],
    [],
    ["— KPI เพิ่มเติมจากระบบใหม่ —"],
    ["% ปิดงานทันกำหนด (SLA รายใบ)", k.onTimeRate / 100, `${k.onTime} จาก ${k.done} ใบที่ปิดแล้ว`],
    ["MTTR (ชม.)", k.mttr === null ? "" : Math.round(k.mttr * 10) / 10, "เวลาเฉลี่ยที่ใช้ซ่อม"],
    ["% First-Time Fix", k.firstTimeFix / 100, "ผ่านตรวจรับครั้งแรก ไม่ถูกส่งกลับแก้ไข"],
    ["งานค้างเลยกำหนดเสร็จ (ใบ)", k.overdue, ""],
  ]));

  // 7) ผลงานช่างรายคน — บัตรคะแนนที่เอาไปคุยกับเจ้าตัวได้
  const ts = techScore(p.list, { sla, repeatWin: Number($("#repeatWindow")?.value) || 30 });
  add("ผลงานช่าง", aoa([
    ["ผลงานช่างรายคน"], ["ช่วงข้อมูล", period_th],
    ["หมายเหตุ", `ตัวที่ยังไม่มีข้อมูลเว้นว่าง ไม่ได้นับเป็น 0 · ปิดน้อยกว่า ${TECH_MIN_N} ใบ = ข้อมูลไม่พอ ไม่ให้คะแนน`],
    [],
    ["ช่าง", "คะแนนรวม", "ใบที่ปิด", "ชม. ลงมือ", "% First-Time Fix", "% ปิดทันกำหนด",
     "% วินัยการบันทึก", "% ซ่อมซ้ำ", "% PM ตามแผน", "งานค้าง", "Backlog (สัปดาห์)"],
    ...ts.map((r) => [
      r.name,
      r.total ? r.total.score : "",
      r.closed,
      Math.round(r.wrenchTotal * 10) / 10,
      r.ftfRate === null ? "" : r.ftfRate / 100,
      r.onTimeRate === null ? "" : r.onTimeRate / 100,
      r.logRate === null ? "" : r.logRate / 100,
      r.repeatRate === null ? "" : r.repeatRate / 100,
      r.pmRate === null ? "" : r.pmRate / 100,
      r.open,
      r.backlogWeeks === null ? "" : r.backlogWeeks,
    ]),
    [],
    ["น้ำหนักที่ใช้ (จากชีต \"ตั้งค่า\")"],
    ...Object.entries({ ...TECH_WEIGHT_DEFAULT, ...(CONFIG.techWeights || {}) })
      .map(([key, w]) => [key, w]),
  ]));

  const fname = `แจ้งซ่อม_${p.month ? p.year + "-" + p.month : p.year}_${new Date().toISOString().slice(0, 10)}.xlsx`;
  XLSX.writeFile(wb, fname);
  toast(`ส่งออก ${nf(p.list.length)} รายการ เป็นไฟล์ ${fname} แล้ว`);
}

/* ─────────── refresh ─────────── */
async function refresh() {
  if (!hasBackend()) { render(); toast("โหมดทดสอบในเครื่อง — ใช้ข้อมูลที่เก็บไว้ในเครื่อง"); return; }
  if (refreshing) return;                    // กดรัว ๆ ไม่ควรยิงซ้อนกัน
  refreshing = true;
  const ico = $("#refreshIco");
  ico?.classList.add("spin");
  try {
    const data = await gs("apiGetTickets", getToken(), {});
    tickets = data.tickets || [];
    save();
    buildYearPicker();
    render();
    setFlowChip(data.scope === "full" ? "● ข้อมูลครบ" : "● ข้อมูลสำหรับติดตามงาน", "flow-ok");
  } catch (err) {
    setFlowChip("✖ เชื่อมต่อไม่สำเร็จ", "flow-err");
    toast("ดึงข้อมูลไม่สำเร็จ: " + err.message, false);
  } finally {
    refreshing = false;
    ico?.classList.remove("spin");
  }
}

/* ═══════════ เช็คชีตประจำวัน ═══════════
   คำตอบมาจาก Google Form ที่เขียนลงชีต Daily Check ในไฟล์เดียวกัน
   หน้านี้แค่เทียบกับทะเบียนเครื่องจักรว่าวันนี้ตรวจครบหรือยัง            */
/* ═══ รายข้อของเครื่องที่เลือก ═══
   การ์ดบอกได้แค่ "ตรวจแล้ว/ผิดปกติ" ซึ่งยังทำอะไรต่อไม่ได้
   คนที่เห็นว่าเครื่องผิดปกติต้องรู้ว่าข้อไหน ถึงจะตัดสินใจได้ว่าควรเปิดใบแจ้งซ่อมไหม */
let checkOpen = null;

async function openCheckDetail(machine) {
  const box = $("#checkDetail");
  box.classList.remove("hidden");
  $("#cdTitle").textContent = machine;
  $("#cdWho").textContent = tt("กำลังโหลด...", "Loading...");
  $("#cdGroups").innerHTML = "";
  $("#cdAlert").classList.add("hidden");
  $("#cdTicketMsg").textContent = "";
  box.scrollIntoView({ block: "nearest" });

  let d;
  try { d = await gsAuth("apiCheckDetail", machine, $("#checkDate").value); }
  catch (err) { $("#cdWho").textContent = err.message; return; }
  checkOpen = d;

  if (!d.found) {
    $("#cdWho").textContent = tt("ยังไม่มีผลการตรวจของเครื่องนี้ในวันที่เลือก", "No check recorded");
    return;
  }

  $("#cdWho").textContent = [
    d.by || tt("ไม่ทราบผู้ตรวจ", "unknown inspector"),
    fmtDT(d.at),
    d.shift,
    d.status,
    d.rounds > 1 ? tt(`ตรวจ ${d.rounds} รอบในวันนี้ — แสดงรอบล่าสุด`, `${d.rounds} rounds today, showing the latest`) : "",
  ].filter(Boolean).join(" · ");

  const bad = d.badCount > 0;
  $("#cdAlert").classList.toggle("hidden", !bad);
  if (bad) {
    $("#cdAlertText").textContent = tt(
      `ไม่ผ่าน ${d.badCount} ข้อ — ${d.bad.slice(0, 3).join(" · ")}${d.bad.length > 3 ? ` และอีก ${d.bad.length - 3} ข้อ` : ""}`,
      `${d.badCount} items failed`);
    const pic = $("#cdPhoto");
    pic.classList.toggle("hidden", !d.photo);
    if (d.photo) pic.href = d.photo;
  }

  $("#cdGroups").innerHTML = d.groups.map((g) => `<section class="cd-grp">
      <h4 class="cd-grp-h">${esc(g.group)}</h4>
      <ul class="cd-list">${g.items.map((it) => `<li class="cd-item ${it.state}">
        <span class="cd-ico">${it.state === "bad" ? "✕" : it.state === "ok" ? "✓" : "•"}</span>
        <span class="grow">${esc(it.label)}</span>
        ${it.state === "note" ? `<b>${esc(it.value)}</b>` : ""}</li>`).join("")}</ul>
    </section>`).join("")
    || `<p class="empty">— ${tt("ไม่มีรายการตรวจ", "no items")} —</p>`;

  /* ISO: ต้องตามจากหน้าจอกลับไปหาแถวต้นทางได้ ชีตไหน แถวไหน */
  $("#cdIso").textContent = tt(
    `ข้อมูลจากฟอร์มเช็คชีตประจำวัน · ชีต "${d.sheet}" แถว ${d.row} · ตรวจ ${d.done} จาก ${d.total} ข้อ`,
    `From the daily check form · sheet "${d.sheet}" row ${d.row} · ${d.done} of ${d.total} items`);
}

async function ticketFromCheckDetail(btn) {
  if (!checkOpen) return;
  const msg = $("#cdTicketMsg");
  msg.className = "text-sm mt-2 text-red-600";
  const was = btn.textContent;
  btn.disabled = true;
  btn.textContent = tt("กำลังเปิดใบ...", "Creating...");
  try {
    const res = await gsAuth("apiCheckMakeTicket", checkOpen.machine, checkOpen.date, {});
    msg.className = "text-sm mt-2 text-green-700";
    msg.textContent = tt(`เปิดใบแจ้งซ่อม ${res.ticket_id} แล้ว`, `Ticket ${res.ticket_id} created`);
    await refresh();
  } catch (err) {
    msg.textContent = err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = was;
  }
}

let dailyCheck = null;

async function loadDailyCheck() {
  const date = $("#checkDate").value || new Date().toISOString().slice(0, 10);
  $("#checkGrid").innerHTML = `<p class="empty sm:col-span-2 lg:col-span-3">กำลังโหลด...</p>`;
  try {
    dailyCheck = await gsAuth("apiGetDailyCheck", date);
  } catch (err) {
    $("#checkGrid").innerHTML = `<p class="empty sm:col-span-2 lg:col-span-3">โหลดไม่สำเร็จ: ${esc(err.message)}</p>`;
    return;
  }
  renderDailyCheck();
}

function renderDailyCheck() {
  if (!dailyCheck) return;
  const d = dailyCheck;
  const missing = Math.max(0, (Number(d.total) || 0) - (Number(d.checked) || 0));

  const link = $("#checkFormLink");
  link.classList.toggle("hidden", !d.formUrl);
  if (d.formUrl) link.href = d.formUrl;

  /* ฟอร์มยังไม่ได้ถามว่าใครเป็นคนตรวจ — ต้องบอกไว้ ไม่ใช่ปล่อยช่อง "ผู้ตรวจ" ว่าง
     แล้วให้คนเข้าใจว่าช่างลืมกรอก ของเก่ากู้ไม่ได้ แต่ของใหม่ได้ทันทีที่เพิ่มคำถาม */
  const warn = $("#checkWarn");
  warn.classList.toggle("hidden", !d.noWho);
  if (d.noWho) warn.textContent = tt(
    "ฟอร์มยังไม่ได้ถามว่าใครเป็นคนตรวจ — ระบบจึงบอกได้ว่าเครื่องไหนตรวจแล้ว แต่บอกไม่ได้ว่าใครตรวจ " +
    "และยังคิด KPI ช่างเทคนิคจากข้อมูลชุดนี้ไม่ได้",
    "The form does not ask who performed the check, so per-technician KPI cannot be computed yet");

  $("#checkStats").innerHTML = [
    { ico: "🏭", bg: "#e0e7ff", fg: "#3730a3", label: "เครื่องจักรทั้งหมด", num: nf(d.total) },
    { ico: "✅", bg: "#dcfce7", fg: "#166534", label: "ตรวจแล้ว", num: nf(d.checked),
      sub: tt(`${pct(d.checked, d.total)}% ของทั้งหมด`, `${pct(d.checked, d.total)}% of all`) },
    { ico: "⏳", bg: "#fef9c3", fg: "#854d0e", label: "ยังไม่ตรวจ", num: nf(missing) },
    { ico: "⚠️", bg: "#fee2e2", fg: "#991b1b", label: "พบผิดปกติ", num: nf(d.abnormal),
      sub: d.abnormal ? "กดเปิดใบแจ้งซ่อมได้เลย" : "" },
  ].map(statCard).join("");

  // เรียงให้ที่ยังไม่ตรวจกับที่ผิดปกติขึ้นก่อน
  const order = [...d.machines].sort((a, b) =>
    (b.abnormal - a.abnormal) || (a.checked - b.checked) || a.name.localeCompare(b.name));

  const shown = mineOnlyBind("check", "#checkMineWrap", "#checkMineOnly", order,
    (m) => isMyMachine(m.name), renderDailyCheck);

  $("#checkGrid").innerHTML = shown.map((m) => {
    const tone = m.abnormal ? ["#fee2e2", "#991b1b", "⚠️ ผิดปกติ"]
               : m.checked  ? ["#dcfce7", "#166534", "✅ ตรวจแล้ว"]
               :              ["#f1f5f9", "#64748b", "⏳ ยังไม่ตรวจ"];
    return `<div class="panel p-3" style="border-left:4px solid ${tone[1]}">
      <div class="flex items-start justify-between gap-2">
        <div class="min-w-0">
          <p class="font-bold text-sm truncate">${esc(m.name)}</p>
          <p class="text-[11px] text-slate-400">${esc(m.code)}${m.location ? " · " + esc(m.location) : ""}</p>
        </div>
        <span class="badge" style="background:${tone[0]};color:${tone[1]}">${tone[2]}</span>
      </div>
      ${m.checked ? `<p class="text-xs text-slate-600 mt-2">
          ${m.by ? esc(m.by) + " · " : ""}${fmtDT(m.at)}${m.shift ? " · " + esc(m.shift) : ""}
          ${m.done ? ` · ${esc(tt(`ตรวจ ${m.done} ข้อ`, `${m.done} items`))}` : ""}
          ${m.badCount ? ` · <b style="color:#b91c1c">${esc(tt(`ไม่ผ่าน ${m.badCount} ข้อ`, `${m.badCount} failed`))}</b>` : ""}</p>` : ""}
      <div class="flex flex-wrap gap-2 mt-2">
        ${m.checked ? `<button class="chip" data-check-open="${esc(m.name)}">🔍 ดูรายข้อ</button>` : ""}
        <!-- ลิงก์ฟอร์มของตระกูลเครื่องนี้โดยเฉพาะ — ไม่มีลิงก์ก็ไม่ขึ้นปุ่ม
             ดีกว่าปุ่มที่พาไปฟอร์มของเครื่องอื่นแล้วช่างกรอกผิดใบ -->
        ${m.formUrl ? `<a class="chip" style="text-decoration:none" target="_blank" rel="noopener"
            href="${esc(m.formUrl)}">✏️ ${esc(m.checked ? tt("ตรวจรอบใหม่", "New round") : tt("ไปตรวจ", "Inspect"))}</a>` : ""}
      </div>
    </div>`;
  }).join("") || `<p class="empty sm:col-span-2 lg:col-span-3">— ยังไม่มีเครื่องจักรในทะเบียน —</p>`;

  const pill = $("#navCheck");
  pill.textContent = missing;
  pill.classList.toggle("zero", missing === 0);
}

/* ═══════════ QR ติดหน้าเครื่องจักร ═══════════ */
function buildQrFilter() {
  const sel = $("#qrFilter");
  if (!sel) return;
  const groups = [...new Set(MACHINES.map((m) => m.group).filter(Boolean))];
  sel.innerHTML = `<option value="">ทุกประเภท</option>` +
    groups.map((g) => `<option value="${esc(g)}">${esc(g)}</option>`).join("");
}

function renderQr() {
  const grid = $("#qrGrid");
  if (!grid || typeof QRCode === "undefined") return;
  const group = $("#qrFilter").value;
  const base = CONFIG.webAppUrl || location.href;

  // สร้าง QR 35 ใบใช้เวลาพอสมควร — ถ้าเงื่อนไขเดิมไม่ต้องวาดใหม่
  const sig = group + "|" + base + "|" + MACHINES.length;
  if (sig === qrSignature) return;
  qrSignature = sig;

  const list = MACHINES.filter((m) => !group || m.group === group);
  $("#qrCount").textContent = tt(`${list.length} เครื่อง`, `${list.length} machines`);
  grid.innerHTML = list.map((m, i) => `<div class="qr-card">
      <div class="qr-img" id="qr${i}"></div>
      <p class="qr-name">${esc(m.name)}</p>
      <p class="qr-code">${esc(m.code)}</p>
      <p class="qr-hint">สแกนเพื่อแจ้งซ่อมเครื่องนี้</p>
    </div>`).join("") || `<p class="empty col-span-full">— ยังไม่มีเครื่องจักรในทะเบียน —</p>`;

  list.forEach((m, i) => {
    const el = document.getElementById("qr" + i);
    if (!el) return;
    // ใช้รหัสเครื่องถ้ามี — สั้นกว่าชื่อไทย ทำให้ QR อ่านง่ายขึ้นมาก
    const key = m.code || m.name;
    new QRCode(el, {
      text: base + (base.indexOf("?") > -1 ? "&" : "?") + "machine=" + encodeURIComponent(key),
      width: 132, height: 132, correctLevel: QRCode.CorrectLevel.M,
    });
  });
}

/* ═══════════ แผน PM — ปฏิทินและการติดตาม ═══════════
   เดิม PM เป็นแท็บย่อยใน Dashboard ซึ่งเป็นตารางอ่านอย่างเดียวและหัวหน้าเท่านั้นที่เข้าได้
   แต่คนที่ต้องใช้จริงคือช่างที่ลงมือทำ และคนที่ต้องเห็นคือฝ่ายวางแผนการผลิต
   จึงยกออกมาเป็นเมนูของตัวเอง เพิ่มปฏิทิน เพิ่มการอัปเดตสถานะ และเพิ่มการเลื่อนแผน */

const PM_STATUS_META = {
  "วางแผนไว้": { bg: "#e0e7ff", fg: "#3730a3", dot: "#6366f1" },
  "กำลังทำ":   { bg: "#fef9c3", fg: "#854d0e", dot: "#f59e0b" },
  "เสร็จแล้ว":  { bg: "#dcfce7", fg: "#166534", dot: "#16a34a" },
  "เลื่อน":     { bg: "#f1f5f9", fg: "#64748b", dot: "#94a3b8" },
  "ยกเลิก":    { bg: "#f8fafc", fg: "#cbd5e1", dot: "#e2e8f0" },
};
const PM_LATE = { bg: "#fee2e2", fg: "#991b1b", dot: "#dc2626" };

let pmCal = { items: [], summary: {}, machines: [], statuses: [] };
let pmCursor = null;            // Date ที่ชี้เดือนที่กำลังดู
let pmOpenId = null;

/** เลยกำหนดแล้วต้องเห็นเป็นสีแดง ไม่ใช่สีเดียวกับที่ยังไม่ถึงกำหนด */
const pmLate = (x) => x.status === "วางแผนไว้" && x.planned < ymd(new Date());
const pmMeta = (x) => (pmLate(x) ? PM_LATE : PM_STATUS_META[x.status] || PM_STATUS_META["วางแผนไว้"]);

/* สีประจำประเภทงาน — ใช้เป็นป้ายเล็กในตารางเท่านั้น ไม่เอาไปแทนสีสถานะในปฏิทิน
   ปฏิทินตอบคำถาม "ทำหรือยัง" ซึ่งสำคัญกว่า "งานชนิดไหน" ย้อมสองอย่างพร้อมกันแล้วอ่านไม่ออกทั้งคู่ */
const PM_KIND_META = {
  "PM ตามรอบ":  { bg: "#e0e7ff", fg: "#3730a3" },
  "ปรับปรุง":   { bg: "#fef3c7", fg: "#92400e" },
  "ติดตั้งใหม่": { bg: "#dcfce7", fg: "#166534" },
  "งานอาคาร":   { bg: "#ffedd5", fg: "#9a3412" },
  "อื่นๆ":      { bg: "#f1f5f9", fg: "#475569" },
};
const pmKindMeta = (k) => PM_KIND_META[k] || PM_KIND_META["อื่นๆ"];

const pmVisible = () => {
  const f = $("#pmMachineFilter")?.value || "";
  const k = $("#pmKindFilter")?.value || "";
  return pmCal.items.filter((x) => (!f || x.machine === f) && (!k || (x.kind || "PM ตามรอบ") === k));
};

async function openPmTab() {
  if (!ME) return;
  if (!pmCursor) pmCursor = new Date();
  $("#pmPlanBtn").classList.toggle("hidden", !isLead());
  $("#pmBuildBtn").classList.toggle("hidden", !isLead());
  $("#pmReportBtn").classList.toggle("hidden", !isLead());
  fillPmMachines();
  await loadPmCalendar();
}

function fillPmMachines() {
  const sel = $("#ppMachine");
  if (!sel || sel.options.length > 1) return;
  const groups = {};
  MACHINES.forEach((m) => { (groups[m.group || "อื่นๆ"] ||= []).push(m); });
  sel.innerHTML = `<option value="">-- เลือกเครื่องจักร --</option>` +
    Object.entries(groups).map(([g, items]) =>
      `<optgroup label="${esc(g)}">` +
      items.map((m) => `<option>${esc(m.name)}</option>`).join("") + `</optgroup>`).join("");
}

async function loadPmCalendar() {
  const y = pmCursor.getFullYear(), m = pmCursor.getMonth() + 1;
  $("#pmMonthLabel").textContent = `${MONTHS()[m - 1]} ${yearLabel(y)}`;
  $("#pmCal").innerHTML = `<p class="empty" style="grid-column:1/-1">กำลังโหลด...</p>`;
  try {
    skelRows($("#pmListBody"), 8, 4);
    pmCal = await gsAuth("apiPmCalendar", y, m);
  } catch (err) {
    $("#pmCal").innerHTML = `<p class="empty" style="grid-column:1/-1">${esc(err.message)}</p>`;
    return;
  }

  const keep = $("#pmMachineFilter").value;
  $("#pmMachineFilter").innerHTML = `<option value="">ทุกเครื่องจักร</option>` +
    pmCal.machines.map((x) => `<option>${esc(x)}</option>`).join("");
  if (pmCal.machines.includes(keep)) $("#pmMachineFilter").value = keep;

  $("#pmItemStatus").innerHTML = pmCal.statuses
    .filter((x) => x !== "เลื่อน")            // เลื่อนต้องใช้ปุ่มเลื่อน เพื่อให้มีรายการชดเชยด้วย
    .map((x) => `<option>${esc(x)}</option>`).join("");

  /* รายการประเภทงานมาจาก server ที่เดียว (PM_KINDS) ทั้งตัวกรอง หน้าต่างรายการ และหน้าต่างแผน
     ถ้าเขียนแยกกันสามที่ วันหนึ่งจะเพิ่มประเภทใหม่แล้วลืมที่ใดที่หนึ่ง */
  const kinds = pmCal.kinds || [];
  const keepKind = $("#pmKindFilter").value;
  $("#pmKindFilter").innerHTML = `<option value="">ทุกประเภทงาน</option>` +
    kinds.map((x) => `<option>${esc(x)}</option>`).join("");
  if (kinds.includes(keepKind)) $("#pmKindFilter").value = keepKind;
  const kindOpts = kinds.map((x) => `<option>${esc(x)}</option>`).join("");
  $("#pmItemKind").innerHTML = kindOpts;
  $("#ppKind").innerHTML = kindOpts;

  renderPm();
}

function renderPm() {
  const items = pmVisible();
  const s = pmCal.summary || {};
  const late = items.filter(pmLate).length;

  $("#pmMonthSub").textContent = tt(`${nf(items.length)} รายการ`, `${nf(items.length)} items`);
  $("#pmStats").innerHTML = [
    { ico: "🗓️", bg: "#e0e7ff", fg: "#3730a3", label: "PM ในเดือนนี้", num: nf(items.length),
      sub: (() => { const n = nf(items.filter((x) => x.status === "วางแผนไว้").length);
        return tt(`${n} ยังไม่ได้ทำ`, `${n} not done yet`); })() },
    { ico: "✅", bg: "#dcfce7", fg: "#166534", label: "ทำเสร็จแล้ว",
      num: nf(items.filter((x) => x.status === "เสร็จแล้ว").length) },
    { ico: "🚨", bg: "#fee2e2", fg: "#991b1b", label: "เลยกำหนด", num: nf(late) },
    { ico: "⏱", bg: "#ede9fe", fg: "#5b21b6", label: "ชั่วโมงที่วางแผนไว้",
      num: nf(items.reduce((a, x) => a + (Number(x.hours) || 0), 0)),
      sub: tt("เทียบกับเวลาที่งานด่วนแย่งไป", "vs time taken by urgent work") },
    { ico: "🏖", bg: "#fef3c7", fg: "#92400e", label: "ตกวันหยุด",
      num: nf(items.filter((x) => x.status !== "เสร็จแล้ว" && dayOffKind(x.planned)).length),
      sub: tt("ควรเลื่อนก่อนถึงวัน", "reschedule before the date") },
    { ico: "🎯", bg: "#fef9c3", fg: "#854d0e", label: "PM Compliance",
      num: s.compliance === null || s.compliance === undefined ? "-" : s.compliance + "%",
      sub: tt(`เลื่อนไป ${nf(s.moved || 0)} ครั้ง`, `rescheduled ${nf(s.moved || 0)} times`) },
  ].map(statCard).join("");

  const pill = $("#navPmLate");
  if (pill) { pill.textContent = late; pill.classList.toggle("zero", late === 0); }

  renderPmCalendar(items);
  renderPmList(items);
  attachPmSaves();
}

/* ═══════════ วันหยุด ═══════════
   เสาร์–อาทิตย์รู้ได้เองจากปฏิทิน · นักขัตฤกษ์มาจากชีต "วันหยุด" ผ่าน apiPmCalendar
   บางโรงงานทำงานวันเสาร์ จึงเปิด/ปิดได้ที่ชีตตั้งค่า ไม่ได้ฟันธงให้

   ประโยชน์จริงไม่ได้อยู่ที่ปฏิทินสวยขึ้น แต่อยู่ที่ "แผน PM ที่ตกวันหยุด"
   เดิมออกตารางล่วงหน้า 12 เดือนแบบนับวันดิบ ๆ แล้ววันทำจริงไปตรงกับสงกรานต์
   ไม่มีใครรู้จนถึงวันนั้น แล้วก็กลายเป็นงานเลยกำหนดโดยไม่มีใครผิด */
const dayOffKind = (key) => {
  if (pmCal?.holidays?.[key]) return "holiday";
  const d = new Date(key + "T00:00:00");
  if (isNaN(d)) return "";
  const dow = d.getDay();
  if (dow === 0) return "weekend";
  if (dow === 6 && !pmCal?.workSaturday) return "weekend";
  return "";
};
const holidayName = (key) => pmCal?.holidays?.[key]?.name || "";
/** ข้อความเตือนใต้รายการ PM ที่ตกวันหยุด — ใช้ทั้งในปฏิทินและในตาราง */
const dayOffLabel = (key) => {
  const k = dayOffKind(key);
  if (!k) return "";
  return k === "holiday" ? holidayName(key) : tt("เสาร์–อาทิตย์", "weekend");
};

function renderPmCalendar(items) {
  const y = pmCursor.getFullYear(), m = pmCursor.getMonth();
  const first = new Date(y, m, 1);
  // สัปดาห์เริ่มวันอาทิตย์ให้ตรงกับปฏิทินไทยที่คนในโรงงานคุ้นเคย
  const start = new Date(y, m, 1 - first.getDay());
  const today = ymd(new Date());

  const byDay = {};
  items.forEach((x) => { (byDay[x.planned] ||= []).push(x); });

  const DOW = ["อา", "จ", "อ", "พ", "พฤ", "ศ", "ส"];
  let html = DOW.map((d) => `<div class="pm-dow">${d}</div>`).join("");

  for (let i = 0; i < 42; i++) {
    const d = new Date(start.getTime() + i * 864e5);
    const key = ymd(d);
    const out = d.getMonth() !== m;
    const list = byDay[key] || [];
    const off = dayOffKind(key);
    const hName = holidayName(key);
    // แสดง 3 รายการแรกพอ ช่องปฏิทินสูงเกินสองเท่าก็อ่านทั้งเดือนไม่ได้อยู่ดี
    const show = list.slice(0, 3);
    html += `<div class="pm-day${out ? " out" : ""}${off ? " " + off : ""}${key === today ? " today" : ""}">
      <div class="pm-daynum">${d.getDate()}${
        list.length && off ? `<span class="pm-warn" title="${esc(tt("มีแผน PM ตกวันหยุด", "PM planned on a day off"))}">⚠</span>` : ""}</div>
      ${hName ? `<div class="pm-holiname" title="${esc(hName)}">${esc(hName)}</div>` : ""}
      ${show.map((x) => {
        const mt = pmMeta(x);
        return `<button type="button" class="pm-ev" data-pm="${esc(x.id)}"
          style="background:${mt.bg};color:${mt.fg}"
          title="${esc(x.machine)} — ${esc(x.task)} (${esc(x.status)})">${esc(x.machine)}</button>`;
      }).join("")}
      ${list.length > 3 ? `<div class="pm-more">${tt(`+ อีก ${list.length - 3}`, `+ ${list.length - 3} more`)}</div>` : ""}
    </div>`;
  }
  $("#pmCal").innerHTML = html;

  $("#pmLegend").innerHTML = [
    ...Object.entries(PM_STATUS_META).map(([k, v]) =>
      `<span><i class="pm-dot" style="background:${v.dot}"></i>${esc(k)}</span>`),
    `<span><i class="pm-dot" style="background:${PM_LATE.dot}"></i>เลยกำหนด</span>`,
    `<span><i class="pm-dot pm-dot-off"></i>${esc(tt("เสาร์–อาทิตย์", "Weekend"))}</span>`,
    `<span><i class="pm-dot pm-dot-holi"></i>${esc(tt("วันหยุดนักขัตฤกษ์", "Public holiday"))}</span>`,
  ].join("");
}

function renderPmList(items) {
  $("#pmListBody").innerHTML = items.length ? items.map((x) => {
    const mt = pmMeta(x);
    return `<tr>
      <td class="td whitespace-nowrap" data-label="วันที่วางแผน">${esc(thDay(x.planned))}
        ${x.movedFrom ? `<span class="tag-repeat" style="background:#ffedd5;color:#9a3412">ชดเชย</span>` : ""}
        ${dayOffLabel(x.planned) ? `<span class="tag-repeat" style="background:#fee2e2;color:#991b1b"
          title="${esc(dayOffLabel(x.planned))}">หยุด</span>` : ""}</td>
      <td class="td" data-label="ประเภท">${(() => {
        const k = x.kind || "PM ตามรอบ", mk = pmKindMeta(k);
        return `<span class="badge" style="background:${mk.bg};color:${mk.fg}">${esc(k)}</span>`;
      })()}</td>
      <td class="td font-medium" data-label="เครื่องจักร">${esc(x.machine)}</td>
      <td class="td max-w-[16rem] truncate" data-label="งาน PM" title="${esc(x.task)}">${esc(x.task)}</td>
      <td class="td num text-slate-600" data-label="ชม.">${Number(x.hours) ? nf(x.hours) : "-"}</td>
      <td class="td text-slate-600 whitespace-nowrap" data-label="ผู้รับผิดชอบ">${esc(x.owner) || "-"}</td>
      <td class="td whitespace-nowrap" data-label="สถานะ"><span class="badge"
        style="background:${mt.bg};color:${mt.fg}">${esc(pmLate(x) ? "เลยกำหนด" : x.status)}</span></td>
      <td class="td whitespace-nowrap text-slate-600" data-label="วันที่ทำจริง">${x.actual ? esc(thDay(x.actual)) : "-"}</td>
      <td class="td text-slate-500 max-w-[12rem] truncate" data-label="หมายเหตุ"
          title="${esc(x.reason || x.note)}">${esc(x.reason || x.note) || "-"}</td>
      <td class="td no-print" data-label="จัดการ"><button type="button" class="chip" data-pm="${esc(x.id)}">จัดการ</button></td>
    </tr>`;
  }).join("")
    : `<tr><td colspan="10" class="empty">— ไม่มีรายการ PM ในเดือนนี้ ${
        isLead() ? 'กด "ออกตารางล่วงหน้า" เพื่อสร้างจากชีตแผน PM' : ""} —</td></tr>`;
}

/** วันที่แบบไทยสั้น ๆ สำหรับตาราง — 23 ก.ย. 69 */
function thDay(ymdStr) {
  const d = new Date(ymdStr + "T00:00:00");
  if (isNaN(d)) return ymdStr;
  return `${d.getDate()} ${MONTHS()[d.getMonth()]} ${String(yearLabel(d.getFullYear())).slice(2)}`;
}

/* ── หน้าต่างจัดการรายการ ── */
function openPmItem(id) {
  const x = pmCal.items.find((i) => i.id === id);
  if (!x) return;
  pmOpenId = id;
  $("#pmItemTitle").textContent = `${x.machine} — ${x.id}`;
  $("#pmItemInfo").innerHTML = `<b>${esc(x.task)}</b><br>
    วางแผนไว้ ${esc(thDay(x.planned))}
    ${x.movedFrom ? ` · ชดเชยจากวันที่ ${esc(thDay(x.movedFrom))}` : ""}
    ${x.reason ? `<br><span class="text-orange-700">เหตุผลที่เลื่อน: ${esc(x.reason)}</span>` : ""}`;
  $("#pmItemStatus").value = x.status === "เลื่อน" ? "วางแผนไว้" : x.status;
  $("#pmItemActual").value = x.actual || "";
  $("#pmItemOwner").value = x.owner || "";
  $("#pmItemNote").value = x.note || "";
  $("#pmItemKind").value = x.kind || "PM ตามรอบ";
  $("#pmItemHours").value = Number(x.hours) || "";
  $("#pmItemMsg").textContent = "";
  $("#pmFound").value = "";
  $("#pmFoundPri").innerHTML = PRIORITIES
    .map((x) => `<option${x.key === PRIORITY_DEFAULT ? " selected" : ""}>${esc(x.key)}</option>`).join("");
  // ใบเดิมยังผูกอยู่ ไม่ให้เปิดซ้ำ — server ปฏิเสธอยู่แล้ว แต่บอกตรงนี้จะได้ไม่ต้องกดไปเจอ error
  const x0 = pmCal.items.find((i) => i.id === id);
  $("#pmMakeTicket").disabled = !!x0?.ticketId;
  $("#pmMakeTicket").textContent = x0?.ticketId
    ? `🔧 เปิดใบ ${x0.ticketId} ไว้แล้ว` : "🔧 เปิดใบแจ้งซ่อมจากงานนี้";
  $("#pmMoveDate").value = "";
  $("#pmMoveReason").value = "";
  $("#pmItemModal").classList.remove("hidden");
}

const closePmItem = () => $("#pmItemModal").classList.add("hidden");

async function savePmItem() {
  const btn = $("#pmItemSave"), old = btn.textContent, msg = $("#pmItemMsg");
  msg.textContent = "";
  btn.disabled = true; btn.textContent = "กำลังบันทึก...";
  try {
    await gsAuth("apiPmUpdate", pmOpenId, {
      status: $("#pmItemStatus").value,
      actual: $("#pmItemActual").value,
      owner: $("#pmItemOwner").value.trim(),
      note: $("#pmItemNote").value.trim(),
      kind: $("#pmItemKind").value,
      hours: $("#pmItemHours").value,
    });
    closePmItem();
    await loadPmCalendar();
    toast("อัปเดตรายการ PM แล้ว");
  } catch (err) {
    msg.textContent = err.message;
  } finally {
    btn.disabled = false; btn.textContent = old;
  }
}

async function movePmItem() {
  const btn = $("#pmMoveBtn"), old = btn.textContent, msg = $("#pmItemMsg");
  msg.textContent = "";
  if (!$("#pmMoveDate").value) { msg.textContent = "ต้องเลือกวันที่ใหม่"; return; }
  if (!$("#pmMoveReason").value.trim()) { msg.textContent = "ต้องระบุเหตุผลที่เลื่อน"; return; }

  btn.disabled = true; btn.textContent = "กำลังเลื่อน...";
  try {
    const res = await gsAuth("apiPmReschedule", pmOpenId,
      $("#pmMoveDate").value, $("#pmMoveReason").value.trim());
    closePmItem();
    await loadPmCalendar();
    toast(`เลื่อนแผนแล้ว — ออกรายการชดเชย ${res.newId} ในวันที่เลือก`);
  } catch (err) {
    msg.textContent = err.message;
  } finally {
    btn.disabled = false; btn.textContent = old;
  }
}

/* ── สรุปงาน PM ส่งไลน์ ──
   หัวหน้าส่งสรุปให้ผู้จัดการทางไลน์ทุกสิ้นเดือนอยู่แล้ว การให้เขาไปนั่งพิมพ์เองจากตาราง
   คือจังหวะที่ตัวเลขจะเริ่มไม่ตรงกับระบบ

   จำกัดที่ 25 บรรทัด — ไลน์ตัดข้อความยาวแล้วต้องกด "อ่านเพิ่มเติม" ซึ่งไม่มีใครกด
   ที่เหลือบอกเป็นจำนวนแทน ใครอยากดูครบให้เปิดรายงาน PDF */
const PM_LINE_MAX = 25;

function pmLineText() {
  const items = pmVisible();
  const today = ymd(Date.now());
  const done = items.filter((x) => x.status === "เสร็จแล้ว");
  const active = items.filter((x) => x.status !== "ยกเลิก");
  const late = items.filter(pmLate);
  const moved = items.filter((x) => x.status === "เลื่อน");
  const hours = active.reduce((a, x) => a + (Number(x.hours) || 0), 0);
  const pct = active.length ? Math.round((done.length / active.length) * 100) : 0;

  const L = [`📋 สรุปงาน PM ${$("#pmMonthLabel").textContent}`];
  const kind = $("#pmKindFilter")?.value, mc = $("#pmMachineFilter")?.value;
  if (kind || mc) L.push(`(เฉพาะ ${[kind, mc].filter(Boolean).join(" · ")})`);
  L.push(`เสร็จแล้ว ${done.length}/${active.length} รายการ (${pct}%)`);
  if (late.length)  L.push(`🚨 เลยกำหนด ${late.length} รายการ`);
  if (moved.length) L.push(`🔁 เลื่อนแผน ${moved.length} ครั้ง`);
  if (hours)        L.push(`⏱ ชั่วโมงที่วางแผนไว้ ${nf(hours)} ชม.`);
  L.push("");

  const ico = (x) => x.status === "เสร็จแล้ว" ? "✅"
                   : x.status === "เลื่อน"   ? "🔁"
                   : pmLate(x)                ? "🚨"
                   : x.status === "กำลังทำ"  ? "🔧" : "⏳";
  items.slice(0, PM_LINE_MAX).forEach((x) => {
    L.push(`${ico(x)} ${thDay(x.planned)} ${x.machine} — ${x.task}` +
           (x.owner ? ` (${x.owner})` : "") +
           (x.ticketId ? ` [แจ้งซ่อม ${x.ticketId}]` : ""));
  });
  if (items.length > PM_LINE_MAX) L.push(`… และอีก ${items.length - PM_LINE_MAX} รายการ`);
  if (CONFIG.webAppUrl) { L.push(""); L.push(`เปิดระบบ: ${CONFIG.webAppUrl}`); }
  return L.join("\n");
}

/* ── ใบงาน PM (FM-MT-05) ──

function fillPmPlanForm(idx) {

/* ── บันทึกปฏิทินเป็น JPG ──
   ปฏิทินเป็น grid ของ div ไม่ใช่ตาราง saveTableJpg จึงใช้ไม่ได้ ต้องวาดเอง
   ทำเพราะรูปปฏิทินคือสิ่งที่เอาไปแปะคุยกับฝ่ายวางแผนการผลิตจริง ๆ
   แคปหน้าจอได้ไม่ครบเพราะปฏิทินกว้างกว่าจอเกือบตลอด */
function savePmCalendarJpg() {
  const items = pmVisible();
  const y = pmCursor.getFullYear(), m = pmCursor.getMonth();
  const start = new Date(y, m, 1 - new Date(y, m, 1).getDay());
  const byDay = {};
  items.forEach((x) => { (byDay[x.planned] ||= []).push(x); });

  const S = 2, CW = 168, HEAD = 64, DOW_H = 30, CH = 118, PAD = 8, FOOT = 26;
  const W = CW * 7, H = HEAD + DOW_H + CH * 6 + FOOT;

  const cv = document.createElement("canvas");
  cv.width = W * S; cv.height = H * S;
  const g = cv.getContext("2d");
  g.scale(S, S);
  g.fillStyle = "#fff"; g.fillRect(0, 0, W, H);
  g.textBaseline = "middle";

  g.fillStyle = "#05924a";
  g.font = "700 22px Sarabun, system-ui, sans-serif";
  g.fillText(`ปฏิทิน PM — ${MONTHS()[m]} ${yearLabel(y)}`, PAD, 26);
  g.fillStyle = "#64748b";
  g.font = "400 13px Sarabun, system-ui, sans-serif";
  const f = $("#pmMachineFilter").value;
  g.fillText(`${items.length} รายการ${f ? " · " + f : ""} · PM Compliance ${
    pmCal.summary.compliance == null ? "-" : pmCal.summary.compliance + "%"}`, PAD, 48);

  const DOW = ["อาทิตย์", "จันทร์", "อังคาร", "พุธ", "พฤหัส", "ศุกร์", "เสาร์"];
  g.font = "700 13px Sarabun, system-ui, sans-serif";
  g.textAlign = "center";
  DOW.forEach((d, i) => {
    g.fillStyle = "#f8fafc"; g.fillRect(i * CW, HEAD, CW, DOW_H);
    g.fillStyle = "#64748b"; g.fillText(d, i * CW + CW / 2, HEAD + DOW_H / 2);
  });
  g.textAlign = "left";

  for (let i = 0; i < 42; i++) {
    const d = new Date(start.getTime() + i * 864e5);
    const col = i % 7, rowN = Math.floor(i / 7);
    const x = col * CW, yTop = HEAD + DOW_H + rowN * CH;
    const out = d.getMonth() !== m;

    g.fillStyle = out ? "#f8fafc" : "#fff";
    g.fillRect(x, yTop, CW, CH);
    g.strokeStyle = "#e2e8f0"; g.lineWidth = 1;
    g.strokeRect(x + .5, yTop + .5, CW - 1, CH - 1);

    g.fillStyle = out ? "#cbd5e1" : "#0f172a";
    g.font = "700 14px Sarabun, system-ui, sans-serif";
    g.fillText(String(d.getDate()), x + PAD, yTop + 16);

    const list = byDay[ymd(d)] || [];
    g.font = "400 11px Sarabun, system-ui, sans-serif";
    list.slice(0, 4).forEach((it, k) => {
      const mt = pmMeta(it);
      const ty = yTop + 34 + k * 20;
      g.fillStyle = mt.bg;
      g.fillRect(x + 4, ty - 8, CW - 8, 17);
      g.fillStyle = mt.fg;
      let label = it.machine;
      while (g.measureText(label).width > CW - 18 && label.length > 3) label = label.slice(0, -2);
      g.fillText(label === it.machine ? label : label + "…", x + 8, ty);
    });
    if (list.length > 4) {
      g.fillStyle = "#94a3b8";
      g.fillText(`+ อีก ${list.length - 4}`, x + 8, yTop + 34 + 4 * 20);
    }
  }

  g.fillStyle = "#94a3b8";
  g.font = "400 11px Sarabun, system-ui, sans-serif";
  g.fillText("ระบบแจ้งซ่อมบำรุง YOUR COMPANY · " + fmtDT(new Date()), PAD, H - FOOT / 2);

  const a = document.createElement("a");
  a.href = cv.toDataURL("image/jpeg", 0.95);
  a.download = safeFileName(`ปฏิทิน PM ${MONTHS()[m]} ${yearLabel(y)}`) + ".jpg";
  a.click();
  toast("บันทึกรูปปฏิทินแล้ว — อยู่ในโฟลเดอร์ Downloads");
}

/* ═══════════ แนะนำ / ติชม ═══════════
   เก็บสองทาง เพราะคนสองกลุ่มพูดคนละจังหวะกัน
   1) คะแนนตอนกดตรวจรับงาน — ทุกใบที่ปิดผ่านจุดนี้อยู่แล้ว 100% จึงได้ตอบเยอะจริง
      ถ้าทำแค่เมนูติชมเดี่ยว ๆ แทบไม่มีใครเดินเข้ามาเขียนเอง
   2) หน้าแนะนำ/ติชม — สำหรับเรื่องที่ไม่ผูกกับใบไหน เช่น "อยากให้มีช่างประจำกะดึก"
      หน้านี้ไม่ต้องล็อกอิน เพราะคนที่อยากติมากที่สุดคือคนที่ไม่มีบัญชีในระบบ */

const FEEDBACK_TYPES = ["ชมเชย", "เสนอแนะ", "ติชม / ร้องเรียน"];
const STAR_TEXT = ["ยังไม่ให้คะแนน", "แย่มาก", "ต้องปรับปรุง", "พอใช้", "ดี", "ดีมาก"];

/* คะแนนเก็บไว้ที่ตัว DOM ของแถวดาวเอง ไม่ใช่ตัวแปรข้างนอก
   เพราะแถวดาวในหน้าต่างตรวจรับถูกสร้างใหม่ทุกครั้งที่เปิดใบ
   ถ้าเก็บไว้ข้างนอกจะลืมล้าง แล้วคะแนนของใบก่อนติดไปกับใบถัดไป */
function starValue(box) { return Number(box?.dataset.value) || 0; }

function paintStars(box) {
  const v = starValue(box);
  box.querySelectorAll(".star").forEach((b) => b.classList.toggle("on", Number(b.dataset.star) <= v));
  const txt = box.querySelector(".star-text");
  if (txt) txt.textContent = STAR_TEXT[v];
}

function initFeedback() {
  // มอบหมายให้ตัวแม่ที่ไม่ถูกสร้างใหม่ จะได้ครอบแถวดาวที่เพิ่งเรนเดอร์ด้วย
  document.addEventListener("click", (e) => {
    const b = e.target.closest(".star");
    if (!b) return;
    const box = b.closest("[data-stars]");
    const n = Number(b.dataset.star);
    box.dataset.value = starValue(box) === n ? 0 : n;   // กดดาวเดิมซ้ำ = ยกเลิก เผื่อกดพลาด
    paintStars(box);
  });

  $("#fbTypes").innerHTML = FEEDBACK_TYPES
    .map((t, i) => `<button type="button" class="chip${i === 1 ? " active" : ""}" data-type="${esc(t)}">${esc(t)}</button>`)
    .join("");
  $("#fbTypes").addEventListener("click", (e) => {
    const c = e.target.closest(".chip");
    if (c) $$("#fbTypes .chip").forEach((x) => x.classList.toggle("active", x === c));
  });

  $("#fbDept").innerHTML = `<option value="">-- เลือกแผนก --</option>` +
    DEPARTMENTS.map((d) => `<option>${esc(d)}</option>`).join("");

  $("#fbForm").addEventListener("submit", sendFeedback);
}

async function sendFeedback(e) {
  e.preventDefault();
  const btn = $("#fbSend"), msg = $("#fbMsg"), old = btn.textContent;
  msg.className = "text-sm text-red-600";

  const type = $("#fbTypes .chip.active")?.dataset.type || "";
  const subject = $("#fbSubject").value.trim();
  const dept = $("#fbDept").value;
  if (!subject) { msg.textContent = "กรุณากรอกหัวข้อเรื่อง"; return; }
  if (!dept)    { msg.textContent = "กรุณาเลือกแผนกของคุณ"; return; }

  const box = $("#fbStarWrap [data-stars]");
  btn.disabled = true; btn.textContent = "กำลังส่ง...";
  msg.textContent = "";
  try {
    await gs("apiSendFeedback", {
      type, subject, dept,
      by: $("#fbBy").value.trim(),
      detail: $("#fbDetail").value.trim(),
      rating: starValue(box),
    });
    $("#fbSubject").value = $("#fbDetail").value = $("#fbBy").value = "";
    box.dataset.value = 0;
    paintStars(box);
    feedbackRows = null;                       // หัวหน้าเปิด Dashboard ต่อต้องเห็นอันใหม่ด้วย
    msg.className = "text-sm text-green-700";
    msg.textContent = "ส่งเรียบร้อย ขอบคุณที่ช่วยบอกเรา — หัวหน้างานจะได้อ่านทุกข้อความ";
    toast("ส่งความคิดเห็นแล้ว ขอบคุณครับ");
  } catch (err) {
    msg.textContent = "ส่งไม่สำเร็จ: " + err.message;
  } finally {
    btn.disabled = false; btn.textContent = old;
  }
}

/* ═══════════ เลี้ยงเบียร์ช่าง ═══════════
   ระบบนี้เก็บแต่เรื่องที่ผิดพลาด — ของพัง เลยกำหนด ซ่อมซ้ำ ติชม
   ช่างที่ทำงานดีทั้งเดือนจึงไม่ปรากฏตัวที่ไหนเลย ปุ่มนี้เป็นทางเดียวในระบบที่ยื่นออกไปทางนั้น

   เก็บลงชีต "ความคิดเห็น" ใบเดิม ประเภท "เลี้ยงเบียร์ช่าง" ชื่อช่างอยู่ในช่องเรื่อง
   หัวหน้าเปิด Dashboard เห็นทั้งรายการและยอดสะสมรายคนโดยไม่ต้องทำหน้าจอใหม่ */
const BEER_TYPE = "เลี้ยงเบียร์ช่าง";
const BEER_TEAM = "ทั้งทีมซ่อมบำรุง";

function openBeer() {
  $("#beerNote").textContent = "";

     กล่องโอนเงินว่าง ๆ ที่ไม่มีอะไรให้สแกน แย่กว่าไม่มีกล่องเลย */
  const pp = CONFIG.beerPromptPay || "", qr = CONFIG.beerQr || "", btc = CONFIG.beerBtc || "";

/* QRCode ต่อท้าย element ทุกครั้งที่เรียก ไม่ได้แทนที่ของเดิม
   เปิดกล่องสิบรอบโดยไม่ล้างก่อน = QR สิบใบซ้อนกัน */
function drawQr(box, text) {
  if (!box || typeof QRCode === "undefined" || box.dataset.src === text) return;
  box.innerHTML = "";
  new QRCode(box, { text, width: 148, height: 148, correctLevel: QRCode.CorrectLevel.M });
  box.dataset.src = text;
}

const closeBeer = () => $("#beerModal").classList.add("hidden");

async function sendBeer() {

      detail: $("#beerMsg").value.trim(),
      by: $("#beerBy").value.trim(),
      dept: "", rating: 0,
    });
    feedbackRows = null;                    // หัวหน้าเปิด Dashboard ต่อต้องเห็นแก้วนี้ด้วย
    note.className = "text-sm text-green-700 min-h-[1.25rem]";

  } catch (err) {
    note.textContent = "ส่งไม่สำเร็จ: " + err.message;
  } finally {
    btn.disabled = false; btn.textContent = old;
  }
}

/* ── แผงสรุปใน Dashboard — หัวหน้างานเท่านั้น ── */
let feedbackRows = null;

async function panelFeedback() {
  const body = $("#fbBody");
  if (!feedbackRows) {
    skelRows(body, 6, 4);
    try { feedbackRows = await gsAuth("apiGetFeedback"); }
    catch (err) {
      body.innerHTML = `<tr><td colspan="6" class="empty">${esc(err.message)}</td></tr>`;
      return;
    }
  }

  const rated = feedbackRows.filter((x) => x.rating > 0);
  const avg = rated.length ? rated.reduce((a, x) => a + x.rating, 0) / rated.length : null;
  const count = (t) => feedbackRows.filter((x) => x.type === t).length;

  $("#fbStats").innerHTML = [
    { ico: "💬", bg: "#e0e7ff", fg: "#3730a3", label: "ความคิดเห็นทั้งหมด", num: nf(feedbackRows.length),
      sub: (() => { const n = nf(feedbackRows.filter((x) => x.ticketId).length);
        return tt(`${n} รายการมาจากการตรวจรับงาน`, `${n} from work acceptance`); })() },
    { ico: "⭐", bg: "#fef9c3", fg: "#854d0e", label: "คะแนนเฉลี่ย",
      num: avg === null ? "-" : avg.toFixed(2), sub: `จาก ${nf(rated.length)} คนที่ให้คะแนน` },
    { ico: "👍", bg: "#dcfce7", fg: "#166534", label: "ชมเชย", num: nf(count(FEEDBACK_TYPES[0])),
      sub: (() => { const n = nf(count(BEER_TYPE));
        return n === "0" ? "" : tt(`เลี้ยงเบียร์ช่างอีก ${n} แก้ว`, `${n} beers bought`); })() },
    { ico: "🛠️", bg: "#fee2e2", fg: "#991b1b", label: "ติชม / ร้องเรียน", num: nf(count(FEEDBACK_TYPES[2])),
      sub: (() => { const n = nf(count(FEEDBACK_TYPES[1]));
        return tt(`เสนอแนะอีก ${n} เรื่อง`, `${n} more suggestions`); })() },
  ].map(statCard).join("");

  /* ยอดเบียร์สะสมรายคน — จัดกลุ่มจากช่องเรื่อง ซึ่งเก็บชื่อช่างไว้ตรง ๆ ตอนส่ง */
  const beers = feedbackRows.filter((x) => x.type === BEER_TYPE);
  const tally = {};
  beers.forEach((x) => { tally[x.subject] = (tally[x.subject] || 0) + 1; });
  const top = Object.entries(tally).sort((a, b) => b[1] - a[1]);
  $("#fbBeer").innerHTML = top.length
    ? `🍺 ${esc(tt("เลี้ยงเบียร์สะสม", "Beers bought"))} — ` +
      top.map(([n, c]) => `<b>${esc(n)}</b> ${c}`).join(" · ")
    : "";

  const TYPE_COLOR = { "ชมเชย": "#166534", "เสนอแนะ": "#854d0e", "ติชม / ร้องเรียน": "#991b1b",
                       [BEER_TYPE]: "#b45309" };
  body.innerHTML = feedbackRows.length ? feedbackRows.map((x) => `<tr>
      <td class="td whitespace-nowrap text-slate-600">${fmtDT(x.at)}</td>
      <td class="td whitespace-nowrap font-semibold" style="color:${TYPE_COLOR[x.type] || "#64748b"}">${esc(x.type)}</td>
      <td class="td whitespace-nowrap" style="color:#f59e0b">${x.rating ? "★".repeat(x.rating) : "-"}</td>
      <td class="td font-medium">${esc(x.subject)}
        ${x.ticketId ? `<span class="tag-repeat" style="background:#e0e7ff;color:#3730a3">${esc(x.ticketId)}</span>` : ""}</td>
      <td class="td text-slate-600 max-w-[20rem]">${esc(x.detail) || "-"}</td>
      <td class="td whitespace-nowrap text-slate-500">${esc(x.by) || "ไม่ลงชื่อ"}${
        x.dept ? `<br><span class="text-[11px]">${esc(x.dept)}</span>` : ""}</td>
    </tr>`).join("")
    : `<tr><td colspan="6" class="empty">— ยังไม่มีความคิดเห็นเข้ามา —</td></tr>`;
}

/* ═══════════ สถานะพารามิเตอร์รายเครื่อง ═══════════
   ตารางค่ากับกราฟแนวโน้มตอบได้ว่า "เคยเกิดอะไร" และ "แนวโน้มไปทางไหน"
   แต่ไม่มีอันไหนตอบคำถามที่ช่างถามตอนเดินเข้ามาว่า "ตอนนี้ต้องไปดูเครื่องไหน"
   หน้านี้ตอบข้อนั้นข้อเดียว ที่เหลือคลิกเข้าไปดูต่อได้

   ช่างเปิดบนมือถือในโรงงานที่แสงจ้า การ์ดจึงใหญ่ มีแถบสีข้าง และตัวเลขเด่น
   ไม่ใช่ตารางเล็ก ๆ ที่ต้องเอานิ้วจิ้มให้ตรงบรรทัด */

const PARAM_STATE = {
  bad:  { cls: "bad",  ico: "🚨", text: "ค่าหลุดมาตรฐาน" },
  stop: { cls: "stop", ico: "⏸", text: "หยุดเครื่อง" },
  none: { cls: "none", ico: "—", text: "ยังไม่มีข้อมูล" },
  ok:   { cls: "ok",   ico: "✓", text: "ปกติ" },
};

let paramStat = null;        // ผลจาก apiParamStatus
let paramOpen = null;        // เครื่องที่กำลังเปิดดูรายละเอียด

async function loadParamStatus(force) {
  const box = $("#paramCards");
  if (paramStat && !force) return paramStat;
  box.innerHTML = `<p class="empty col-span-full">กำลังโหลด...</p>`;
  try {
    paramStat = await gsAuth("apiParamStatus");
  } catch (err) {
    box.innerHTML = `<p class="empty col-span-full">${esc(err.message)}</p>`;
    return null;
  }
  renderParamCards();
  return paramStat;
}

function renderParamCards() {
  const p = paramStat;
  if (!p) return;

  $("#paramRound").textContent = p.asOf
    ? tt(`รอบบันทึกล่าสุด ${p.round} น. · ${thDay(p.asOf)} · เฝ้าอยู่ ${p.machines.length} เครื่อง`,
         `Latest round ${p.round} · ${p.asOf} · ${p.machines.length} machines`)
    : tt("ยังไม่มีการบันทึกค่าเข้ามา", "No readings recorded yet");

  const link = $("#paramFormLink");
  link.classList.toggle("hidden", !p.formUrl);
  if (p.formUrl) link.href = p.formUrl;

  /* แถบบนสุดบอกเฉพาะเครื่องที่ต้องจัดการ ไม่ใช่สรุปทุกอย่าง
     ถ้าไม่มีอะไรต้องทำก็ไม่ต้องขึ้นแถบ — แถบที่ขึ้นทุกวันคือแถบที่ไม่มีใครอ่าน */
  const bad = p.machines.filter((m) => m.state === "bad");
  const late = p.machines.filter((m) => m.stale && m.state !== "none");
  const parts = [];
  /* ยังไม่ผูกพิกัดมาตรฐาน = ทุกเครื่องขึ้นเขียวเพราะไม่มีอะไรให้เทียบ ไม่ใช่เพราะค่าปกติ
     ต้องบอกไว้บนสุด ไม่งั้นคนเข้าใจว่าระบบตรวจให้แล้วและเลิกดูค่าเอง */
  if (p.noLimits) parts.push(tt(
    `ยังไม่ได้ผูกพิกัดมาตรฐาน — ดูค่าที่บันทึกได้ แต่ระบบยังไม่ตัดสินว่าหลุดสเปกหรือไม่`,
    `No spec limits bound yet — readings are visible but nothing is being checked`));
  if (bad.length)  parts.push(tt(`${bad.length} เครื่องมีค่าหลุดมาตรฐาน (${bad.map((m) => m.id).join(", ")})`,
                                 `${bad.length} out of spec (${bad.map((m) => m.id).join(", ")})`));
  if (late.length) parts.push(tt(`${late.length} เครื่องยังไม่บันทึกรอบ ${p.round} น. (${late.map((m) => m.id).join(", ")})`,
                                 `${late.length} missing round ${p.round} (${late.map((m) => m.id).join(", ")})`));
  const al = $("#paramAlert");
  al.classList.toggle("hidden", !parts.length);
  al.innerHTML = parts.length
    ? `<b>${esc(tt("ต้องดำเนินการ", "Needs attention"))}:</b> ${esc(parts.join(" · "))}` : "";

  /* เครื่องของสถานีตัวเองขึ้นก่อน — ช่าง Ext เปิดมาต้องเจอ Extrusion ทันที
     ไม่ซ่อนเครื่องอื่น เพราะวันที่ต้องตรวจแทนเพื่อนมีจริง และคนที่ไม่ได้ระบุสถานี
     (หัวหน้า/วิศวกร) ต้องเห็นครบเหมือนเดิม ไม่ใช่เห็นหน้าว่าง */
  const mineFirst = [...p.machines].sort((a, b) => {
    const am = isMyMachine(a.cmms || a.name) || isMyMachine(a.id);
    const bm = isMyMachine(b.cmms || b.name) || isMyMachine(b.id);
    return (bm ? 1 : 0) - (am ? 1 : 0);
  });

  const st0 = myStation();
  const mineCount = mineFirst.filter((m) => isMyMachine(m.cmms || m.name) || isMyMachine(m.id)).length;
  const sb = $("#paramStation");
  if (sb) {
    sb.hidden = !st0;
    sb.textContent = st0
      ? tt(`คุณประจำ ${st0} — เครื่องที่รับผิดชอบ ${mineCount} เครื่อง ขึ้นก่อน`,
           `You cover ${st0} — your ${mineCount} machines are listed first`)
      : "";
  }

  const shown = mineOnlyBind("param", "#paramMineWrap", "#paramMineOnly", mineFirst,
    (m) => isMyMachine(m.cmms || m.name) || isMyMachine(m.id), renderParamCards);

  $("#paramCards").innerHTML = shown.map((m) => {
    const isMine = isMyMachine(m.cmms || m.name) || isMyMachine(m.id);
    const st = PARAM_STATE[m.state] || PARAM_STATE.none;
    const pill = m.state === "bad"
      ? `<span class="param-pill bad">${m.alerts.length} ${esc(tt("ค่าหลุดมาตรฐาน", "out of spec"))}</span>`
      : `<span class="param-pill ${st.cls}">${esc(tt(st.text, st.text))}</span>`;
    return `<button type="button" class="param-card ${st.cls}${isMine ? " param-mine" : ""}"
        data-param-id="${esc(m.id)}">
      <div class="param-id">${esc(m.id)}${isMine
        ? ` <span class="param-mine-tag">${esc(tt("ของคุณ", "yours"))}</span>` : ""}</div>
      <!-- บรรทัดล่างเคยโชว์ชื่อเครื่องซ้ำกับบรรทัดบน ซึ่งไม่ได้บอกอะไรเพิ่ม
           เปลี่ยนเป็นรหัสเครื่องจักรจากฟอร์ม ISO · ไม่มีรหัสค่อยถอยไปใช้ชื่อ -->
      <div class="param-name">${esc(m.code || (m.name === m.id ? "" : m.name))}</div>
      ${pill}
      <div class="param-meta">
        ${m.operator ? `<div>${esc(tt("ผู้บันทึก", "Recorded by"))}: <b>${esc(m.operator)}</b></div>` : ""}
        ${m.date ? `<div>${esc(tt("ล่าสุด", "Latest"))}: <b>${esc(thDay(m.date))}</b> ${esc(tt(`รอบ ${m.round} น.`, `round ${m.round}`))}</div>` : ""}
        <div>${esc(tt(`เฝ้า ${m.watched} จาก ${m.total} พารามิเตอร์`, `${m.watched} of ${m.total} watched`))}</div>
        ${m.cmms ? "" : `<div class="param-warn">${esc(tt("ยังไม่ได้ผูกกับทะเบียนเครื่องจักร", "Not linked to the machine registry"))}</div>`}
      </div>
    </button>`;
  }).join("") || `<p class="empty col-span-full">— ยังไม่มีเครื่องในระบบพารามิเตอร์ —</p>`;
}

function showParamHome() {
  paramOpen = null;
  $("#paramHome").classList.remove("hidden");
  $("#paramDetail").classList.add("hidden");
  $("#paramTrendPanel").classList.add("hidden");
}

/* ═══ การรับรองของวิศวกร ═══
   "ค่าอยู่ในพิกัดไหม" เครื่องตอบได้เอง แต่ "มีคนไปดูของจริงแล้วหรือยัง" เครื่องตอบแทนไม่ได้
   สองอย่างนี้จึงแยกกันบนหน้าจอ ไม่เอาไปรวมเป็นไฟเขียวดวงเดียวที่แปลได้สองแบบ */
function paintApprove(d) {
  const box = $("#pdOk");
  if (!box) return;
  const has = !!d.date;                       // ยังไม่เคยมีรอบบันทึก ก็ยังไม่มีอะไรให้รับรอง
  box.classList.toggle("hidden", !has);
  $("#pdOkMsg").textContent = "";
  if (!has) return;

  const a = d.approval;
  const back = a && a.result !== "รับรองแล้ว";
  box.classList.toggle("ok", !!a && !back);
  box.classList.toggle("back", !!back);

  $("#pdOkState").textContent = !a
    ? tt("รอวิศวกรรับรอง", "Awaiting engineer sign-off")
    : back ? tt(`ตีกลับให้ลงใหม่${a.note ? " — " + a.note : ""}`, `Sent back${a.note ? " — " + a.note : ""}`)
    : tt(`รับรองแล้ว${a.note ? " — " + a.note : ""}`, `Signed off${a.note ? " — " + a.note : ""}`);

  $("#pdOkWho").textContent = a
    ? tt(`ผู้รับรอง ${a.by} · ${a.at}`, `Signed by ${a.by} · ${a.at}`)
    : tt(`รอบ ${thDay(d.date)} ${d.round} น. บันทึกโดย ${d.operator || "ไม่ระบุ"}`,
         `${d.date} round ${d.round}, recorded by ${d.operator || "unknown"}`);

  /* ซ่อนปุ่มเมื่อคนดูเป็นคนลงค่าเอง — เซ็นรับรองงานตัวเองไม่ได้แปลว่ามีใครมาตรวจ
     (เซิร์ฟเวอร์ปฏิเสธซ้ำอยู่แล้ว ปุ่มที่ซ่อนไม่ใช่การกันสิทธิ์) */
  const may = d.canApprove && !d.approveSelf;
  $("#pdOkBtns").classList.toggle("hidden", !may);
  $("#pdOkMe").textContent = ME?.name || tt("(ยังไม่ได้ล็อกอิน)", "(not signed in)");
  if (d.canApprove && d.approveSelf) {
    $("#pdOkMsg").className = "text-sm w-full text-slate-400";
    $("#pdOkMsg").textContent = tt("รอบนี้คุณเป็นคนลงเอง ให้คนอื่นเป็นผู้รับรอง",
                                   "You recorded this round; someone else must sign it off");
  }
}

async function pdApprove(btn, result) {
  if (!paramOpen) return;
  const msg = $("#pdOkMsg");
  msg.className = "text-sm w-full text-red-600";
  const was = btn.textContent;
  btn.disabled = true;
  btn.textContent = tt("กำลังบันทึก...", "Saving...");
  try {
    const d = await gsAuth("apiParamApprove", paramOpen.id, {
      date: paramOpen.date, round: paramOpen.round,
      result, note: $("#pdOkNote").value,
    });
    paramOpen = d;
    $("#pdOkNote").value = "";
    paintParamDetail(d);
    toast(result === "รับรองแล้ว" ? tt("รับรองแล้ว", "Signed off")
                                  : tt("ตีกลับแล้ว", "Sent back"));
  } catch (err) {
    msg.textContent = err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = was;
  }
}

function paintParamDetail(d) {
  $("#pdTitle").textContent = `${d.id} — ${d.name}`;
  $("#pdWho").textContent = d.date
    ? tt(`บันทึกโดย ${d.operator || "ไม่ระบุ"} · ${thDay(d.date)} รอบ ${d.round} น. · ${d.status}`,
         `Recorded by ${d.operator || "unknown"} · ${d.date} round ${d.round} · ${d.status}`)
    : tt("ยังไม่เคยมีการบันทึกค่าของเครื่องนี้", "No readings for this machine yet");

  const bad = [];
  d.groups.forEach((g) => g.fields.forEach((f) => { if (f.result === "หลุด") bad.push(f); }));

  /* ปุ่มเปิดใบแจ้งซ่อมโผล่เฉพาะตอนมีค่าหลุดจริงและเครื่องไม่ได้ถูกบันทึกว่าหยุด
     เครื่องที่ดับอยู่อ่านค่าได้ 0 ทุกช่อง ซึ่งหลุดมาตรฐานทุกตัวตามสูตรแต่ไม่มีอะไรเสีย */
  const show = bad.length > 0 && d.state === "bad";
  $("#pdAlert").classList.toggle("hidden", !show);
  if (show) {
    $("#pdAlertText").textContent = tt(
      `พบค่าหลุดมาตรฐาน ${bad.length} ค่า — ` +
        bad.slice(0, 3).map((f) => `${f.label} ${f.value} (มาตรฐาน ${f.std} ±${f.tol})`).join(" · ") +
        (bad.length > 3 ? ` และอีก ${bad.length - 3} ค่า` : ""),
      `${bad.length} values out of spec`);
    $("#pdTicket").disabled = !d.cmms;
    $("#pdTicketMsg").textContent = d.cmms ? "" :
      tt(`เครื่องนี้ยังไม่ได้ผูกกับทะเบียน — ใส่ "${d.id}" ในช่อง "ชื่อเดิมที่เคยใช้" ของเครื่องนั้นในชีตทะเบียนเครื่องจักร`,
         `Not linked to the registry yet — add "${d.id}" as an alias in the machine registry sheet`);
  }

  /* ISO: ทุกหน้าจอต้องอ้างรหัสแบบฟอร์มจากชีท และบอกว่าข้อมูลแก้ย้อนหลังไม่ได้ */
  $("#pdIso").textContent = [
    d.form ? tt(`อ้างอิงแบบฟอร์ม ${d.form}`, `Form ${d.form}`) : "",
    d.code ? tt(`รหัสเครื่องจักร ${d.code}`, `Machine code ${d.code}`) : "",
    tt("บันทึกนี้แก้ไขไม่ได้ ทุกครั้งที่บันทึกจะเก็บผู้บันทึกและเวลาไว้ถาวร",
       "Records are append-only; each keeps its author and timestamp"),
    d.remark ? tt(`หมายเหตุ: ${d.remark}`, `Note: ${d.remark}`) : "",
  ].filter(Boolean).join(" · ");

  paintScada();

  /* ลิงก์ฟอร์มของเครื่องนี้ — ไม่มีลิงก์ตั้งไว้ก็ซ่อนปุ่ม ดีกว่าปุ่มที่กดแล้วไปหน้า 404 */
  const fl = $("#pdFormLink");
  fl.classList.toggle("hidden", !d.formUrl);
  if (d.formUrl) fl.href = d.formUrl;

  paintApprove(d);

  $("#pdHist").innerHTML = d.history.length ? d.history.map((h) => `<tr>
      <td class="td whitespace-nowrap">${esc(thDay(h.date))}</td>
      <td class="td whitespace-nowrap">${esc(h.round)} ${esc(tt("น.", ""))}</td>
      <td class="td">${esc(h.operator) || "—"}</td>
      <td class="td">${esc(h.status) || "—"}</td>
      <td class="td">${h.bad
        ? `<span class="param-pill bad">${esc(tt(`หลุด ${h.bad} ค่า`, `${h.bad} out of spec`))}</span>`
        : `<span class="param-pill ok">${esc(tt("ผ่าน", "Pass"))}</span>`}</td>
      <td class="td text-[11px]">${h.okResult
        ? `<span class="param-pill ${h.okResult === "รับรองแล้ว" ? "ok" : "bad"}">${
            esc(h.okResult)}</span> <span class="text-slate-400">${esc(h.okBy)}</span>`
        : `<span class="text-slate-400">${esc(tt("รอรับรอง", "awaiting sign-off"))}</span>`}</td>
    </tr>`).join("")
    : `<tr><td colspan="6" class="empty">— ยังไม่มีประวัติ —</td></tr>`;
}

/* ═══ หน้าจอแบบ SCADA ═══
   ตารางเรียงยาวอ่านได้แต่หาจุดไม่เจอ — ช่างที่ยืนอยู่หน้าเครื่องต้องกวาดตาเจอตัวแดงใน 1 วินาที
   จึงวางเป็นการ์ดต่อจุดวัด แล้วจัดกลุ่มตามหัวข้อในฟอร์ม ISO ให้ลำดับตรงกับกระดาษที่เขาถืออยู่ */
/** วาดกริดการ์ด — เรียกซ้ำได้ทุกครั้งที่สลับโหมดดู/โหมดลงบันทึก */
function paintScada() {
  const p = paramOpen;
  if (!p) return;
  const pdTile = (f) => {
    const onoff = f.type === "onoff";
    const dead = f.type === "na";
    const auto = f.type === "auto";
    const out = f.result === "หลุด";
    const cls = dead ? "na" : auto ? "auto" : !f.linked ? "gap"
              : out ? "bad" : f.result === "ผ่าน" ? "ok"
              : onoff ? (String(f.value).toLowerCase() === "off" ? "off" : f.value === "" ? "none" : "on")
              : "none";

    const big = dead ? tt("ไม่ได้ใช้", "unused")
              : auto ? tt("อัตโนมัติ", "auto")
              : !f.linked ? "—"
              : f.value === "" ? "—"
              : esc(f.value) + (f.unit && !onoff ? `<span class="pd-u">${esc(f.unit)}</span>` : "");

    const spec = f.std !== "" && f.tol !== "" ? `${f.std} ±${f.tol}`
               : f.std !== "" ? `${tt("อ้างอิง", "ref")} ${f.std}`
               : !f.linked ? tt("ยังไม่มีค่านี้ในข้อมูล", "no reading yet")
               : auto || dead ? "" : tt("ไม่มีพิกัด", "no limit");

    return `<div class="pd-tile ${cls}" title="${esc(f.note || "")}">
      <div class="pd-lb">${esc(f.label) || `<i>${tt("ไม่มีชื่อในฟอร์ม", "unnamed")}</i>`
        }${f.note ? ' <span class="pd-q">?</span>' : ""}</div>
      <div class="pd-val">${big}</div>
      <div class="pd-spec">${esc(spec)}${
        out ? ` <b>${tt("เกิน", "off")} ${Math.abs(f.diff).toFixed(1)}</b>` : ""}</div>
    </div>`;
  };

  $("#pdScada").innerHTML = p.groups.map((g) => `<section class="pd-grp">
      <h4 class="pd-grp-h">${esc(g.group)}</h4>
      <div class="pd-row">${g.fields.map(pdTile).join("")}</div>
    </section>`).join("")
    || `<p class="empty">— ${tt("ยังไม่มีค่า", "no readings")} —</p>`;

  const nField = p.groups.reduce((a, g) => a + g.fields.length, 0);
  const nGap = p.groups.reduce((a, g) => a + g.fields.filter((f) => !f.linked).length, 0);
  const nWatch = p.groups.reduce((a, g) =>
    a + g.fields.filter((f) => f.std !== "" && f.tol !== "").length, 0);
  $("#pdLegend").textContent =
    tt(`${nField} จุด · เทียบพิกัดได้ ${nWatch} จุด`, `${nField} points · ${nWatch} checked`);
  /* ช่องที่อยู่ในฟอร์มแต่ไม่มีคอลัมน์ในชีตบันทึก = ของที่ ISO สั่งให้ตรวจแต่ยังไม่มีใครเก็บ
     เงียบไว้ไม่ได้ ไม่งั้นหน้าจอดูครบทั้งที่ข้อมูลขาด */
  $("#pdGap").textContent = nGap
    ? tt(`${nGap} จุดในฟอร์มยังไม่เคยมีค่าในข้อมูล — การ์ดเส้นประคือจุดเหล่านั้น กรอกได้ตามปกติ`,
         `${nGap} points on the form have no reading yet — the dashed cards; you can still fill them`)
    : "";
}

async function openParamMachine(id) {
  $("#paramHome").classList.add("hidden");
  $("#paramDetail").classList.remove("hidden");
  $("#pdScada").innerHTML = $("#pdHist").innerHTML = "";
  $("#pdGap").textContent = $("#pdLegend").textContent = "";
  paramOpen = null;
  $("#pdTitle").textContent = id;
  $("#pdWho").textContent = tt("กำลังโหลด...", "Loading...");
  $("#pdTicketMsg").textContent = "";

  let d;
  try { d = await gsAuth("apiParamMachine", id, 7); }
  catch (err) { $("#pdWho").textContent = err.message; return; }
  paramOpen = d;

  paintParamDetail(d);

  /* กราฟแนวโน้มของเดิมยังใช้ได้ แค่ย้ายมาอยู่ใต้รายละเอียดและล็อกไว้ที่เครื่องนี้
     ต้องใส่ตัวเลือกเองก่อน — รอบแรก loadParamData ยังไม่เคยเติมรายชื่อเครื่องให้ select
     ถ้าไม่ใส่ ค่าจะเป็นค่าว่าง แล้วกราฟจะกลายเป็นของทุกเครื่องรวมกันโดยไม่มีใครสังเกต */
  $("#paramTrendPanel").classList.remove("hidden");
  const sel = $("#pmMachine"), want = d.cmms || d.id;
  if (![...sel.options].some((o) => o.value === want)) sel.add(new Option(want, want));
  sel.value = want;
  loadParamData();
}

async function makeTicketFromParam(btn) {
  if (!paramOpen) return;
  const msg = $("#pdTicketMsg");
  msg.className = "text-sm mt-2 text-red-600";
  btn.disabled = true; btn.textContent = "กำลังเปิดใบ...";
  try {
    const res = await gsAuth("apiParamMakeTicket", paramOpen.id, {});
    msg.className = "text-sm mt-2 text-green-700";
    msg.textContent = tt(`เปิดใบแจ้งซ่อม ${res.ticket_id} แล้ว`, `Ticket ${res.ticket_id} created`);
    await refresh();
  } catch (err) {
    msg.textContent = err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = tt("🔧 เปิดใบแจ้งซ่อมจากค่านี้", "🔧 Open a ticket from this");
  }
}

/* ═══════════ พารามิเตอร์เครื่องจักร — อ่านอย่างเดียว ═══════════
   ข้อมูลอยู่ที่โปรเจค "ระบบบันทึกพารามิเตอร์เครื่องจักร" ช่างกรอกที่ระบบนั้นเหมือนเดิม
   หน้านี้เป็นแค่หน้าต่างมอง ไม่มีปุ่มบันทึกอะไรทั้งสิ้น เจ้าของข้อมูลยังเป็นอีกโปรเจค

   รายชื่อเครื่องมาจากข้อมูลจริงที่มีคนกรอก ไม่ใช่ทะเบียนของ CMMS
   เครื่องที่ไม่เคยมีใครบันทึกค่าจึงไม่โผล่มาให้เลือกแล้วเจอหน้าว่าง */

let paramData = { rows: [], machines: [], limits: [] };
let paramLoading = false;

async function openParamTab() {
  if (!ME) return;
  showParamHome();
  loadParamStatus();
  if (!$("#pmFrom").value) {
    const back = new Date();
    back.setDate(back.getDate() - 30);
    $("#pmFrom").value = ymd(back);
    $("#pmTo").value = ymd(new Date());
  }
  loadParamData();
}

async function loadParamData() {
  if (paramLoading) return;
  paramLoading = true;
  const body = $("#pmLogBody");
  skelRows(body, 7, 5);
  try {
    paramData = await gsAuth("apiParamData", $("#pmMachine").value, $("#pmFrom").value, $("#pmTo").value);
  } catch (err) {
    body.innerHTML = `<tr><td colspan="7" class="empty">${esc(err.message)}</td></tr>`;
    $("#paramStats").innerHTML = "";
    return;
  } finally {
    paramLoading = false;
  }

  // รายชื่อเครื่องมาพร้อมข้อมูลเสมอ แม้ตอนกรองอยู่ จะได้สลับเครื่องได้โดยไม่ต้องยิงซ้ำ
  const keep = $("#pmMachine").value;
  $("#pmMachine").innerHTML = `<option value="">-- ทุกเครื่อง --</option>` +
    paramData.machines.map((m) => `<option value="${esc(m)}">${esc(m)}</option>`).join("");
  if (paramData.machines.includes(keep)) $("#pmMachine").value = keep;

  $("#pmExternal").textContent =
    `อ่านจากชีต "${paramData.sheet}" ของ` +
    (paramData.external ? "โปรเจคระบบบันทึกพารามิเตอร์เครื่องจักร" : "ไฟล์เดียวกับระบบแจ้งซ่อม (ยังไม่ได้ตั้ง PARAM_SHEET_ID)") +
    // เตือนเรื่องพิกัดเฉพาะตอนเลือกเครื่องแล้ว — ตอนดู "ทุกเครื่อง" ไม่มีพิกัดอยู่แล้วโดยธรรมชาติ
    ($("#pmMachine").value && !paramData.limits.length
      ? " · ไม่พบพิกัดมาตรฐานของเครื่องนี้ จึงแสดงค่าดิบอย่างเดียว" : "");
  $("#pmExternal").classList.remove("hidden");

  renderParamStats();
  renderParamTable();

  const names = [...new Set(paramData.rows.map((x) => x.param))];
  const keepTrend = $("#pmTrend").value;
  $("#pmTrend").innerHTML = names.map((x) => `<option>${esc(x)}</option>`).join("");
  if (names.includes(keepTrend)) $("#pmTrend").value = keepTrend;
  drawParamTrend();
}

function renderParamStats() {
  const rows = paramData.rows;
  const bad = rows.filter((x) => x.status && x.status !== "ปกติ");
  const days = new Set(rows.map((x) => x.date));
  const last = rows.length ? rows[rows.length - 1] : null;

  $("#paramStats").innerHTML = [
    { ico: "🧾", bg: "#e0e7ff", fg: "#3730a3", label: "ค่าที่บันทึกไว้", num: nf(rows.length),
      sub: `${nf(days.size)} วัน · ${nf(new Set(rows.map((x) => x.param)).size)} พารามิเตอร์` },
    { ico: "⚠️", bg: "#fee2e2", fg: "#991b1b", label: "หลุดพิกัด", num: nf(bad.length),
      sub: rows.length ? `${Math.round((bad.length / rows.length) * 100)}% ของค่าทั้งหมด` : "" },
    { ico: "🏭", bg: "#dcfce7", fg: "#166534", label: "เครื่องที่มีข้อมูล", num: nf(paramData.machines.length) },
    { ico: "🕒", bg: "#fef9c3", fg: "#854d0e", label: "บันทึกล่าสุด",
      num: last ? last.date.slice(5) : "-", sub: last ? `${last.shift} · ${last.by || "ไม่ระบุผู้บันทึก"}` : "" },
  ].map(statCard).join("");
}

const PARAM_BAD = { "ต่ำกว่าพิกัด": "#2563eb", "สูงกว่าพิกัด": "#dc2626" };

function renderParamTable() {
  $("#pmLogBody").innerHTML = paramData.rows.length
    ? [...paramData.rows].reverse().map((x) => `<tr>
        <td class="td whitespace-nowrap">${esc(x.date)}</td>
        <td class="td whitespace-nowrap">${esc(x.shift) || "-"}</td>
        <td class="td font-medium">${esc(x.machine)}</td>
        <td class="td">${esc(x.param)}${x.unit ? ` <span class="text-slate-400">(${esc(x.unit)})</span>` : ""}</td>
        <td class="td num">${nf(x.value)}</td>
        <td class="td whitespace-nowrap" style="color:${PARAM_BAD[x.status] || "#64748b"}">${esc(x.status) || "-"}</td>
        <td class="td text-slate-600">${esc(x.by) || "-"}</td>
      </tr>`).join("")
    : `<tr><td colspan="7" class="empty">— ไม่มีข้อมูลในช่วงนี้ —</td></tr>`;
}

function drawParamTrend() {
  const name = $("#pmTrend").value;
  const rows = paramData.rows.filter((x) => x.param === name);
  if (!rows.length) { charts.pmChart?.destroy(); delete charts.pmChart; return; }

  const sp = (paramData.limits || []).find((x) => x.param === name) || {};
  const labels = rows.map((x) => `${x.date.slice(5)}${x.shift ? " " + x.shift.replace("กะ", "") : ""}`);

  /* เส้นพิกัดวาดเป็นชุดข้อมูลค่าคงที่ ทำให้เห็นทันทีว่าจุดไหนหลุดกรอบ
     โดยไม่ต้องไล่เทียบตัวเลขกับแกนเอง — มีเฉพาะตอนที่อีกโปรเจคมีตารางพิกัด */
  const limit = (v, color, label) => (v === "" || v === undefined || v === null) ? null : {
    label, data: labels.map(() => v), borderColor: color, borderDash: [6, 4],
    borderWidth: 1.5, pointRadius: 0, fill: false, datalabels: { display: false },
  };

  drawChart("pmChart", {
    type: "line",
    data: {
      labels,
      datasets: [
        { label: name + (sp.unit ? ` (${sp.unit})` : ""), data: rows.map((x) => x.value),
          borderColor: "#05924a", backgroundColor: "rgba(5,146,74,.12)", fill: true,
          tension: .3, pointRadius: 3,
          pointBackgroundColor: rows.map((x) => x.status && x.status !== "ปกติ" ? "#dc2626" : "#05924a"),
          // ช่วงยาว ๆ ป้ายตัวเลขทับกันจนอ่านไม่ออก ปล่อยให้ดูรูปทรงเส้นแทน
          datalabels: { display: rows.length <= 15 } },
        limit(sp.max, "#dc2626", "สูงสุด"),
        limit(sp.min, "#2563eb", "ต่ำสุด"),
        limit(sp.target, "#94a3b8", "มาตรฐาน"),
      ].filter(Boolean),
    },
    options: { scales: { y: { beginAtZero: false } } },
  });
}

/* ═══════════ ธีมเข้ม + โหมดภาษาอังกฤษ ═══════════

   ── ธีม ──
   ผูกกับ data-theme บน <html> ไม่ใช่ prefers-color-scheme
   คนหน้างานอยากสลับเองตามแสงในโรงงาน ไม่ใช่ตามค่าของเครื่อง

   ── ภาษา ──
   ตั้งใจ "ไม่" ไล่ใส่ data-i18n ทีละ element เพราะมีหลายร้อยจุด
   และข้อความส่วนใหญ่ถูกสร้างจาก template string ในโค้ด ไม่ได้อยู่ใน HTML ตั้งแต่ต้น

   วิธีที่ใช้คือแปลที่ text node หลังเรนเดอร์ — ดูทุกก้อนข้อความในหน้า
   ถ้าตรงกับคีย์ในพจนานุกรมแบบเป๊ะ ๆ ก็เปลี่ยนเป็นอังกฤษ
   ได้ทั้งหน้าที่มีอยู่และหน้าที่เพิ่งเรนเดอร์ใหม่ โดยไม่ต้องแตะฟังก์ชันเรนเดอร์สักตัว

   แลกมาด้วยข้อจำกัดที่ยอมรับได้: ข้อความที่มีตัวเลขแทรก เช่น "บันทึก 5 ค่าแล้ว" ไม่ถูกแปล
   ส่วนใหญ่เป็น toast ที่ขึ้นแล้วหายไป ไม่ใช่ป้ายที่ค้างอยู่บนจอ

const t = (s) => (LANG === "en" ? DICT_EN[String(s).trim()] || s : s);

/* สำหรับข้อความที่มีตัวเลขแทรก เช่น "เลย 3 วัน" หรือ "10 รายการ"
   ตัวแปลแบบเทียบตรงตัวจับไม่ได้ ต้องเลือกภาษาตอนประกอบเอง
   เขียนเป็น tt(ไทย, อังกฤษ) จะได้เห็นทั้งสองภาษาอยู่ติดกันตอนอ่านโค้ด */
const tt = (th, en) => (LANG === "en" ? en : th);

/* แปลข้อความที่มองเห็นในหน้า — ข้ามสคริปต์ สไตล์ และช่องที่ผู้ใช้พิมพ์เอง */
const SKIP_TAGS = new Set(["SCRIPT", "STYLE", "TEXTAREA", "CODE", "CANVAS"]);

/* เก็บข้อความเดิมของ "โครงหน้าที่ไม่ถูกสร้างใหม่" ไว้ตอนแปลครั้งแรกเท่านั้น
   ส่วนที่เรนเดอร์ใหม่ได้ (ตาราง การ์ด ปฏิทิน) ไม่ต้องจำ เพราะสลับกลับแล้วสั่งเรนเดอร์ใหม่ทีเดียวจบ
   ถ้าจำทุก node ที่เคยแปล รายการจะโตไม่หยุดตลอดวันที่เปิดหน้าไว้ */
let i18nUndo = [];
let i18nRecord = false;

function translateTree(root) {
  if (LANG !== "en" || !root) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: (n) => (n.parentNode && SKIP_TAGS.has(n.parentNode.nodeName))
      ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT,
  });
  const jobs = [];
  for (let n = walker.nextNode(); n; n = walker.nextNode()) {
    const raw = n.nodeValue;
    const key = raw.trim();
    if (!key) continue;
    const hit = DICT_EN[key];
    if (hit && hit !== key) jobs.push([n, raw.replace(key, hit)]);
  }
  jobs.forEach(([n, v]) => {
    if (i18nRecord) i18nUndo.push([n, null, n.nodeValue]);
    n.nodeValue = v;
  });

  // placeholder / title / aria-label ก็เป็นข้อความที่คนอ่าน
  root.querySelectorAll?.("[placeholder],[title],[aria-label]").forEach((el) => {
    ["placeholder", "title", "aria-label"].forEach((a) => {
      const v = el.getAttribute(a);
      if (!v || !DICT_EN[v.trim()]) return;
      if (i18nRecord) i18nUndo.push([el, a, v]);
      el.setAttribute(a, DICT_EN[v.trim()]);
    });
  });
  root.querySelectorAll?.("option").forEach((o) => {
    const hit = DICT_EN[o.textContent.trim()];
    if (!hit) return;
    if (i18nRecord) i18nUndo.push([o.firstChild || o, null, o.textContent]);
    o.textContent = hit;
  });
}

function applyTheme() {
  document.documentElement.setAttribute("data-theme", THEME);
  const btn = $("#themeBtn");
  const row = THEMES.find((x) => x[0] === THEME) || THEMES[0];
  if (btn) btn.textContent = row[1];          // ป้ายบอก "โหมดถัดไป" ไม่ใช่โหมดปัจจุบัน
  // Chart.js อ่านสีตัวอักษรตอนสร้างกราฟ เปลี่ยนธีมแล้วต้องบอกมันด้วย ไม่งั้นแกนดำบนพื้นดำ
  if (window.Chart) {
    Chart.defaults.color = THEME === "dark" ? "#94a3b8" : "#64748b";
    Chart.defaults.borderColor = THEME === "dark" ? "#334155" : "#e2e8f0";
    Object.values(charts).forEach((c) => { try { c.update("none"); } catch (_) {} });
  }
}

let i18nObserver = null;

function enterEnglish() {
  document.documentElement.lang = "en";
  i18nRecord = true;                 // จำเฉพาะรอบแรกที่แปลโครงหน้า
  translateTree(document.body);
  i18nRecord = false;

  /* หน้าถูกเรนเดอร์ใหม่ตลอดเวลา (ตาราง ปฏิทิน การ์ด) จึงเฝ้าดูแล้วแปลของใหม่ให้เอง
     ต้องหยุดเฝ้าระหว่างที่เราแก้เอง ไม่งั้นจะวนเรียกตัวเองไม่จบ */
  i18nObserver = new MutationObserver((muts) => {
    i18nObserver.disconnect();
    // เช็คภาษาซ้ำในนี้ด้วย — observer อาจยังไม่ทันถูกปลดตอนกำลังสลับกลับเป็นไทย
    if (LANG === "en") muts.forEach((m) => m.addedNodes.forEach((n) => {
      if (n.nodeType === 1) translateTree(n);
      else if (n.nodeType === 3 && DICT_EN[n.nodeValue.trim()]) n.nodeValue = DICT_EN[n.nodeValue.trim()];
    }));
    if (i18nObserver) i18nObserver.observe(document.body, { childList: true, subtree: true });
  });
  i18nObserver.observe(document.body, { childList: true, subtree: true });
}

  i18nObserver?.disconnect();
  i18nObserver = null;

  // คืนโครงหน้าเป็นไทย — ย้อนจากท้ายมาหน้า เผื่อมี node เดียวถูกแตะซ้ำ
  for (let i = i18nUndo.length - 1; i >= 0; i--) {
    const [node, attr, original] = i18nUndo[i];
    try {
      if (attr) node.setAttribute(attr, original);
      else node.nodeValue = original;
    } catch (_) {}                   // node หลุดจากหน้าไปแล้ว ข้ามได้
  }
  i18nUndo = [];

  /* ส่วนที่เรนเดอร์จาก JS ไม่ได้อยู่ในรายการย้อนกลับ สั่งสร้างใหม่จากเทมเพลตภาษาไทยแทน
     ถูกกว่าและชัวร์กว่าการไล่จำทุก node ที่เคยแปลตลอดทั้งวัน */
  try { render(); showTab(currentTab); } catch (_) {}

  /* ดรอปดาวน์พวกนี้ถูกสร้างตอน loadConfig() ซึ่งเกิด "หลัง" เข้าโหมดอังกฤษแล้ว
     ของที่ถูกแปลหลังรอบแรกไม่ได้ถูกจดไว้ในรายการย้อนกลับ จึงค้างเป็นอังกฤษถาวร
     สั่งสร้างใหม่แล้วใส่ค่าที่ผู้ใช้เลือกไว้กลับ — คนกำลังกรอกฟอร์มอยู่ไม่ควรเสียของที่พิมพ์ไป */
  const keep = ["#machineSelect", "#action_needed", "#workType",
                "#bulkStatus", "#bulkAssign", "#bulkPri"].map((sel) => [sel, $(sel)?.value]);
  try {
    fillMachineSelect();
    fillActionNeeded();
    fillPriorityPicker();
    fillBulkPickers();
    keep.forEach(([sel, v]) => { if (v && $(sel)) $(sel).value = v; });
    syncMachineRequired();            // คำอธิบายใต้ "ลักษณะงาน" ก็เป็นข้อความที่ถูกแปลไว้
  } catch (_) {}
}

function switchLang() {
  LANG = LANG === "en" ? "th" : "en";
  try { localStorage.setItem("mt_lang", LANG); } catch (_) {}
  $("#langBtn").textContent = LANG === "en" ? "ไทย" : "EN";
  if (LANG === "en") enterEnglish();
  else exitEnglish();
  buildPeriodPickers();               // ดรอปดาวน์ปี/เดือนไม่ได้ถูกสร้างใหม่โดย render()
  /* ข้อความในกระดิ่งประกอบจากชื่อเครื่องกับเลขใบ ตัวแปลแบบเทียบตรงตัวจับไม่ได้
     ต้องสั่งสร้างใหม่เพื่อให้ tt() เลือกภาษาให้ใหม่ทั้งรายการ */
  renderBell();
  renderTimeline();                   // ชิปตัวกรองประกอบจากจำนวน ตัวแปลเทียบตรงตัวจับไม่ได้
  paintBusyLabels();
  renderDashboard();
}

/* ปุ่มที่ถูกเขียนทับข้อความตอนกำลังทำงาน (เช่น "กำลังรวบรวม...") หลุดจากบัญชีของตัวแปลภาษา
   เพราะข้อความต้นฉบับของโหนดหายไปตอนถูกเขียนทับ ต้องทาสีใหม่เองทุกครั้งที่สลับภาษา
   ไม่งั้นปุ่มจะค้างเป็นภาษาเดิมตลอด ทั้งที่ทั้งหน้าเปลี่ยนไปแล้ว */
function paintBusyLabels() {
  const set = (sel, th, en) => { const b = $(sel); if (b && !b.disabled) b.textContent = tt(th, en); };
  set("#tlGo", "🕘 ดูไทม์ไลน์", "🕘 Show timeline");
  set("#pdTicket", "🔧 เปิดใบแจ้งซ่อมจากค่านี้", "🔧 Open a ticket from this");

function initThemeLang() {
  try { THEME = localStorage.getItem("mt_theme") || "light"; } catch (_) {}
  if (!THEMES.some((x) => x[0] === THEME)) THEME = "light";   // ธีมที่ถอดออกไปแล้วค้างในเครื่อง
  try { LANG = localStorage.getItem("mt_lang") || "th"; } catch (_) {}
  applyTheme();

  $("#themeBtn").addEventListener("click", () => {
    const i = THEMES.findIndex((x) => x[0] === THEME);
    THEME = THEMES[(i + 1) % THEMES.length][0];
    try { localStorage.setItem("mt_theme", THEME); } catch (_) {}
    applyTheme();
  });

  /* ⚠️ ห้ามใช้ location.reload() ตรงนี้
     GAS เสิร์ฟหน้าเว็บอยู่ใน iframe ที่ URL ใช้ได้ครั้งเดียว สั่งโหลดซ้ำแล้วได้หน้าขาวสนิท
     ต้องสลับภาษาในที่ ไม่ใช่โหลดใหม่ */
  $("#langBtn").addEventListener("click", switchLang);
  $("#langBtn").textContent = LANG === "en" ? "ไทย" : "EN";

  /* เฝ้าดูหน้าเว็บให้ enterEnglish() จัดการเองตัวเดียว
     เคยตั้ง observer ไว้อีกตัวตรงนี้ด้วย ทำงานตลอดเวลาแม้อยู่โหมดไทย และกิ่งที่แปล
     text node ไม่ได้เช็คภาษา ผลคือหัวข้อหน้าที่ showTab() เพิ่งเขียนกลายเป็นอังกฤษ
     ทั้งที่ผู้ใช้เลือกไทย — คือบั๊ก "บางจุดไม่เปลี่ยนตามภาษา" ที่เจอหน้าใบแจ้งซ่อม */
  if (LANG === "en") enterEnglish();
}
