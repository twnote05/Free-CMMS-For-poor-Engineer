/* ต้องตรงกับคลาส needs-login ใน index.html — กันคนพิมพ์เรียกตรงๆ ตอนเมนูถูกซ่อน */
const NEED_LOGIN = ["mine", "param", "check", "report", "qr", "pm", "timeline", "kpi"];
let currentTab = "list";

/* เมนู "KPI" กับ "Dashboard Summary" ใช้ panel เดียวกัน (#tab-report) ต่างกันแค่โชว์อะไรบ้าง
   ไม่ก๊อป DOM ออกมาเป็นอีกหน้า เพราะตัวเลือกช่วงเวลา/ปุ่ม Export/โมดอลรายละเอียด
   จะกลายเป็น id ซ้ำกันทั้งชุด ซึ่งเป็นคลาสของบั๊กที่โปรเจคนี้โดนมาแล้ว ($() คืนตัวแรกเสมอ) */
const panelOf = (name) => (name === "kpi" ? "report" : name);
let kpiOnly = false;

function showTab(name) {
  // กดเมนูนี้ตอนยังไม่ล็อกอินก็ยังไม่รู้ว่า "ฉัน" คือใคร ชวนล็อกอินก่อน
  if (NEED_LOGIN.includes(name) && !ME) { openLogin(); name = "list"; }
  currentTab = name;
  kpiOnly = name === "kpi";
  $$(".tab-panel").forEach((el) => el.classList.toggle("hidden", el.id !== "tab-" + panelOf(name)));
  $("#tab-report").dataset.active = panelOf(name) === "report" ? "1" : "0";
  // เข้าทางเมนู KPI ให้ซ่อนแถบแท็บย่อย และบังคับอยู่ที่ KPI เสมอ
  $("#subTabs").hidden = kpiOnly;
  /* ซ่อนแถบเลือก KPI ตรงนี้ด้วย ไม่ใช่รอให้ paintKpiPick ทำ —
     กลับไปหน้า Dashboard เต็มแล้ว panelKpi ไม่ถูกเรียก แถบจึงค้างอยู่บนหน้าอื่น */
  $("#kpiPickBar").hidden = !kpiOnly;
  if (!kpiOnly) { $("#kpiInline").hidden = true; $("#rolePanel").hidden = true; }
  if (kpiOnly) subTab = "kpi";
  $$(".tab-btn").forEach((b) => b.classList.toggle("active", b.dataset.tab === name));
  const [title, sub] = PAGE[name] || ["", ""];
  $("#pageTitle").textContent = title;
  $("#pageSub").textContent = sub;
  toggleSidebar(false);
  applyLock();
  if (name === "pm") openPmTab();
  if (name === "mine") { renderMine(); loadMinePm(); }
  if (name === "param") openParamTab();
  if (name === "timeline") openTimelineTab();
  if (name === "check" && !dailyCheck) loadDailyCheck();
  if (name === "qr") renderQr();
  if (panelOf(name) === "report") {
    if (!isLead()) return;
    if (!kpiOnly && subTab === "kpi") subTab = "overview";   // กลับมาหน้า Dashboard เต็ม
    showSubTab(subTab);
  }
}

/* ═══════════ สรุปเตือนตอนเข้าระบบ ═══════════
   คนที่เพิ่งล็อกอินยังไม่รู้ว่าต้องไปกดดูที่ไหน ตัวเลขชุดนี้อยู่ในหน้ารายการอยู่แล้ว
   แต่การรอให้เขาเดินไปเจอเองคือจังหวะที่งานค้างถูกลืม จึงเอามาชนหน้าให้ตอนเข้าระบบ

   ขึ้นเฉพาะตอนมีงานค้างจริง — ป๊อปอัปที่เด้งทุกครั้งแม้ไม่มีอะไรจะบอก
   คือป๊อปอัปที่คนกดปิดโดยไม่อ่านภายในสัปดาห์เดียว */
const WELCOME_CARDS = [STATUS.WAIT, STATUS.REPAIR, STATUS.OUT];

/* ผลงานของตัวเองในหน้าต้อนรับ — เทียบกับ "ตัวเองเดือนที่แล้ว" ไม่ใช่เทียบกับเพื่อน
   กระดานจัดอันดับระหว่างคนทำให้ช่างเลี่ยงงานยากและแย่งงานง่าย ซึ่งทำให้ทีมแย่ลง
   ส่วนการเทียบกับตัวเองเดือนก่อน ไม่มีใครเสียเปรียบจากการที่เพื่อนเก่งขึ้น

   โชว์แค่สามตัวที่ช่างคุมได้เองล้วน ๆ — ไม่เอาคะแนนรวมมาขึ้นตรงนี้
   คะแนนรวมเป็นเรื่องที่ควรคุยกันต่อหน้า ไม่ใช่เด้งใส่หน้าตอนเพิ่งล็อกอิน */
const MY_METRICS = [
  ["closed", "ปิดไป", (r) => r.closed, (v) => nf(v) + tt(" ใบ", ""), true],
  ["logRate", "วินัยการบันทึก", (r) => r.logRate, (v) => v + "%", true],
  ["repeatRate", "ซ่อมซ้ำ", (r) => r.repeatRate, (v) => v + "%", false],
];

function paintMyScore(user) {
  const box = $("#wcMine");
  if (!box || !user) return;
  const now = new Date();
  const monthOf = (d) => live(tickets).filter((t) =>
    (t.created_at || "").slice(0, 7) === `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`);
  const prevDate = new Date(now.getFullYear(), now.getMonth() - 1, 1);

  const pick = (list) => techScore(list, { open: [], pmItems: [] })
    .find((r) => r.name === user.name);
  const cur = pick(monthOf(now));
  if (!cur || !cur.closed) { box.classList.add("hidden"); return; }   // เดือนนี้ยังไม่มีผลงาน ไม่ต้องขึ้น
  const prev = pick(monthOf(prevDate));

  box.innerHTML = `<p class="text-sm font-bold text-slate-600 mb-2">${
    esc(tt("ผลงานเดือนนี้ของคุณ", "Your month so far"))}</p>
    <div class="my-grid">${MY_METRICS.map(([key, label, get, fmt, up]) => {
      const v = get(cur), was = prev ? get(prev) : null;
      if (v === null || v === undefined) return "";
      const diff = was === null || was === undefined ? null : Math.round((v - was) * 10) / 10;
      // ดีขึ้น/แย่ลง ขึ้นกับว่าตัวนั้นยิ่งมากยิ่งดีหรือยิ่งน้อยยิ่งดี
      const good = diff === null || diff === 0 ? null : (up ? diff > 0 : diff < 0);
      return `<div class="my-item">
        <div class="my-num">${esc(fmt(v))}</div>
        <div class="my-lbl">${esc(tt(label, label))}</div>
        <div class="my-diff" style="color:${good === null ? "#94a3b8" : good ? "#16a34a" : "#dc2626"}">${
          diff === null ? esc(tt("เดือนที่แล้วไม่มีข้อมูล", "no data last month"))
            : diff === 0 ? esc(tt("เท่าเดือนที่แล้ว", "same as last month"))
            : esc((diff > 0 ? "▲ +" : "▼ ") + fmt(Math.abs(diff)) +
                  tt(" จากเดือนที่แล้ว", " vs last month"))}</div>
      </div>`;
    }).join("")}</div>`;
  box.classList.remove("hidden");
}

function showWelcome(user) {
  const open = live(tickets).filter((t) => t.status !== STATUS.DONE);
  const n = (st) => open.filter((t) => t.status === st).length;
  if (!open.length) return false;

  $("#wcHello").textContent = tt(
    `สวัสดี ${user.name} (${ROLE_LABEL[user.role] || user.role}) — ตอนนี้มีงานที่ยังไม่ปิด ${open.length} ใบ`,
    `Hello ${user.name} — ${open.length} tickets are still open`);

  $("#wcCards").innerHTML = WELCOME_CARDS.map((st) => {
    const m = STATUS_META[st];
    return `<div class="wc-card" style="background:${m.bg};color:${m.fg}">
      <div class="wc-num">${n(st)}</div>
      <div class="wc-lbl">${m.ico} ${esc(t(st))}</div></div>`;
  }).join("");

  /* เตือนเฉพาะของที่ต้องมีคนขยับวันนี้ ไม่ใช่เล่าสถานะซ้ำอีกรอบ */
  const today = ymd(Date.now());
  const mine = open.filter(isMine).length;
  const late = open.filter((x) => x.due_at && ymd(x.due_at) < today).length;
  const back = open.filter(backLate).length;
  $("#wcWarn").innerHTML = [
    mine && `<p class="text-sm text-slate-500">${esc(tt(`เป็นงานของคุณ ${mine} ใบ`, `${mine} of them are yours`))}</p>`,
    late && `<p class="text-sm text-red-600">${esc(tt(`⏰ เลยกำหนดเสร็จ ${late} ใบ`, `⏰ ${late} past due`))}</p>`,
    back && `<p class="text-sm text-red-600">${esc(tt(`📦 เลยกำหนดรับคืนจากผู้รับซ่อมภายนอก ${back} ใบ`,
                                                      `📦 ${back} overdue back from external repairers`))}</p>`,
  ].filter(Boolean).join("");

  paintMyScore(user);

  $("#welcomeModal").classList.remove("hidden");
  return true;
}

const closeWelcome = () => $("#welcomeModal").classList.add("hidden");

/* หน้าต่างล็อกอิน เรียกได้จากทุกหน้า — เดิมต้องเดินไปหน้า Dashboard ถึงจะเจอช่องกรอก
   ซึ่งช่างที่ไม่มีสิทธิ์ดู Dashboard อยู่แล้ว จึงไม่มีทางล็อกอินเข้ามาบันทึกผลซ่อมได้ */
function openLogin() {
  $("#pwMsg").textContent = "";
  $("#loginModal").classList.remove("hidden");
  setTimeout(() => $("#emailInput").focus(), 50);
}

const closeLogin = () => $("#loginModal").classList.add("hidden");

async function handleLogin(e) {
  e.preventDefault();
  const btn = $("#pwBtn"), msg = $("#pwMsg");
  if (!hasBackend()) {
    msg.textContent = "โหมดทดสอบในเครื่อง — ต้องเปิดผ่าน URL ของ Web app (Apps Script) จึงจะเข้าสู่ระบบได้";
    return;
  }
  btn.disabled = true; btn.textContent = "กำลังตรวจสอบ...";
  msg.textContent = "";
  try {
    const res = await login($("#emailInput").value, $("#pwInput").value);
    $("#pwInput").value = "";
    closeLogin();
    applyLock();
    // รายชื่อทีมมาพร้อม token เท่านั้น — ตอนเปิดหน้ายังไม่ได้ล็อกอิน จึงยังไม่มี
    await loadConfig();
    await refresh();                            // โหลดข้อมูลเต็มจาก server ก่อนค่อยวาด
    renderDashboard();
    // สรุปต้องรอข้อมูลเต็มก่อน ไม่งั้นนับจาก cache ที่ยังเป็น scope public แล้วได้ตัวเลขน้อยกว่าจริง
    if (!showWelcome(res.user)) {
      toast(res.firstTime
        ? `ตั้ง PIN ให้ ${res.user.name} เรียบร้อย — ครั้งหน้าใช้ PIN นี้เข้าได้เลย`
        : `สวัสดี ${res.user.name} — ไม่มีงานค้าง`);
    }
  } catch (err) {
    msg.textContent = err.message;
  } finally {
    btn.disabled = false; btn.textContent = "เข้าสู่ระบบ";
  }
}

function toggleSidebar(open) {
  $("#sidebar").classList.toggle("open", open);
  $("#scrim").classList.toggle("hidden", !open);
}

/* ═══════════ ไทม์ไลน์ย้อนเหตุการณ์ ═══════════
   คำถามที่ระบบยังตอบไม่ได้คือ "เครื่องพังตอนบ่ายสามวันศุกร์ ก่อนหน้านั้นเกิดอะไรบ้าง"

async function loadTimeline(btn) {
  const machine = $("#tlMachine").value;
  if (!machine) { toast("เลือกเครื่องจักรก่อน", false); return; }
  btn.disabled = true; btn.textContent = "กำลังรวบรวม...";
  $("#tlBody").innerHTML = `<p class="empty">กำลังรวบรวม...</p>`;
  try {
    tlData = await gsAuth("apiTimeline", machine, $("#tlFrom").value, $("#tlTo").value);
    tlHide = {};
    renderTimeline();
  } catch (err) {
    $("#tlBody").innerHTML = `<p class="empty">${esc(err.message)}</p>`;
  } finally {
    btn.disabled = false;
    btn.textContent = tt("🕘 ดูไทม์ไลน์", "🕘 Show timeline");
  }
}

function renderTimeline() {
  if (!tlData) return;
  const all = tlData.events;

  $("#tlChips").innerHTML = Object.keys(TL_KIND).map((k) => {
    const n = all.filter((x) => x.kind === k).length;
    const m = TL_KIND[k];
    return `<button type="button" class="chip${tlHide[k] ? "" : " active"}" data-tl="${k}"
      ${n ? "" : "disabled"}>${m.ico} ${esc(tt(m.label, m.en))} ${n}</button>`;
  }).join("");

  const rows = all.filter((x) => !tlHide[x.kind]);
  if (!rows.length) {
    $("#tlBody").innerHTML = `<p class="empty">— ${esc(tt("ไม่มีเหตุการณ์ในช่วงนี้", "No events in this range"))} —</p>`;
    return;
  }

  /* คั่นด้วยหัววันที่ ไม่ใช่ปล่อยเป็นแถวยาวรวด — คนอ่านไทม์ไลน์กำลังหาว่า
     "วันนั้น" เกิดอะไร ไม่ได้อ่านไล่ทีละบรรทัดตั้งแต่ต้น */
  let day = "";
  $("#tlBody").innerHTML = rows.map((x) => {
    const m = TL_KIND[x.kind] || TL_KIND.ticket;
    const d = x.at.slice(0, 10), time = x.at.slice(11);
    const head = d !== day ? `<div class="tl-day">${esc(thDay(d))}</div>` : "";
    day = d;
    return head + `<div class="tl-row${x.bad ? " bad" : ""}">
      <div class="tl-time">${esc(time)}</div>
      <div class="tl-dot" style="background:${m.color}" aria-hidden="true">${m.ico}</div>
      <div class="tl-text">
        <div class="tl-title">${esc(x.title)}</div>
        ${x.detail ? `<div class="tl-detail">${esc(x.detail)}</div>` : ""}
      </div>
      ${x.kind === "ticket" && x.ref
        ? `<button type="button" class="tl-open" data-tl-open="${esc(x.ref)}">${esc(tt("เปิดใบ", "Open"))}</button>` : ""}
    </div>`;
  }).join("");
}

function fillMachineSelect() {
  const groups = {};
  MACHINES.forEach((m) => { (groups[m.group || "อื่นๆ"] ||= []).push(m); });

  // ไม่มีตัวเลือก "อื่นๆ (กรอกเอง)" อีกแล้ว — server Rev.2 ปฏิเสธชื่อนอกทะเบียน
  // ถ้าเปิดช่องให้พิมพ์เองไว้ จะกลับไปเป็นปัญหาชื่อแตก 117 แบบเหมือนเดิม
  $("#machineSelect").innerHTML =
    `<option value="">-- เลือกเครื่องจักร --</option>` +
    Object.entries(groups).map(([g, items]) =>
      `<optgroup label="${esc(g)}">` +
      items.map((m) => `<option value="${esc(m.name)}">${esc(m.name)}${
        m.location ? " · " + esc(t(m.location)) : ""}</option>`).join("") +
      `</optgroup>`).join("");

  $("#machineOtherWrap")?.classList.add("hidden");

  // มาจาก QR ที่ติดหน้าเครื่อง — server กรองชื่อให้ตรงทะเบียนมาแล้ว
  const pre = (window.PREFILL_MACHINE || "").trim();
  if (!pre) return;
  window.PREFILL_MACHINE = "";
  if (!MACHINES.some((m) => m.name === pre)) {
    toast("QR นี้อ้างถึงเครื่องที่ไม่อยู่ในทะเบียน — กรุณาเลือกจากรายการ", false);
    showTab("create");
    return;
  }
  // สแกน QR ที่ติดหน้าเครื่อง = งานเครื่องจักรแน่นอน ตั้งลักษณะงานให้ด้วย
  // ไม่งั้นถ้าค้างอยู่ที่งานอาคาร ช่องเครื่องจักรจะถูกปิดแล้วค่าที่เพิ่งใส่หายทันที
  $("#workType").value = "เครื่องจักร";
  syncMachineRequired();
  $("#machineSelect").value = pre;
  showTab("create");
  toast(`สแกนจากเครื่อง ${pre} — เลือกให้แล้ว`);
}

function setPriority(key) {

  $$("#priorityPick .pri-opt").forEach((b) => b.classList.toggle("on", b.dataset.pri === key));
  const p = PRIORITIES.find((x) => x.key === key);
  /* ข้อความนี้มีตัวเลขแทรก พจนานุกรมที่เทียบตรงตัวจึงจับไม่ได้
     ประกอบตามภาษาปัจจุบันตรงนี้เลย แทนที่จะปล่อยให้เป็นไทยค้างอยู่หน้าเดียว */
  $("#priorityHint").textContent = !p ? ""
    : LANG === "en"
      ? `Must be closed within ${fmtDuration(p.hours)} of being reported`
      : `ต้องปิดงานภายใน ${fmtDuration(p.hours)} นับจากเวลาที่แจ้ง`;
}

/** เหลือเวลาถึงกำหนดเสร็จ — คืน class สีและข้อความ */
function dueInfo(t) {
  if (!t.due_at) return { cls: "due-ok", text: "-" };
  if (t.status === STATUS.DONE) return { cls: "due-ok", text: fmtDT(t.due_at) };
  const left = (new Date(t.due_at) - Date.now()) / 36e5;
  if (left < 0)  return { cls: "due-late", text: tt(`เลย ${fmtDuration(-left)}`, `${fmtDuration(-left)} late`) };
  if (left < 8)  return { cls: "due-soon", text: tt(`เหลือ ${fmtDuration(left)}`, `${fmtDuration(left)} left`) };
  return { cls: "due-ok", text: fmtDT(t.due_at) };
}

/* ดรอปดาวน์ปี/เดือนถูกสร้างครั้งเดียวตอนเปิดหน้า สลับภาษาแล้วต้องสร้างใหม่

function buildPeriodPickers() {
  const keepY = $("#yearPicker")?.value, keepM = $("#monthPicker")?.value;
  buildYearPicker();
  if ($("#monthPicker")) {
    $("#monthPicker").innerHTML = `<option value="">${tt("ทั้งปี", "Whole year")}</option>` +
      MONTHS().map((m, i) => `<option value="${String(i + 1).padStart(2, "0")}">${m}</option>`).join("");
    if (keepM !== undefined) $("#monthPicker").value = keepM;
  }
  if (keepY && $("#yearPicker")) $("#yearPicker").value = keepY;
}

/* ─────────── init ─────────── */
function buildYearPicker() {
  const sel = $("#yearPicker");
  const years = new Set(tickets.map((t) => monthKey(t).slice(0, 4)).filter(Boolean));
  years.add(String(new Date().getFullYear()));
  const sorted = [...years].sort().reverse();
  const cur = sel.value;
  sel.innerHTML = sorted.map((y) =>
    `<option value="${y}">${tt("ปี", "Year")} ${yearLabel(y)}</option>`).join("");
  if (sorted.includes(cur)) sel.value = cur;
}

  $("#loginBtn").addEventListener("click", openLogin);
  $("#lockLoginBtn").addEventListener("click", openLogin);
  $("#loginClose").addEventListener("click", closeLogin);
  $("#loginModal").addEventListener("click", (e) => { if (e.target.id === "loginModal") closeLogin(); });
  $("#logoutBtn").addEventListener("click", logout);

  $$("#ticketBody, #mineBody").forEach((tb) => tb.addEventListener("click", (e) => {
    if (e.target.closest(".bulk-col")) return;    // กดช่องติ๊ก ไม่ใช่กดเปิดใบ
    const tr = e.target.closest("tr[data-id]");
    if (tr) openModal(tr.dataset.id);
  }));
  $("#mineDone").addEventListener("change", renderMine);
  $("#wlHideEmpty")?.addEventListener("change", renderDashboard);

  initFeedback();
  initBell();
  initBulk();

  $("#pmPrev").addEventListener("click", () => { pmCursor.setMonth(pmCursor.getMonth() - 1); loadPmCalendar(); });
  $("#pmNext").addEventListener("click", () => { pmCursor.setMonth(pmCursor.getMonth() + 1); loadPmCalendar(); });
  $("#pmToday").addEventListener("click", () => { pmCursor = new Date(); loadPmCalendar(); });
  $("#pmMachineFilter").addEventListener("change", renderPm);
  $("#pmKindFilter").addEventListener("change", renderPm);
  $("#pmBuildBtn").addEventListener("click", buildPmSchedule);
  $("#pmPlanBtn").addEventListener("click", openPmPlan);
  $("#pmPlanClose").addEventListener("click", closePmPlan);
  $("#pmPlanModal").addEventListener("click", (e) => { if (e.target.id === "pmPlanModal") closePmPlan(); });
  $("#pmPlanForm").addEventListener("submit", savePmPlan);
  $("#ppPick").addEventListener("change", (e) => fillPmPlanForm(e.target.value));
  $("#pmItemPdf").addEventListener("click", (e) => downloadPmWorkOrder(pmOpenId, e.target, "📄 ใบงาน PM"));
  // พิมพ์ "ทุกใบที่เห็นอยู่ตอนนี้" ตามตัวกรอง ไม่ใช่ทั้งเดือนดิบ ๆ
  // กรองเฉพาะงานอาคารแล้วกดพิมพ์ ต้องได้เฉพาะงานอาคาร ไม่งั้นตัวกรองก็ไม่มีความหมาย
  $("#pmSheetBtn").addEventListener("click", (e) => {
    const ids = pmVisible().filter((x) => x.status !== "เสร็จแล้ว" && x.status !== "ยกเลิก")
                           .map((x) => x.id);
    downloadPmWorkOrder(ids, e.target, "🖨 ใบงานทั้งเดือน");
  });
  $("#pmItemClose").addEventListener("click", closePmItem);
  $("#pmItemModal").addEventListener("click", (e) => { if (e.target.id === "pmItemModal") closePmItem(); });
  $("#pmItemSave").addEventListener("click", savePmItem);
  $("#pmMoveBtn").addEventListener("click", movePmItem);
  // ปฏิทินกับตารางถูกสร้างใหม่ทุกครั้งที่โหลดเดือน จึงดักที่ตัวแม่ที่อยู่กับที่
  $("#tab-pm").addEventListener("click", (e) => {
    const b = e.target.closest("[data-pm]");
    if (b) openPmItem(b.dataset.pm);
  });
  $("#pmRefresh").addEventListener("click", loadParamData);
  $("#pmTrend").addEventListener("change", drawParamTrend);
  [$("#pmMachine"), $("#pmFrom"), $("#pmTo")].forEach((el) =>
    el.addEventListener("change", loadParamData));
  $("#mineRange").innerHTML = MINE_RANGES
    .map(([v, label]) => `<button type="button" class="chip" data-range="${v}">${label} <span>0</span></button>`).join("");
  $("#mineRange").addEventListener("click", (e) => {
    const c = e.target.closest(".chip");
    if (c) { mineRange = c.dataset.range; renderMine(); }
  });

  $$("[data-tab]").forEach((b) => b.addEventListener("click", () => showTab(b.dataset.tab)));
  $("#burger").addEventListener("click", () => toggleSidebar(!$("#sidebar").classList.contains("open")));
  $("#scrim").addEventListener("click", () => toggleSidebar(false));
  $("#modal").addEventListener("click", (e) => {
    const c = e.target.closest("#mAssign .chip, #mTech .chip");
    if (!c) return;
    c.classList.toggle("active");
    paintAssignNote();
  });
  // กดตัวเลขในตารางผลงานช่าง -> เปิดโมดอลเดียวกับรายละเอียด KPI
  document.addEventListener("click", (e) => {
    const c = e.target.closest(".ts-cell");
    if (c) openKpiDrill("tech:" + c.dataset.tsm, c.dataset.ts);
  });
  $("#tsHideFew")?.addEventListener("change", renderDashboard);
  $("#kpiPick")?.addEventListener("change", renderDashboard);
  $("#rolePick")?.addEventListener("change", renderDashboard);
  $("#mClose").addEventListener("click", closeModal);
  $("#m2Close").addEventListener("click", closeModal2);
  $("#modal2").addEventListener("click", (e) => { if (e.target.id === "modal2") closeModal2(); });
  $("#modal").addEventListener("click", (e) => { if (e.target.id === "modal") closeModal(); });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (!$("#pmItemModal").classList.contains("hidden")) closePmItem();
    else if (!$("#pmPlanModal").classList.contains("hidden")) closePmPlan();
    else if (!$("#loginModal").classList.contains("hidden")) closeLogin();
    else if (!$("#modal2").classList.contains("hidden")) closeModal2();
    else closeModal();
  });

  initThemeLang();
  loadMe();                                   // กู้ตัวตนหลังรีเฟรชหน้า
  startClock();
  syncMachineRequired();
  $("#previewId").textContent = "ระบบออกให้อัตโนมัติ";
  showSubTab("overview");
  showTab("list");
  render();

  if (!hasBackend()) {
    fillMachineSelect();
    setFlowChip("⚠ โหมดทดสอบในเครื่อง", "flow-warn");
    return;
  }

  setFlowChip("กำลังโหลดข้อมูล...", "flow-off");
  skelRows($("#ticketBody"), 9, 6);           // อย่าปล่อยให้เป็นตารางว่างระหว่างรอ GAS ตอบ
  // token ที่ค้างจากแท็บก่อนหน้าอาจหมดอายุแล้ว เช็คก่อนเพื่อให้ปุ่มแสดงตรงกับสิทธิ์จริง
  if (isUnlocked()) {
    try { const r = await gs("apiCheckToken", getToken()); if (!r.valid) dropToken(); }
    catch (_) { dropToken(); }
    applyLock();
  }
  await loadConfig();
  await loadPMFromSheet();
  await refresh();
  loadDailyCheck();
}

/* GAS ประกอบ DOM ของหน้าเว็บผ่าน handler ตัวนี้ ถ้าเรา throw ออกไป
   มันจะยกเลิกการสร้าง DOM ทั้งหมด ได้หน้าขาวสนิทโดยไม่มีอะไรบอกสาเหตุ
   ยอมให้ฟีเจอร์เดียวพัง ดีกว่าทั้งระบบใช้ไม่ได้ */
document.addEventListener("DOMContentLoaded", () => {
  // init เป็น async — try/catch ธรรมดาไม่จับ rejection ต้องดักผ่าน promise
  Promise.resolve().then(init).catch((err) => {
    console.error("init ล้มเหลว:", err);
    const bar = document.getElementById("bootError");
    if (bar) {
      bar.textContent = "เริ่มระบบไม่สมบูรณ์ — " + err.message +
        " (กด F12 ดู Console หรือแจ้งผู้ดูแลระบบ)";
      bar.classList.remove("hidden");
    }
  });
});
</script>
