function viewInventory() {
  const stockValue = S.parts.reduce((s, p) => s + p.value, 0);
  $('view').innerHTML = `
    <div class="h-full overflow-y-auto p-4">
      ${S.dupes.length ? `<div class="rounded-xl bg-red-50 text-red-800 p-3 mb-3 text-sm">
        <b>⚠ รหัสอะไหล่ซ้ำในชีต Parts:</b> ${S.dupes.map(esc).join(', ')}<br>
        คงเหลือและมูลค่าของรหัสเหล่านี้ถูกนับซ้ำทุกแถว — เปิดชีต <b>Parts</b> ลบแถวที่เกินออกก่อนเชื่อตัวเลข
        (รหัสที่ต่างกันแค่ตัวพิมพ์ใหญ่เล็กนับเป็นซ้ำ)
      </div>` : ''}
      <div class="flex flex-wrap gap-2 items-center mb-3">
        <input id="inv-q" oninput="renderInv()" placeholder="ค้นรหัส / ชื่อ / ที่เก็บ…"
               class="field w-64">
        <select id="inv-loc" onchange="renderInv()" class="field w-44"></select>
        <label class="flex items-center gap-2 text-sm"><input id="inv-low" type="checkbox" onchange="renderInv()"> ถึงจุดสั่งซื้อ</label>
        <label class="flex items-center gap-2 text-sm"><input id="inv-exp" type="checkbox" onchange="renderInv()"> ใกล้/เลยวันหมดอายุ</label>
        ${can('LEAD') ? `<button onclick="editPart()" class="btn btn-ink text-sm">+ เพิ่มอะไหล่</button>` : ''}
        ${S.costHidden ? '' : `<span class="ml-auto text-sm text-slate-500">มูลค่าสต๊อกรวม: <b>${money(stockValue)}</b></span>`}
      </div>
      <div id="inv-list" class="space-y-2"></div>
    </div>`;

  // ตัวเลือกที่เก็บ สร้างจากของจริงในคลัง ไม่ใช่รายการตายตัว
  const locs = {};
  S.parts.forEach(p => { const k = p.location || NO_LOC; locs[k] = (locs[k] || 0) + 1; });
  $('inv-loc').innerHTML = `<option value="">ที่เก็บ: ทั้งหมด (${S.parts.length})</option>` +
    Object.keys(locs).sort(cmpLoc).map(k =>
      `<option value="${esc(k)}"${S.invLoc === k ? ' selected' : ''}>📍 ${esc(k)} · ${locs[k]}</option>`).join('');
  renderInv();
}

const NO_LOC = 'ยังไม่กำหนดที่เก็บ';

// A1 < A2 < A10 — เรียงส่วนที่เป็นตัวเลขแบบตัวเลข ไม่งั้น A10 ไปอยู่ก่อน A2
// และดันกองที่ยังไม่กำหนดที่เก็บไว้ท้ายสุดเสมอ
function cmpLoc(a, b) {
  if (a === NO_LOC) return 1;
  if (b === NO_LOC) return -1;
  const split = s => (String(s).match(/\d+|\D+/g) || []).map(x => /^\d/.test(x) ? +x : x);
  const A = split(a), B = split(b);
  for (let i = 0; i < Math.max(A.length, B.length); i++) {
    if (A[i] === undefined) return -1;
    if (B[i] === undefined) return 1;
    if (A[i] === B[i]) continue;
    return typeof A[i] === typeof B[i] ? (A[i] > B[i] ? 1 : -1) : String(A[i]).localeCompare(String(B[i]));
  }
  return 0;
}

// ช่อง Image ถูกเติมลิงก์ค้นรูปจาก "ชื่อ" ไว้ให้ทุกแถวแล้วตอนติดตั้ง
// ค้นด้วยชื่อเท่านั้น ไม่เอารหัสปน — รหัสเป็นรหัสภายใน ใส่ไปแล้วค้นไม่เจอ
// ถ้าเอาลิงก์รูปจริงไปวางทับ (Drive ฯลฯ) ปุ่มจะกลายเป็น "ดูรูป" เอง
function imgHref(p) {
  return p.image || ('https://www.google.com/search?udm=2&q=' + encodeURIComponent(p.name));
}
function isSearchLink(u) { return !u || u.indexOf('google.com/search') >= 0; }

function renderInv() {
  const q = ($('inv-q').value || '').trim().toLowerCase();
  const lowOnly = $('inv-low').checked;
  const expOnly = $('inv-exp').checked;
  S.invLoc = $('inv-loc') ? $('inv-loc').value : '';
  const badParts = new Set(S.batches.filter(b => b.status !== 'OK').map(b => b.part));

  const list = S.parts.filter(p =>
    (!lowOnly || p.low) && (!expOnly || badParts.has(p.part)) &&
    (!S.invLoc || (p.location || NO_LOC) === S.invLoc) &&
    (!q || p.name.toLowerCase().includes(q) || p.part.toLowerCase().includes(q) ||
     String(p.location).toLowerCase().includes(q)));

  const groups = {};
  list.forEach(p => { const k = p.location || NO_LOC; (groups[k] = groups[k] || []).push(p); });
  const keys = Object.keys(groups).sort(cmpLoc);
  // ค้นหา/กรองอยู่ = กางให้เลย ไม่ต้องคลิกซ้ำ · ดูทั้งคลัง = พับไว้ ไม่งั้นได้ 997 แถวรวด
  const openAll = !!(q || lowOnly || expOnly || S.invLoc);

  $('inv-list').innerHTML = keys.length ? keys.map(loc => {
    const items = groups[loc];
    const low = items.filter(p => p.low).length;
    return `
    <details ${openAll ? 'open' : ''} class="card">
      <summary class="p-3 cursor-pointer flex items-center gap-2 select-none">
        <span class="font-semibold text-sm">${loc === NO_LOC ? '❓' : '📍'} ${esc(loc)}</span>
        <span class="text-xs text-slate-400">· ${items.length} รายการ</span>
        ${low ? `<span class="chip bg-red-100 text-red-700">ถึงจุดสั่งซื้อ ${low}</span>` : ''}
      </summary>
      <div class="px-2 pb-2 space-y-1">${items.map(p => partRow(p, badParts)).join('')}</div>
    </details>`;
  }).join('') : '<p class="text-slate-400">ไม่พบอะไหล่ที่ค้นหา</p>';
}

function partRow(p, badParts) {
  const bs = S.batches.filter(b => b.part === p.part);
  const color = { EXPIRED: 'bg-red-100 text-red-700', SOON: 'bg-amber-100 text-amber-800', OK: 'bg-slate-100 text-slate-600' };
  return `
    <details class="rounded-xl border border-slate-200 hover:border-slate-300 transition">
      <summary class="p-2.5 flex items-center gap-3 cursor-pointer">
        <div class="flex-1 min-w-0">
          <div class="font-medium truncate">${esc(p.name)}
            ${p.level ? `<span class="ml-2 chip ${
              p.level === 'A' ? 'bg-teal-50 text-teal-700' : 'bg-slate-100 text-slate-600'
            }" title="Level ความจำเป็น">${esc(p.level)}</span>` : ''}
            ${p.low ? '<span class="ml-2 chip bg-red-100 text-red-700">ถึงจุดสั่งซื้อ</span>' : ''}
            ${badParts.has(p.part) ? '<span class="ml-1 chip bg-amber-100 text-amber-800">หมดอายุ</span>' : ''}
          </div>
          <div class="text-xs text-slate-500">${esc(p.part)} · ${esc(p.category)}
            ${p.machine ? ' · เครื่อง ' + esc(p.machine) : ''}</div>
        </div>
        <div class="text-right">
          <div class="num font-bold ${p.low ? 'text-red-600' : ''}">${p.stock} ${esc(p.unit)}</div>
          <div class="text-xs text-slate-400">Min ${p.min}${p.max ? ' / Max ' + p.max : ''}${p.moq ? ' · MOQ ' + p.moq : ''}
            ${S.costHidden ? '' : ' · ' + money(p.value)}</div>
        </div>
      </summary>
      <div class="px-3 pb-3 overflow-x-auto">
        <div class="flex flex-wrap gap-2 mb-2">
          <button onclick="openCard('${esc(p.part)}',this)" class="btn btn-soft px-3 text-xs">📄 บัตรสต๊อก</button>
          <a href="${imgHref(p)}" target="_blank" rel="noopener" class="btn btn-soft px-3 text-xs">${isSearchLink(p.image) ? '🔎 หารูป' : '🖼️ ดูรูป'}</a>
          ${can('LEAD') ? `
          <button onclick="takePartPhoto('${esc(p.part)}')" class="btn btn-soft px-3 text-xs">📷 ถ่ายรูป</button>
          <button onclick="tagThis('${esc(p.part)}')" class="btn btn-soft px-3 text-xs">🏷️ พิมพ์แท็ก</button>
          <button onclick="editPart('${esc(p.part)}')" class="btn btn-soft px-3 text-xs">แก้ข้อมูลอะไหล่</button>
          <button onclick="archivePartAsk(this,'${esc(p.part)}')" class="btn btn-danger px-3 text-xs">เลิกใช้</button>` : ''}
        </div>
        ${bs.length ? `<table class="w-full text-xs">
          <tr class="text-left text-slate-500"><th class="py-1">Batch</th><th>รับเข้า</th><th>หมดอายุ</th>
              <th class="text-right">คงเหลือ</th>${S.costHidden ? '' : '<th class="text-right">ต้นทุน</th>'}
              <th>อ้างอิง</th><th></th>${can('LEAD') ? '<th></th>' : ''}</tr>
          ${bs.map(b => `<tr class="border-t">
            <td class="py-1 font-mono">${esc(b.id)}</td><td>${esc(b.received)}</td><td>${esc(b.expiry) || '—'}</td>
            <td class="text-right font-semibold num">${b.left}/${b.qtyIn}</td>
            ${S.costHidden ? '' : `<td class="text-right num">${money(b.cost)}</td>`}
            <td class="truncate max-w-[10rem]">${esc(b.ref)}</td>
            <td><span class="px-2 py-0.5 rounded ${color[b.status]}">${b.status}</span></td>
            ${can('LEAD') ? `<td><button onclick="editBatch('${esc(b.id)}')" class="text-slate-400 hover:text-slate-700">✎</button></td>` : ''}
          </tr>`).join('')}
        </table>` : '<p class="text-xs text-slate-400">ยังไม่มีของในคลัง — รับเข้าที่แท็บรับเข้า</p>'}
      </div>
    </details>`;
}


/**

          — เลขจริงถูกจองตอนกดบันทึก สองคนกดพร้อมกันไม่ได้เลขซ้ำ</p>
       <div class="grid grid-cols-2 gap-2 mt-2">
         <div><label class="block text-xs text-slate-500">Item Group Main</label>
           ${sel('gGroup', 'GROUP', '6', x => x.key + ' = ' + (x.en || x.th))}</div>
         <div><label class="block text-xs text-slate-500">การใช้งาน</label>
           ${sel('gUsage', 'USAGE', '00', x => x.key + (x.en ? ' = ' + x.en : ''))}</div>
         <div><label class="block text-xs text-slate-500">Type</label>
           ${sel('gType', 'TYPE', '01', x => x.key + ' = ' + (x.th || x.en))}</div>
         <div><label class="block text-xs text-slate-500">หมวดชนิด</label>
           <div class="flex gap-1">
             <select id="pf-gCat" onchange="previewCode()" class="field flex-1 min-w-0">
               <option value="">— เลือกหมวด —</option>
               ${(S.codes.CATEGORY || []).map(x =>
                 `<option value="${esc(x.code4)}">${esc(x.key)} · ${esc(x.en)}${x.th ? ' (' + esc(x.th) + ')' : ''} · ${esc(x.code4)}</option>`).join('')}
             </select>
             <button type="button" onclick="openNewCat()" title="เพิ่มหมวดชนิดใหม่"
                     class="btn btn-soft px-3 shrink-0">+</button>
           </div></div>
       </div>
       <div id="code-preview" class="mt-2 text-sm text-slate-500">เลือกหมวดชนิดเพื่อดูรหัส</div>
     </div>`}

     ${f('part', 'รหัสอะไหล่ (Part No. / บาร์โค้ด)', p.part)}
     ${part
       ? `<p class="text-xs text-slate-400">เปลี่ยนรหัสจะกลายเป็นอะไหล่ตัวใหม่${dec
           ? ' · รหัสนี้คือ กลุ่ม ' + esc(dec.group) + ' · การใช้งาน ' + esc(dec.usage) +
             ' · Type ' + esc(codeLabel('TYPE', dec.type)) + ' · หมวด ' + esc(dec.key3) +
             ' ' + esc(dec.code4) + ' · ลำดับที่ ' + esc(dec.running)
           : ' · รหัสนี้ไม่เข้าโครง Code SP V1 (รหัสเดิมก่อนใช้มาตรฐาน)'}</p>`
       : '<p class="text-xs text-slate-400">ปล่อยว่างไว้ก็ได้ ถ้าเลือกหมวดด้านบนแล้ว — หรือพิมพ์รหัสเดิม/บาร์โค้ดผู้ผลิตทับลงไป</p>'}
     ${f('name', 'ชื่ออะไหล่', p.name)}

       <div>${f('max', 'Max — เติมถึง', p.max, 'number')}</div>

       <div>

         <select id="pf-level" class="field">

             v === 'A' ? 'A — ต้องมีในสต๊อกเสมอ (ของนอก)'

         </select>

        (ไม่ตั้ง Max ระบบใช้ 2 × Min) · MOQ ทำให้จำนวนในใบสั่งซื้อถูกปัดขึ้นเป็นจำนวนเท่า เช่น MOQ 25 ต้องการ 2 ก็สั่ง 25</p>`,
    `<button onclick="closeModal()" class="btn btn-soft">ยกเลิก</button>
     <button onclick="savePartForm(this)" class="btn btn-ink ml-auto px-5">บันทึก</button>`);
}

/** รหัสที่ preview เติมให้ล่าสุด — ถ้าผู้ใช้ไม่ได้แก้ทับ เซิร์ฟเวอร์จะออกเลขใหม่ให้ตอนบันทึก */
let LAST_PREVIEW = '';

/** ดูรหัสถัดไปแบบสด ๆ ตอนเลือกหมวด (เลขจริงจองตอนบันทึก) */
function previewCode() {
  const g = id => { const el = $('pf-' + id); return el ? el.value : ''; };
  const box = $('code-preview');
  if (!box) return;
  if (!g('gCat')) { box.textContent = 'เลือกหมวดชนิดเพื่อดูรหัส'; return; }
  box.textContent = 'กำลังหา Running…';
  api('previewPartCode', { group: g('gGroup'), usage: g('gUsage'), type: g('gType'), category: g('gCat') })
    .then(r => {
      box.innerHTML = `รหัสที่จะได้: <b class="font-mono text-base">${esc(r.code)}</b>
        <span class="text-xs">(ลำดับที่ ${r.running} ของ ${esc(r.category)})</span>`;
      const pf = $('pf-part');
      // เขียนทับให้เฉพาะตอนที่ยังว่าง หรือเป็นรหัสที่ระบบเพิ่งเติมเอง
      if (pf && (!pf.value.trim() || pf.value.trim() === LAST_PREVIEW)) pf.value = r.code;
      LAST_PREVIEW = r.code;
      if (!$('pf-category').value.trim()) $('pf-category').value = r.category;
    })
    .catch(e => { box.textContent = e.message; });
}

let RECV_WANTS_CODE = false;


/* ---- หมวดชนิดใหม่ -------------------------------------------------- *
 * ซ้อนบนฟอร์มเพิ่มอะไหล่ จึงต้องจำค่าที่กรอกค้างไว้เอง ก่อนวาดฟอร์มทับ
 * ไม่งั้นคนกรอกชื่ออะไหล่ไว้ครึ่งแล้วจะหายหมด */
let CAT_RETURN = null;

function openNewCat() {
  const keep = {};
  ['part', 'name', 'category', 'unit', 'location', 'cost', 'min', 'max', 'moq',
   'level', 'supplier', 'machine', 'gGroup', 'gUsage', 'gType'].forEach(k => {
    const el = $('pf-' + k); if (el) keep[k] = el.value;
  });
  CAT_RETURN = keep;

  openModal(
    `<h2 class="text-lg font-bold">เพิ่มหมวดชนิดใหม่</h2>
     <p class="text-xs text-slate-400 mt-1">
       Key 3 หลักระบบออกให้เอง — คุณกรอกแค่ชื่อกับอักษรย่อ 4 ตัวที่จะไปอยู่กลางรหัสอะไหล่
     </p>

     <label class="block text-xs text-slate-500 mt-3">ชื่อหมวด (อังกฤษ)</label>
     <input id="nc-en" class="field" placeholder="เช่น Proximity Sensor">

     <label class="block text-xs text-slate-500 mt-2">ชื่อหมวด (ไทย)</label>
     <input id="nc-th" class="field" placeholder="เช่น พร็อกซิมิตี้เซนเซอร์">

     <label class="block text-xs text-slate-500 mt-2">อักษรย่อ 4 ตัว *</label>
     <input id="nc-code4" class="field font-mono uppercase" maxlength="4" placeholder="P010"
            oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'')">

     <div id="nc-msg" class="mt-2 text-sm"></div>`,

/** กลับไปฟอร์มเดิมพร้อมค่าที่กรอกค้างไว้ — และเลือกหมวดที่เพิ่งสร้างให้เลยถ้ามี */
function backToPartForm(pickCode4) {
  const keep = CAT_RETURN || {};
  CAT_RETURN = null;
  editPart();
  Object.keys(keep).forEach(k => { const el = $('pf-' + k); if (el) el.value = keep[k]; });
  if (pickCode4) { const el = $('pf-gCat'); if (el) el.value = pickCode4; }
  previewCode();
}

function doAddCat(btn) {
  run(btn, async () => {
    const code4 = ($('nc-code4').value || '').trim().toUpperCase();
    const r = await api('addCodeCategory', $('nc-en').value, $('nc-th').value, code4);
    S.codes = r.codes;
    toast('เพิ่มหมวด ' + r.key + ' · ' + r.code4 + ' แล้ว', true);
    backToPartForm(r.code4);
    if (r.existing) {
      toast('อักษรย่อนี้มีรหัสเดิมใช้อยู่ ' + r.existing + ' รายการ — เลขถัดไปคือ ' +
            String(r.nextRunning).padStart(4, '0') + ' ไม่ได้เริ่มที่ 0001', true);
    }
  });
}

function savePartForm(btn) {
  run(btn, async () => {
    const v = id => { const el = $('pf-' + id); return el ? el.value : ''; };
    const cat = await api('savePart', {
      part: v('part'), name: v('name'), category: v('category'), unit: v('unit'),
      location: v('location'), cost: v('cost'), min: v('min'), max: v('max'), moq: v('moq'),
      level: v('level'), supplier: v('supplier'), machine: v('machine'),
      // ให้เซิร์ฟเวอร์ออกรหัสเองเมื่อเลือกหมวดไว้ — Running ถูกจองใน lock เดียวกับที่เขียนแถว
      // ถ้าผู้ใช้ไม่ได้แก้รหัสที่ preview เติมให้ ก็ออกใหม่อีกรอบ กัน preview ค้างจนเลขถูกคนอื่นใช้ไป
      gen: v('gCat') ? { group: v('gGroup'), usage: v('gUsage'), type: v('gType'), category: v('gCat') } : null,
      autoCode: !!v('gCat') && v('part').trim() === LAST_PREVIEW
    });
    const issued = cat.issued;
    const code = (issued && issued.code) || v('part').trim();
    takeCatalog(cat);
    closeModal();
    if (RECV_WANTS_CODE && code) {
      RECV_WANTS_CODE = false;
      const at = S.recv.findIndex(l => !String(l.part).trim());
      if (at < 0) S.recv.push(Object.assign(blankRecvLine(), { part: code }));
      else S.recv[at].part = code;
    }
    render();
    toast(issued ? 'บันทึกแล้ว · รหัสที่ออกให้ ' + issued.code : 'บันทึกอะไหล่แล้ว', true);
  });
}

function blankRecvLine() { return { part: '', qty: '', unitCost: '', expiry: '' }; }
function setRecv(i, field, v) { S.recv[i][field] = v; if (field !== 'expiry' && field !== 'part') renderRecvTotal(); }
function dropRecv(i) { S.recv.splice(i, 1); if (!S.recv.length) S.recv.push(blankRecvLine()); renderRecv(); }

function renderRecv() {
  $('recv-lines').innerHTML = S.recv.map((l, i) => `
    <div class="grid gap-2" style="grid-template-columns:minmax(0,2fr) 44px 80px 110px 140px 44px">
      <input id="rv-part-${i}" list="parts" value="${esc(l.part)}" oninput="setRecv(${i},'part',this.value)"
             placeholder="สแกนหรือพิมพ์รหัส" class="field">
      <button onclick="scanInto('rv-part-${i}', c => setRecv(${i},'part',c))" title="สแกนด้วยกล้อง"
              class="btn btn-soft px-0">📷</button>
      <input value="${esc(l.qty)}" oninput="setRecv(${i},'qty',this.value)" inputmode="numeric"
             placeholder="จำนวน" class="field text-center num">
      <input value="${esc(l.unitCost)}" oninput="setRecv(${i},'unitCost',this.value)" inputmode="decimal"
             placeholder="ต้นทุน/หน่วย" class="field text-right num">
      <input type="date" value="${esc(l.expiry)}" oninput="setRecv(${i},'expiry',this.value)"
             title="วันหมดอายุ (เฉพาะของที่มีอายุ)" class="field">
      <button onclick="dropRecv(${i})" class="btn btn-ghost px-0" aria-label="ลบบรรทัด">✕</button>
    </div>`).join('');
  renderRecvTotal();
}

function renderRecvTotal() {
  const total = S.recv.reduce((s, l) => s + (Number(l.qty) || 0) * (Number(l.unitCost) || 0), 0);
  $('recv-total').textContent = 'มูลค่ารวม ' + money(total);
}

/** ref กันคีย์ซ้ำของฟอร์มรับเข้า เปลี่ยนเมื่อรับเข้าสำเร็จเท่านั้น */
let RECV_REF = newRef();

function doReceive(btn, force) {
  run(btn, async () => {
    const lines = S.recv.filter(l => String(l.part).trim() && Number(l.qty) > 0);
    if (!lines.length) throw new Error('ยังไม่มีบรรทัดที่กรอกครบ');
    const doc = {
      supplier: $('rv-supplier').value.trim(),
      invoice: $('rv-invoice').value.trim(),
      poId: $('rv-po').value.trim(),
      lines: lines, ref: RECV_REF, force: !!force
    };
    let r;
    try {
      r = await api('receive', doc);
    } catch (e) {
      // บิลใบเดิมเคยรับไปแล้ว — ให้คนตัดสินใจ ไม่ห้ามตาย เพราะของอีกล็อตที่ใช้เลขบิลเดิมมีจริง
      if (/DUP_INVOICE/.test(e.message)) return askForceReceive(e.message.replace('DUP_INVOICE: ', ''));
      throw e;
    }
    S.recv = [blankRecvLine()];
    RECV_REF = newRef();
    closeModal();
    await refresh(false);
    render();
    toast(r.duplicate ? 'ฟอร์มนี้ถูกบันทึกไปแล้ว: ' + r.grn + ' (ไม่รับเข้าซ้ำ)'
                      : 'รับเข้า ' + r.batches + ' batch · ' + money(r.totalCost), true);
  });
}

function askForceReceive(message) {
  openModal(
    `<div class="text-center text-3xl">⚠</div>
     <h2 class="text-lg font-bold text-center mt-1">รับบิลใบนี้ซ้ำ?</h2>
     <p class="text-sm mt-2">${esc(message)}</p>
     <p class="text-xs text-slate-400 mt-2">ถ้ากดยืนยัน สต๊อกจะเพิ่มอีกรอบตามจำนวนในฟอร์ม —
        ทำเมื่อเป็นของอีกล็อตที่ผู้ขายออกเลขบิลเดิมจริงเท่านั้น</p>`,
    `<button onclick="closeModal()" class="btn btn-soft">ยกเลิก</button>
     <button onclick="doReceive(this,true)" class="btn btn-danger ml-auto px-5">ยืนยันรับซ้ำ</button>`);
}

function doGeneratePO(btn) {
  run(btn, async () => {
    const r = await api('generatePO');
    if (!r.poId) { toast('ไม่มีอะไหล่ที่ถึงจุดสั่งซื้อ', true); return; }
    S.pos = await api('getOpenPOs');
    renderPOList();
    toast('สร้าง ' + r.poId + ' — ' + r.lines.length + ' รายการ', true);
  });
}

function loadPOs(btn) { run(btn, async () => { S.pos = await api('getOpenPOs'); renderPOList(); }); }

function renderPOList() {
  if (!S.pos.length) { $('po-list').innerHTML = '<p class="text-sm text-slate-400">ไม่มีใบสั่งซื้อค้าง</p>'; return; }
  const groups = {};
  S.pos.forEach(l => { (groups[l.poId] = groups[l.poId] || []).push(l); });
  $('po-list').innerHTML = Object.keys(groups).map(poId => {
    const lines = groups[poId];
    const est = lines.reduce((s, l) => s + l.est, 0);
    return `
    <details class="rounded-xl bg-slate-100 p-3 mb-2">
      <summary class="cursor-pointer flex items-center gap-2">
        <b class="font-mono text-sm">${esc(poId)}</b>
        <span class="text-xs text-slate-500">${lines.length} รายการ · ${money(est)}</span>
        <span class="ml-auto flex gap-2">
          <button onclick="event.preventDefault();poToReceiving('${esc(poId)}')" class="btn btn-soft px-3 text-xs">โหลดเข้าฟอร์มรับเข้า</button>
          <button onclick="event.preventDefault();doCancelPO(this,'${esc(poId)}')" class="btn btn-danger px-3 text-xs">ยกเลิก</button>
        </span>
      </summary>
      <table class="w-full text-xs mt-2">
        <tr class="text-left text-slate-500"><th>รหัส</th><th>ชื่อ</th><th>ผู้ขาย</th>
            <th class="text-right">คงเหลือ</th><th class="text-right">MOQ</th>
            <th class="text-right">สั่ง</th><th class="text-right">ประมาณ</th></tr>
        ${lines.map(l => `<tr class="border-t">
          <td class="py-1 font-mono">${esc(l.part)}</td><td>${esc(l.name)}</td><td>${esc(l.supplier)}</td>
          <td class="text-right num">${(byPart(l.part) || {}).stock ?? ''}</td>
          <td class="text-right num text-slate-400">${(byPart(l.part) || {}).moq || ''}</td>
          <td class="text-right num font-semibold">${l.qty}</td><td class="text-right num">${money(l.est)}</td></tr>`).join('')}
      </table>
    </details>`;
  }).join('');
}

function poToReceiving(poId) {
  S.recv = S.pos.filter(l => l.poId === poId)
    .map(l => ({ part: l.part, qty: l.qty, unitCost: l.unitCost, expiry: '' }));
  $('rv-po').value = poId;
  renderRecv();
  toast('โหลด ' + poId + ' เข้าฟอร์มแล้ว — แก้จำนวนจริงก่อนกดรับเข้า', true);
}

function doCancelPO(btn, poId) {
  run(btn, async () => {
    await api('cancelPO', poId);
    S.pos = await api('getOpenPOs');
    renderPOList();
    toast('ยกเลิก ' + poId + ' แล้ว', true);
  });
}

/* =========================================================================
 *  นับสต๊อก + ตัดจำหน่าย
 * ========================================================================= */

function viewCount() {
  const expired = S.batches.filter(b => b.status === 'EXPIRED');
  $('view').innerHTML = `
    <div class="h-full overflow-y-auto p-4 space-y-4">

      <section class="card p-4">
        <h2 class="font-bold">นับสต๊อก</h2>
        <p class="text-xs text-slate-400">กรอกจำนวนที่นับได้จริง ระบบจะปรับส่วนต่าง — ขาดตัดจาก batch เก่าสุด เกินสร้าง batch ใหม่</p>
        <div class="flex flex-wrap gap-2 items-center mt-3">
          <input id="ct-part" list="parts" placeholder="สแกนหรือพิมพ์รหัสอะไหล่" class="field w-56"
                 onkeydown="if(event.key==='Enter')addCount(this.value)">
          <button onclick="scanInto('ct-part', addCount)" title="สแกนด้วยกล้อง"
                  class="btn btn-ink text-lg px-3">📷</button>
          <button onclick="addCount($('ct-part').value)" class="btn btn-soft text-sm">+ เพิ่ม</button>
          <button onclick="addAllCount()" class="btn btn-soft text-sm">เพิ่มทุกตัวที่มีของ</button>
        </div>
        <div id="count-lines" class="mt-3 space-y-2"></div>
        <div class="flex gap-2 items-center mt-3">
          <span id="count-sum" class="text-sm text-slate-500"></span>
          <button onclick="submitCount(this)" class="btn btn-primary ml-auto px-5">บันทึกผลนับ</button>
        </div>
      </section>

      <section class="card p-4">
        <h2 class="font-bold">ตัดจำหน่าย</h2>
        <p class="text-xs text-slate-400">ของชำรุด หมดอายุ หรือสูญหาย — ต้องระบุสาเหตุทุกบรรทัด</p>
        <div class="flex flex-wrap gap-2 items-center mt-3">
          <input id="sc-part" list="parts" placeholder="สแกนหรือพิมพ์รหัส" class="field w-48">
          <button onclick="scanInto('sc-part')" title="สแกนด้วยกล้อง"
                  class="btn btn-ink text-lg px-3">📷</button>
          <input id="sc-qty" inputmode="numeric" placeholder="จำนวน" class="field w-24 text-center">
          <select id="sc-reason" class="field w-auto">
            <option>ชำรุด</option><option>หมดอายุ</option><option>สูญหาย</option><option>อื่น ๆ</option>
          </select>
          <button onclick="addScrap()" class="btn btn-soft text-sm">+ เพิ่ม</button>
          ${expired.length ? `<button onclick="queueAllExpired()" class="btn btn-danger text-sm">
            ตัดของหมดอายุทั้งหมด (${expired.length} batch)</button>` : ''}
        </div>
        <div id="scrap-lines" class="mt-3 space-y-2"></div>
        <div class="flex gap-2 items-center mt-3">
          <span id="scrap-sum" class="text-sm text-slate-500"></span>
          <button onclick="submitScrap(this)" class="btn btn-danger ml-auto px-5">ยืนยันตัดจำหน่าย</button>
        </div>
      </section>
    </div>`;
  renderCount();
  renderScrap();
}

function addCount(part) {
  part = String(part || '').trim();
  const p = byPart(part);
  if (!p) { toast('ไม่พบอะไหล่ ' + part); return; }
  if (!S.count.some(c => c.part === part)) S.count.push({ part: part, physical: p.stock, note: '' });
  $('ct-part').value = '';
  renderCount();
}

function addAllCount() {
  S.parts.filter(p => p.stock > 0).forEach(p => {
    if (!S.count.some(c => c.part === p.part)) S.count.push({ part: p.part, physical: p.stock, note: '' });
  });
  renderCount();
}

function setCount(part, v) { const c = S.count.find(x => x.part === part); if (c) c.physical = v; renderCount(); }
function dropCount(part) { S.count = S.count.filter(c => c.part !== part); renderCount(); }

function renderCount() {
  $('count-lines').innerHTML = S.count.map(c => {
    const p = byPart(c.part) || { name: c.part, unit: '', stock: 0 };
    const diff = (Number(c.physical) || 0) - p.stock;
    return `
    <div class="grid gap-2 items-center" style="grid-template-columns:minmax(0,1fr) 100px 90px 44px">
      <div class="min-w-0"><div class="text-sm truncate">${esc(p.name)}</div>
        <div class="text-xs text-slate-500">${esc(c.part)} · ระบบ ${p.stock} ${esc(p.unit)}</div></div>
      <input value="${esc(c.physical)}" onchange="setCount('${esc(c.part)}',this.value)" inputmode="numeric"
             class="field text-center num">
      <span class="text-sm num text-center ${diff === 0 ? 'text-slate-400' : (diff < 0 ? 'text-red-600' : 'text-teal-700')}">
        ${diff > 0 ? '+' : ''}${diff}</span>
      <button onclick="dropCount('${esc(c.part)}')" class="btn btn-ghost px-0">✕</button>
    </div>`;
  }).join('') || '<p class="text-sm text-slate-400">ยังไม่มีรายการ</p>';
  const off = S.count.filter(c => (Number(c.physical) || 0) !== (byPart(c.part) || {}).stock).length;
  $('count-sum').textContent = S.count.length + ' รายการ · ไม่ตรง ' + off + ' รายการ';
}

function submitCount(btn) {
  run(btn, async () => {
    if (!S.count.length) throw new Error('ยังไม่มีรายการนับ');
    const r = await api('auditStock', S.count.map(c => ({ part: c.part, physical: c.physical, note: c.note })));
    const off = r.lines.filter(l => l.variance !== 0);
    S.count = [];
    await refresh(false);
    render();
    openModal(
      `<h2 class="text-lg font-bold">บันทึกผลนับแล้ว</h2>
       <p class="text-sm text-slate-500">${esc(r.auditId)} · ไม่ตรง ${off.length} รายการ
         ${S.costHidden ? '' : '· ผลต่างมูลค่า ' + money(r.netValue)}</p>
       ${off.length ? `<table class="w-full text-sm mt-3">
         <tr class="text-left text-slate-500"><th>รหัส</th><th class="text-right">ระบบ</th>
             <th class="text-right">นับได้</th><th class="text-right">ต่าง</th></tr>
         ${off.map(l => `<tr class="border-t"><td class="py-1 font-mono">${esc(l.part)}</td>
           <td class="text-right num">${l.system}</td><td class="text-right num">${l.physical}</td>
           <td class="text-right num ${l.variance < 0 ? 'text-red-600' : 'text-teal-700'}">
             ${l.variance > 0 ? '+' : ''}${l.variance}</td></tr>`).join('')}
       </table>` : '<p class="mt-3 text-sm">ตรงกันทุกรายการ 👌</p>'}`);
  });
}

function addScrap() {
  const part = $('sc-part').value.trim();
  const qty = Number($('sc-qty').value);
  if (!byPart(part)) { toast('ไม่พบอะไหล่ ' + part); return; }
  if (!(qty > 0)) { toast('จำนวนต้องมากกว่า 0'); return; }
  S.scrapList.push({ part: part, qty: qty, reason: $('sc-reason').value });
  $('sc-part').value = ''; $('sc-qty').value = '';
  renderScrap();
}

function queueAllExpired() {
  S.batches.filter(b => b.status === 'EXPIRED').forEach(b => {
    S.scrapList.push({ part: b.part, qty: b.left, reason: 'หมดอายุ ' + b.expiry + ' (' + b.id + ')' });
  });
  renderScrap();
  toast('ใส่ของหมดอายุเข้าคิวแล้ว — ตรวจแล้วกดยืนยัน', true);
}

function dropScrap(i) { S.scrapList.splice(i, 1); renderScrap(); }

function renderScrap() {
  $('scrap-lines').innerHTML = S.scrapList.map((l, i) => {
    const p = byPart(l.part) || { name: l.part, unit: '', cost: 0 };
    return `
    <div class="flex items-center gap-2 rounded-xl bg-slate-100 p-2">
      <div class="flex-1 min-w-0"><div class="text-sm truncate">${esc(p.name)}</div>
        <div class="text-xs text-slate-500">${esc(l.part)} · ${esc(l.reason)}</div></div>
      <span class="num font-semibold">${l.qty} ${esc(p.unit)}</span>
      <button onclick="dropScrap(${i})" class="btn btn-ghost px-2">✕</button>
    </div>`;
  }).join('') || '<p class="text-sm text-slate-400">ยังไม่มีรายการ</p>';
  const loss = S.scrapList.reduce((s, l) => s + l.qty * ((byPart(l.part) || {}).cost || 0), 0);
  $('scrap-sum').textContent = S.scrapList.length + ' รายการ' + (S.costHidden ? '' : ' · ประมาณ ' + money(loss));
}

let SCRAP_REF = newRef();

function submitScrap(btn) {
  run(btn, async () => {
    if (!S.scrapList.length) throw new Error('ยังไม่มีรายการตัดจำหน่าย');
    const r = await api('scrap', S.scrapList, SCRAP_REF);
    S.scrapList = [];
    SCRAP_REF = newRef();
    await refresh(false);
    render();
    toast(r.duplicate ? 'รายการนี้ถูกบันทึกไปแล้ว: ' + r.scrapId + ' (ไม่ตัดซ้ำ)'
                      : 'ตัดจำหน่ายแล้ว' + (S.costHidden ? '' : ' · มูลค่า ' + money(r.loss)), true);
  });
}

/* =========================================================================
 *  เครื่องมือช่าง + ใบมีด — ของที่วนกลับมา ไม่ใช่ของที่เบิกแล้วหมดไป
 *
 *  ใบมีด: บันทึกแค่ "เกิดอะไรขึ้นวันไหน" แล้วจำนวนวันคำนวณเอง
 *  เครื่องมือ: ทะเบียนว่าอะไรอยู่กับทีมไหน ใครรับผิดชอบ
 * ========================================================================= */

const BLADE_ACTS = {
  INSTALL: { label: '⬇ ติดตั้ง', from: ['สำรอง'], need: true, cls: 'btn-primary' },
  REMOVE:  { label: '⬆ ถอดออก', from: ['ติดตั้งอยู่'], cls: 'btn-soft' },
  SEND:    { label: '✂ ส่งลับคม', from: ['ติดตั้งอยู่', 'สำรอง', 'ใช้ไม่ได้'], cls: 'btn-soft' },
  RETURN:  { label: '↩ รับคืนจากลับคม', from: ['ส่งลับคม'], cls: 'btn-primary' },
  NG:      { label: '✕ ใช้ไม่ได้', from: ['ติดตั้งอยู่', 'สำรอง', 'ส่งลับคม'], cls: 'btn-danger' },
  SCRAP:   { label: '🗑 ปลดระวาง', from: ['สำรอง', 'ใช้ไม่ได้', 'ส่งลับคม'], role: 'ENG', cls: 'btn-danger' }
};
const BLADE_COLORS = {
  'ติดตั้งอยู่': 'bg-teal-50 text-teal-700', 'สำรอง': 'bg-slate-100 text-slate-600',
  'ส่งลับคม': 'bg-amber-100 text-amber-800', 'ใช้ไม่ได้': 'bg-red-100 text-red-700',
  'ปลดระวาง': 'bg-slate-100 text-slate-400'
};

function viewAssets() {
  const tab = (k, label, icon) => `
    <button onclick="S.assetTab='${k}';viewAssets()"
      class="flex items-center gap-1.5 px-3 rounded-lg text-sm whitespace-nowrap transition
             ${S.assetTab === k ? 'bg-white shadow-sm font-semibold text-slate-800' : 'text-slate-500 hover:bg-white/70'}"
      style="height:34px"><span>${icon}</span><span>${label}</span></button>`;

  $('view').innerHTML = `
    <div class="h-full overflow-y-auto p-4">
      <div class="flex gap-1 p-1 rounded-xl bg-slate-100 w-fit mb-3">
        ${tab('blades', 'ใบมีด', '🔪')}${tab('tools', 'เครื่องมือช่าง', '🧰')}
      </div>
      <div id="asset-body"></div>
    </div>`;
  if (S.assetTab === 'tools') loadTools(); else loadBlades();
}

/* ---- ใบมีด ------------------------------------------------------------- */

function loadBlades() {
  run(null, async () => {
    const r = await api('getBlades');
    S.blades = r.blades; S.bladeCounts = r.counts;
    renderBlades();
  });
}

// เรียงเครื่องตามชื่อ แต่เอากองที่ยังไม่ติดตั้งไว้ท้ายเสมอ
const NO_MACHINE = 'คลังสำรอง · ยังไม่ติดตั้ง';

function bladeMachines() {
  const m = {};
  S.blades.forEach(b => { const k = b.machine || NO_MACHINE; m[k] = (m[k] || 0) + 1; });
  return Object.keys(m).sort((a, b) =>
    a === NO_MACHINE ? 1 : b === NO_MACHINE ? -1 : a.localeCompare(b, 'th'))
    .map(k => ({ name: k, n: m[k] }));
}

function renderBlades() {
  const counts = S.bladeCounts;
  const all = ['ทั้งหมด'].concat(Object.keys(BLADE_COLORS));
  const machines = bladeMachines();
  const list = S.blades.filter(b =>
    (S.bladeFilter === 'ทั้งหมด' || b.status === S.bladeFilter) &&
    (!S.bladeMachine || (b.machine || NO_MACHINE) === S.bladeMachine));

  const groups = {};
  list.forEach(b => { const k = b.machine || NO_MACHINE; (groups[k] = groups[k] || []).push(b); });
  const names = Object.keys(groups).sort((a, b) =>
    a === NO_MACHINE ? 1 : b === NO_MACHINE ? -1 : a.localeCompare(b, 'th'));

  const mChip = (label, val, n) => `<button onclick="S.bladeMachine='${val}';renderBlades()"
    class="chip ${S.bladeMachine === val ? 'bg-slate-800 text-white' : 'bg-white border border-slate-200 text-slate-600 hover:border-slate-400'}"
    style="height:32px">${esc(label)} <span class="opacity-60">${n}</span></button>`;

  $('asset-body').innerHTML = `
    <div class="flex flex-wrap gap-2 items-center mb-2">
      ${mChip('ทุกเครื่อง', '', S.blades.length)}
      ${machines.map(m => mChip((m.name === NO_MACHINE ? '📦 สำรอง' : '⚙️ ' + m.name), m.name, m.n)).join('')}
      ${can('LEAD') ? '<button onclick="editBlade()" class="btn btn-ink text-sm ml-auto">+ เพิ่มใบมีด</button>' : ''}
    </div>

    <div class="flex flex-wrap gap-2 items-center mb-3 pb-3 border-b border-slate-100">
      ${all.map(s => `<button onclick="S.bladeFilter='${s}';renderBlades()"
        class="chip ${S.bladeFilter === s ? 'bg-slate-800 text-white' : (BLADE_COLORS[s] || 'bg-slate-100 text-slate-600')}"
        style="height:30px">${esc(s)}${s === 'ทั้งหมด' ? ' ' + S.blades.length : ' ' + (counts[s] || 0)}</button>`).join('')}
    </div>

    ${names.length ? names.map(mc => {
      const items = groups[mc].slice().sort((a, b) =>
        (a.position || '￿').localeCompare(b.position || '￿'));
      const onDuty = items.filter(b => b.status === 'ติดตั้งอยู่').length;
      return `
      <details open class="card mb-3">
        <summary class="p-3 cursor-pointer flex items-center gap-2 select-none">
          <span class="font-semibold text-sm">${mc === NO_MACHINE ? '📦' : '⚙️'} ${esc(mc)}</span>
          <span class="text-xs text-slate-400">· ${items.length} ใบ</span>
          ${onDuty ? `<span class="chip bg-teal-50 text-teal-700">ติดตั้งอยู่ ${onDuty}</span>` : ''}
        </summary>
        <div class="px-3 pb-3 space-y-2">${items.map(bladeCard).join('')}</div>
      </details>`;
    }).join('') : '<p class="text-slate-400">ไม่มีใบมีดตามที่เลือก</p>'}`;
}

function bladeCard(b) {
  const acts = Object.keys(BLADE_ACTS).filter(k => {
    const a = BLADE_ACTS[k];
    return a.from.indexOf(b.status) >= 0 && (!a.role || can(a.role));
  });
  return `
  <div class="rounded-xl border border-slate-200 p-3 flex flex-wrap items-center gap-3 hover:border-slate-300 transition">
    <div class="w-16 shrink-0 text-center">
      ${b.position
        ? `<div class="font-mono font-bold text-sm text-slate-800">${esc(b.position)}</div>
           <div class="text-[10px] text-slate-400">ตำแหน่ง</div>`
        : '<div class="text-slate-300 text-xl">—</div>'}
    </div>
    <div class="flex-1 min-w-[12rem]">
      <div class="font-mono text-sm break-all">${esc(b.id)}
        <span class="chip ${BLADE_COLORS[b.status] || 'bg-slate-100'} ml-1">${esc(b.status)}</span>
      </div>
      <div class="text-xs text-slate-500">
        ${b.spec ? esc(b.spec) + ' · ' : ''}
        ${b.status === 'ติดตั้งอยู่'
          ? 'ตั้งแต่ ' + esc(b.install) + ' — <b>' + b.runningDays + ' วัน</b>'
          : 'อายุใช้งานรวม ' + b.days + ' วัน'}
        ${b.sharpen ? ' · ลับคมมาแล้ว ' + b.sharpen + ' ครั้ง' + (b.last ? ' (ล่าสุด ' + esc(b.last) + ')' : '') : ''}
      </div>
      ${b.note ? `<div class="text-[11px] text-slate-400 mt-0.5 line-clamp-2">${esc(b.note)}</div>` : ''}
    </div>
    <div class="flex flex-wrap gap-1 justify-end">
      ${acts.map(k => `<button onclick="askBlade('${esc(b.id)}','${k}')"
          class="btn ${BLADE_ACTS[k].cls} px-3 text-xs">${BLADE_ACTS[k].label}</button>`).join('')}
      <button onclick="showBladeLog('${esc(b.id)}',this)" class="btn btn-ghost px-2 text-xs">ประวัติ</button>
    </div>
  </div>`;
}

/** ปุ่มไหนก็มาลงที่นี่ — INSTALL ต้องถามเครื่องกับตำแหน่ง ที่เหลือแค่ยืนยัน */
function askBlade(id, action) {
  const a = BLADE_ACTS[action];
  const b = S.blades.find(x => x.id === id) || {};
  openModal(

const TOOL_COLORS = {
  'ใช้งาน': 'bg-teal-50 text-teal-700', 'ชำรุด': 'bg-amber-100 text-amber-800',
  'ส่งซ่อม': 'bg-amber-100 text-amber-800', 'สูญหาย': 'bg-red-100 text-red-700',

};

function loadTools() {
  run(null, async () => { S.tools = await api('getTools'); renderTools(); });

function renderTools() {
  const q = S.toolQ.toLowerCase();
  const list = S.tools.filter(t => !q || t.name.toLowerCase().includes(q) ||
    t.holder.toLowerCase().includes(q) || t.team.toLowerCase().includes(q) || t.id.toLowerCase().includes(q));
  const NO_TEAM = '— ไม่ระบุทีม —';
  const teams = Array.from(new Set(list.map(t => t.team || NO_TEAM)));
  const bad = S.tools.filter(t => t.status === 'สูญหาย' || t.status === 'ชำรุด').length;
  // ค้นอยู่ = กางให้เลย · ดูเฉยๆ = กางทีมแรกทีมเดียว พอให้เห็นว่าข้างในมีอะไร
  const openIf = i => (q || i === 0) ? 'open' : '';

  $('asset-body').innerHTML = `
    <div class="flex flex-wrap gap-2 items-center mb-3">
      <input value="${esc(S.toolQ)}" oninput="S.toolQ=this.value;renderTools()"
             placeholder="ค้นชื่อ / ผู้รับผิดชอบ / ทีม…" class="field w-72">
      <span class="text-sm text-slate-500">${S.tools.length} รายการ · ${teams.length} ทีม
        ${bad ? '· <b class="text-red-600">ชำรุด/สูญหาย ' + bad + '</b>' : ''}</span>
      ${can('LEAD') ? '<button onclick="editTool()" class="btn btn-ink text-sm ml-auto">+ เพิ่มเครื่องมือ</button>' : ''}
    </div>

    ${teams.map((team, i) => {
      const items = list.filter(t => (t.team || NO_TEAM) === team);
      const holders = Array.from(new Set(items.map(t => t.holder).filter(Boolean)));
      const teamBad = items.filter(t => t.status === 'สูญหาย' || t.status === 'ชำรุด').length;
      return `
      <details ${openIf(i)} class="card mb-2">
        <summary class="p-3 cursor-pointer flex flex-wrap items-center gap-2 select-none">
          <span class="font-semibold text-sm">🧰 ${esc(team)}</span>
          <span class="text-xs text-slate-400">· ${items.length} รายการ</span>
          ${teamBad ? `<span class="chip bg-red-100 text-red-700">ชำรุด/สูญหาย ${teamBad}</span>` : ''}
          ${holders.length ? `<span class="ml-auto text-xs text-slate-400 truncate max-w-[18rem]"
            title="${esc(holders.join(', '))}">👤 ${esc(holders.slice(0, 3).join(' · '))}${holders.length > 3 ? ' +' + (holders.length - 3) : ''}</span>` : ''}
        </summary>
        <div class="px-3 pb-3 overflow-x-auto">
          <table class="w-full text-sm">
            <tr class="text-left text-slate-500 border-b">
                <th class="py-1.5">รหัส</th><th>รายการ</th>
                <th class="text-right">จำนวน</th><th>ผู้รับผิดชอบ</th><th>รับมอบ</th>
                ${S.costHidden ? '' : '<th class="text-right">ราคา</th>'}<th>สถานะ</th>${can('LEAD') ? '<th></th>' : ''}</tr>
            ${items.map(t => `<tr class="border-t hover:bg-slate-50">
              <td class="py-1.5 font-mono text-xs text-slate-400">${esc(t.id)}</td>
              <td class="font-medium">${esc(t.name)}${t.note ? `<div class="text-xs text-slate-400 font-normal">${esc(t.note)}</div>` : ''}</td>
              <td class="text-right num whitespace-nowrap">${t.qty} ${esc(t.unit)}</td>
              <td class="whitespace-nowrap">${esc(t.holder) || '<span class="text-slate-300">—</span>'}</td>
              <td class="text-xs text-slate-500 whitespace-nowrap">${esc(t.date) || '—'}</td>
              ${S.costHidden ? '' : `<td class="text-right num">${t.price ? money(t.price) : ''}</td>`}
              <td><span class="chip ${TOOL_COLORS[t.status] || 'bg-slate-100 text-slate-600'}">${esc(t.status)}</span></td>
              ${can('LEAD') ? `<td class="text-right"><button onclick="editTool('${esc(t.id)}')"
                class="btn btn-ghost px-2 text-xs">แก้</button></td>` : ''}
            </tr>`).join('')}
          </table>
        </div>
      </details>`;
    }).join('') || '<p class="text-slate-400">ยังไม่มีเครื่องมือในทะเบียน</p>'}`;
}

function doSaveTool(btn, id) {
  run(btn, async () => {
    const v = k => $('tf-' + k).value;
    S.tools = await api('saveTool', { id: id, name: v('name'), qty: v('qty'), unit: v('unit'),

      status: v('status'), note: v('note') });

/**
 * ทีมนี้ไม่มีแอดมินคอยมอนิเตอร์ ระบบจึงต้องบอกเองว่ามีอะไรค้างอยู่
 * คิดจากข้อมูลที่โหลดมาแล้วทั้งหมด ไม่ยิงเซิร์ฟเวอร์เพิ่ม

/* ---- พื้นที่เก็บข้อมูล ------------------------------------------------- */

const DISK_TONE = {
  OK:     { bar: 'bg-teal-500',  chip: 'bg-teal-50 text-teal-700',   word: 'ยังเหลือเยอะ' },
  WARN:   { bar: 'bg-amber-500', chip: 'bg-amber-100 text-amber-800', word: 'เริ่มเยอะแล้ว' },
  URGENT: { bar: 'bg-red-500',   chip: 'bg-red-100 text-red-700',     word: 'ต้องจัดการด่วน' }
};

function loadStorage(btn) {
  run(btn, async () => { S.disk = await api('getStorageHealth'); renderStorage(); });
}

function renderStorage() {
  const d = S.disk;
  if (!d) {
    $('disk').innerHTML = `<section class="card p-4 mb-4">
      <div class="flex items-center gap-2">
        <h3 class="font-bold text-sm">💾 พื้นที่เก็บข้อมูล</h3>
        <button onclick="loadStorage(this)" class="btn btn-soft px-3 text-xs ml-auto">ตรวจสอบ</button>
      </div></section>`;
    return;
  }
  const tone = DISK_TONE[d.level] || DISK_TONE.OK;
  const fmt = n => Number(n).toLocaleString('en-US');

  $('disk').innerHTML = `
    <section class="card p-4 mb-4">
      <div class="flex flex-wrap items-center gap-2">
        <h3 class="font-bold text-sm">💾 พื้นที่เก็บข้อมูล</h3>
        <span class="chip ${tone.chip}">${d.pct}% · ${tone.word}</span>
        <button onclick="loadStorage(this)" class="btn btn-ghost px-2 text-xs ml-auto">ตรวจใหม่</button>
      </div>

      <div class="h-2.5 rounded-full bg-slate-100 mt-3 overflow-hidden">
        <div class="h-full ${tone.bar} transition-all" style="width:${Math.max(1, Math.min(100, d.pct))}%"></div>
      </div>
      <div class="text-xs text-slate-500 mt-1">
        ใช้ไป ${fmt(d.used)} จาก ${fmt(d.limit)} ช่อง
        ${d.oldest ? ' · บันทึกเก่าสุด ' + esc(d.oldest) : ''}
      </div>

      ${d.level === 'OK' ? '' : `
        <div class="mt-3 p-3 rounded-xl ${d.level === 'URGENT' ? 'bg-red-50 text-red-800' : 'bg-amber-50 text-amber-900'} text-sm">
          <b>${d.level === 'URGENT' ? 'ต้องจัดการแล้ว' : 'ควรเริ่มวางแผน'}</b> —
          ถ้าเต็ม ระบบจะ<b>เบิกและรับเข้าไม่ได้ทั้งหมด</b> ไม่ใช่แค่ประวัติหาย
          สำรองบันทึกเก่าออกเป็นไฟล์ก่อน แล้วค่อยตัดออกจากชีต
        </div>`}

      <table class="w-full text-sm mt-3">
        <tr class="text-left text-slate-500 border-b">
          <th class="py-1.5">ชีต</th><th class="text-right">แถว</th>
          <th class="text-right">ช่อง</th><th></th></tr>
        ${d.sheets.filter(s => s.rows > 0 || s.trimmable).map(s => `
        <tr class="border-t">
          <td class="py-1.5">${esc(s.name)}${s.label ? `<div class="text-xs text-slate-400">${esc(s.label)}</div>` : ''}</td>
          <td class="text-right num">${fmt(s.rows)}</td>
          <td class="text-right num text-slate-500">${fmt(s.cells)}</td>
          <td class="text-right">${s.trimmable && can('ENG')
            ? `<button onclick="askTrim('${esc(s.name)}',${s.rows})" class="btn btn-soft px-3 text-xs">สำรอง & ตัด</button>`
            : ''}</td>
        </tr>`).join('')}
      </table>
    </section>`;
}

function askTrim(sheet, rows) {
  openModal(
    `<h2 class="text-lg font-bold">สำรอง &amp; ตัด · <span class="font-mono">${esc(sheet)}</span></h2>
     <p class="text-sm text-slate-500 mt-1">ตอนนี้ ${Number(rows).toLocaleString('en-US')} แถว</p>

     <label class="block text-xs text-slate-500 mt-3">เก็บข้อมูลย้อนหลังไว้กี่วัน</label>
     <select id="tr-days" class="field">
       <option value="365">1 ปี (แนะนำ)</option>
       <option value="730">2 ปี</option>
       <option value="180">6 เดือน</option>
       <option value="90">3 เดือน</option>
     </select>

     <div class="mt-3 p-3 rounded-xl bg-slate-100 text-sm space-y-1">
       <div>1. แถวที่เก่ากว่านั้นถูกเขียนเป็นไฟล์ CSV ลง Drive ก่อน</div>
       <div>2. เขียนไฟล์สำเร็จแล้ว จึงลบออกจากชีต</div>
       <div class="text-slate-500">ถ้าเขียนไฟล์ไม่สำเร็จ จะไม่ลบอะไรเลย</div>
     </div>
     <p class="text-xs text-amber-700 mt-2">
       ยอดคงเหลือไม่เปลี่ยน — ยอดมาจาก batch ไม่ได้มาจากชีตนี้
       แต่<b>บัตรสต๊อกจะย้อนได้ไม่เกินช่วงที่เก็บไว้</b>
     </p>`,
    `<button onclick="closeModal()" class="btn btn-soft">ยกเลิก</button>
     <button onclick="doTrim('${esc(sheet)}',this)" class="btn btn-danger ml-auto px-5">สำรองแล้วตัด</button>`);
}

function doTrim(sheet, btn) {
  run(btn, async () => {
    const r = await api('backupAndTrim', sheet, Number($('tr-days').value));
    closeModal();
    if (!r.moved) { toast('ไม่มีแถวที่เก่าพอจะตัด', true); return; }
    toast('ย้ายออก ' + r.moved.toLocaleString('en-US') + ' แถว · สำรองไว้แล้ว', true);
    S.disk = await api('getStorageHealth');
    renderStorage();
    $('disk').insertAdjacentHTML('afterbegin', `
      <div class="card p-3 mb-2 text-sm bg-teal-50">
        สำรองเป็นไฟล์ <b>${esc(r.file)}</b> แล้ว
        <a href="${esc(r.url)}" target="_blank" rel="noopener" class="underline ml-1">เปิดดู</a>
      </div>`);
  });
}

function renderHealth() {
  const bad = S.batches.filter(b => b.status !== 'OK');

  $('rp-from').value = daysAgoStr(days);

function loadReport(btn) {
  run(btn, async () => {

  const r = S.report;
  const tile = (label, value, sub) => `
    <div class="card p-3">
      <div class="text-xs text-slate-500">${label}</div>

  const table = (title, rows, cols) => `
    <section class="card p-4">
      <h3 class="font-bold text-sm">${title}</h3>
      ${rows.length ? `<table class="w-full text-sm mt-2">

      ${tile('มูลค่าสต๊อกวันนี้', money(r.stockValue), 'ปรับจากการนับ ' + money(r.adjustValue))}

      <div class="flex items-end gap-1 mt-3" style="height:120px">
        ${r.series.map(s => `<div class="flex-1 bg-teal-600 rounded-t" title="${esc(s.date)} · ${money(s.value)}"

      ${table('เบิกตามเครื่องจักร', r.byMachine, [

function pickIssue(id, btn) { $('rt-id').value = id; loadIssue(btn); }

function loadIssue(btn) {
  run(btn, async () => {
    S.issue = await api('findIssue', $('rt-id').value.trim());
    renderReturn();
  });
}

function setReturnQty(part, v) {
  const l = S.issue.lines.find(x => x.part === part);
  if (!l) return;
  l.returnQty = Math.min(Math.max(0, Number(v) || 0), l.returnable);
  renderReturn();
}

function renderReturn() {
  const s = S.issue;
  const total = s.lines.reduce((t, l) => t + l.returnQty, 0);
  $('rt-detail').innerHTML = `
    <div class="rounded-xl bg-slate-100 p-3">
      <div class="text-sm"><b class="font-mono">${esc(s.issueId)}</b> · ${esc(s.ts)}</div>
      <div class="text-xs text-slate-500">เครื่อง ${esc(s.machine)}
        ${s.jobNo ? ' · ใบแจ้งซ่อม ' + esc(s.jobNo) : ''} · ผู้เบิก ${esc(s.requester)}</div>
      <table class="w-full text-sm mt-2">
        <tr class="text-left text-slate-500"><th>อะไหล่</th><th class="text-right">เบิก</th>
            <th class="text-right">คืนได้</th><th class="text-right">คืนครั้งนี้</th></tr>
        ${s.lines.map(l => `<tr class="border-t">
          <td class="py-1">${esc(l.name)}<div class="text-xs text-slate-400">${esc(l.part)}</div></td>
          <td class="text-right num">${l.qty}</td>
          <td class="text-right num">${l.returnable}</td>
          <td class="text-right">
            <input value="${l.returnQty}" onchange="setReturnQty('${esc(l.part)}',this.value)"
                   inputmode="numeric" class="field text-center num" style="width:72px">
          </td></tr>`).join('')}
      </table>
      <label class="block text-xs text-slate-500 mt-2">สาเหตุที่คืน</label>
      <input id="rt-reason" value="เบิกเกิน" class="field">
      <div class="flex items-center gap-2 mt-3">
        <span class="text-sm text-slate-500">คืนรวม ${total} หน่วย</span>
        <button onclick="doReturn(this)" class="btn btn-primary ml-auto px-5" ${total ? '' : 'disabled'}>
          ยืนยันการคืน</button>
      </div>
    </div>`;
}

function doReturn(btn) {
  run(btn, async () => {
    const lines = S.issue.lines.filter(l => l.returnQty > 0).map(l => ({ part: l.part, qty: l.returnQty }));
    const r = await api('returnParts', S.issue.issueId, lines, $('rt-reason').value.trim());
    S.issue = null;
    closeModal();
    await refresh(false);
    render();
    toast('คืนเข้าคลังแล้ว ' + r.lines + ' รายการ', true);
  });
}

/** ทางลัดจากหน้าคลัง: เอาตัวนี้ตัวเดียวขึ้นแผ่นแล้วเด้งไปหน้าแท็กเลย */
function tagThis(part) {
  LB.mode = 'part';
  LB.queue = [{ key: part, count: 1 }];
  go('labels');
}

/* ---- คิวที่จะพิมพ์ ------------------------------------------------------- */

function pushLabel(key, count) {
  const row = LB.queue.filter(q => q.key === key)[0];
  if (row) row.count += (count || 1); else LB.queue.push({ key: key, count: count || 1 });
}

function addLabel(part) {
  const box = $('lb-q');
  const raw = part || (box ? box.value.trim() : '');
  if (!raw) return;
  const p = byPart(raw) || S.parts.filter(x => x.part.toLowerCase() === raw.toLowerCase())[0];
  if (!p) { toast('ไม่พบอะไหล่ ' + raw); return; }
  if (box) box.value = '';
  pushLabel(p.part);
  viewLabels();
}

function addLabelsByLoc() {
  const loc = $('lb-loc').value;
  if (!loc) { toast('เลือกช่องเก็บก่อน'); return; }
  const hits = S.parts.filter(p => p.location === loc);

/* ---- แผ่นสติกเกอร์ ------------------------------------------------------ */

function labelSheetHtml() {
  const s = LABEL_SHEETS[LB.sheet];
  // แผ่นที่กว้างเกินหน้ากระดาษจะพิมพ์คอลัมน์หนึ่งหายไปเฉย ๆ — จับตรงนี้ ไม่ใช่
  // หลังจากใครป้อนกระดาษสติกเกอร์แผ่นจริงเข้าไปแล้ว
  const sheetW = s.cols * s.w + (s.cols - 1) * s.gapX + s.padX * 2;
  if (s.page === 'A4' && sheetW > 210.5) {
    return '<p style="color:#b91c1c;padding:2rem;text-align:center">⚠ ' + s.name +
           ' = ' + sheetW.toFixed(1) + 'mm กว้างเกินหน้า A4</p>';
  }
  const perSheet = s.cols * s.rows;

  const flat = [];
  LB.queue.forEach(q => {
    const item = LB.mode === 'part'
      ? (byPart(q.key) || { part: q.key, name: q.key, location: '', min: 0, unit: '', machine: '' })
      : { part: q.key, name: '', location: q.key, min: 0, unit: '', machine: '', isLoc: true };
    for (let i = 0; i < q.count; i++) flat.push(item);
  });
  if (!flat.length) return '';

  const pages = [];
  for (let i = 0; i < flat.length; i += perSheet) pages.push(flat.slice(i, i + perSheet));

  // ขนาดตัวอักษรไล่ตามความสูงสติกเกอร์ — ป้ายใหญ่ต้องอ่านจากระยะห่างได้
  const nameSize = Math.max(6, Math.min(13, s.h / 4.5));
  const subSize = Math.max(5, Math.min(10, s.h / 6.5));
  const locSize = Math.max(10, Math.min(40, s.h / (LB.mode === 'loc' ? 2 : 4)));

  return pages.map((page, pi) => `
    <div class="sheet" style="
        width:${sheetW}mm;
        padding:${s.padY + LB.offY}mm ${s.padX}mm ${s.padY}mm ${s.padX + LB.offX}mm;
        grid-template-columns:repeat(${s.cols}, ${s.w}mm);
        column-gap:${s.gapX}mm; row-gap:${s.gapY}mm;
        ${pi ? 'break-before:page;page-break-before:always;' : ''}">
      ${page.map((p, i) => `
        <div class="label" style="width:${s.w}mm;height:${s.h}mm">
          ${LB.showLogo ? `<img src="${logoSrc()}" alt="" style="height:${Math.max(3, s.h / 9)}mm;width:auto" onerror="this.remove()">` : ''}
          ${p.isLoc
            ? `<div class="loc" style="font-size:${locSize}px">${esc(p.location)}</div>`
            : `${LB.showName ? `<div class="nm" style="font-size:${nameSize}px;max-height:${nameSize * 2.5}px">${esc(p.name)}</div>` : ''}
               ${LB.showLoc && p.location ? `<div class="loc" style="font-size:${locSize}px">📍${esc(p.location)}</div>` : ''}`}
          <div class="code" data-code="${esc(p.part)}" data-i="${pi}-${i}"></div>
          ${!p.isLoc && (LB.showMin || LB.showMachine) ? `<div class="sub" style="font-size:${subSize}px">${
            [LB.showMin && p.min ? 'Min ' + p.min + ' ' + esc(p.unit) : '',
             LB.showMachine && p.machine ? esc(p.machine) : ''].filter(Boolean).join(' · ')}</div>` : ''}
        </div>`).join('')}
    </div>`).join('');
}

/**
 * วาดรหัสหลังมาร์กอัปลงจอแล้ว รหัสที่วาดไม่ได้จะขึ้นเตือนเป็นสีแดง
 * ไม่ใช่ปล่อยให้เป็นช่องว่าง — สติกเกอร์เปล่าหนึ่งดวงคือของที่หาไม่เจอทั้งปี
 */
function drawLabelCodes(root) {
  const s = LABEL_SHEETS[LB.sheet];
  const both = LB.code === 'BOTH';
  const barH = Math.max(16, Math.min(60, s.h * (both ? 0.5 : 0.9)));
  const qrPx = Math.round(Math.max(48, Math.min(180, (both ? s.h * 1.3 : s.h * 2))));

  root.querySelectorAll('.code').forEach(box => {
    const code = box.getAttribute('data-code');
    box.innerHTML = '';
    box.style.display = 'flex';
    box.style.alignItems = 'center';
    box.style.justifyContent = 'center';
    box.style.gap = '1.5mm';
    box.style.maxWidth = '100%';
    try {
      if (LB.code === 'QR' || both) {
        const holder = document.createElement('div');
        box.appendChild(holder);
        new QRCode(holder, { text: code, width: qrPx, height: qrPx,
                             correctLevel: QRCode.CorrectLevel.M });
      }
      if (LB.code === 'CODE128' || both) {
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        box.appendChild(svg);
        JsBarcode(svg, code, {
          format: 'CODE128', width: both ? 1.1 : 1.4, height: barH, margin: 0,
          displayValue: LB.showCode, fontSize: 11, textMargin: 0,
          font: 'Inter, monospace'
        });
      }
      if (LB.code === 'QR' && LB.showCode) {
        const t = document.createElement('div');
        t.textContent = code;
        t.style.cssText = 'font:9px/1.1 Inter,monospace;text-align:center';
        box.style.flexDirection = 'column';
        box.appendChild(t);
      }
    } catch (e) {
      box.innerHTML = '<div style="font-size:8px;color:#b91c1c">⚠ ' + esc(code) + '</div>';
    }
  });
}

function renderLabelSheet() {
  const box = $('label-preview');
  if (!box) return;
  const html = labelSheetHtml();
  box.className = 'labels';                 // ใช้กฎเดียวกับตอนพิมพ์เป็นตัวอย่างบนจอ
  box.innerHTML = html || '<p class="text-slate-400 text-sm text-center py-12">ยังไม่มีอะไรบนแผ่น</p>';
  if (html) drawLabelCodes(box);
}

function printLabels() {
  const area = $('print-area');
  area.className = 'labels';
  area.innerHTML = labelSheetHtml();
  drawLabelCodes(area);

  // ขนาดหน้ากระดาษเป็นของ preset จึงตั้งเฉพาะตอนพิมพ์ครั้งนี้
  let style = $('label-page-style');
  if (!style) {
    style = document.createElement('style');
    style.id = 'label-page-style';
    document.head.appendChild(style);
  }
  style.textContent = '@media print { @page { size: ' + LABEL_SHEETS[LB.sheet].page + '; margin: 0; } }';

  window.print();

  // คืน print-area ให้ใบเบิก
  setTimeout(() => { area.className = ''; area.innerHTML = ''; style.textContent = ''; }, 500);
}

     <button onclick="saveUserForm(this)" class="btn btn-ink ml-auto px-5">บันทึก</button>`);
}

function saveUserForm(btn) {
  run(btn, async () => {
    S.users = await api('saveUser', {
      email: $('uf-email').value.trim(), name: $('uf-name').value.trim(),
      role: $('uf-role').value, photo: $('uf-photo').value.trim(), active: $('uf-active').checked
    });
    closeModal();
    renderUsers();
    toast('บันทึกผู้ใช้แล้ว', true);
  });
}

function askPin(email) {
  openModal(
    `<h2 class="text-lg font-bold">ตั้ง PIN ให้ ${esc(email)}</h2>
     <p class="text-xs text-slate-400">เว้นว่างแล้วกดบันทึก = ล้าง PIN ให้เจ้าตัวตั้งใหม่เองตอนเข้าครั้งถัดไป</p>
     <input id="pf-pin" inputmode="numeric" maxlength="8" placeholder="4–8 หลัก"
            class="field mt-3 text-center text-xl tracking-[0.3em]">`,
    `<button onclick="closeModal()" class="btn btn-soft">ยกเลิก</button>
     <button onclick="doSetPin(this,'${esc(email)}')" class="btn btn-ink ml-auto px-5">บันทึก</button>`);
}

function doSetPin(btn, email) {
  run(btn, async () => {
    await api('setPin', email, $('pf-pin').value.trim());
    S.users = await api('getUsers');
    closeModal();
    renderUsers();
    toast('ตั้ง PIN แล้ว', true);
  });
}

function editMachine(code) {
  const m = code ? S.machines.find(x => x.code === code) : { code: '', name: '', area: '' };
  openModal(
    `<h2 class="text-lg font-bold">${code ? 'แก้เครื่องจักร' : 'เพิ่มเครื่องจักร / หน่วยงาน'}</h2>
     <label class="block text-xs text-slate-500 mt-2">รหัส</label>
     <input id="mf-code" value="${esc(m.code)}" class="field">
     <label class="block text-xs text-slate-500 mt-2">ชื่อ</label>
     <input id="mf-name" value="${esc(m.name)}" class="field">
     <label class="block text-xs text-slate-500 mt-2">ไลน์ / พื้นที่</label>
     <input id="mf-area" value="${esc(m.area)}" class="field">
     <label class="flex items-center gap-2 mt-3 text-sm">
       <input id="mf-active" type="checkbox" checked><span>เปิดใช้งาน</span></label>`,
    `<button onclick="closeModal()" class="btn btn-soft">ยกเลิก</button>
     <button onclick="saveMachineForm(this)" class="btn btn-ink ml-auto px-5">บันทึก</button>`);
}

function saveMachineForm(btn) {
  run(btn, async () => {
    takeCatalog(await api('saveMachine', {
      code: $('mf-code').value.trim(), name: $('mf-name').value.trim(),
      area: $('mf-area').value.trim(), active: $('mf-active').checked
    }));
    closeModal();
    render();
    toast('บันทึกเครื่องจักรแล้ว', true);
  });
}

function saveSettingsForm(btn) {
  run(btn, async () => {
    const map = {};
    ['SITE_NAME', 'SITE_ADDRESS', 'CURRENCY', 'EXPIRY_WARN_DAYS', 'DEAD_STOCK_DAYS',
     'REQUIRE_JOB_NO', 'SHOW_COST_TO_TECH', 'ALERT_EMAILS', 'SLIP_WIDTH', 'SLIP_FOOTER', 'LOGO_URL']
      .forEach(k => { map[k] = $('st-' + k).value; });
    CFG = await api('saveSettings', map);
    await refresh(false);
    render();
    toast('บันทึกค่าระบบแล้ว', true);
  });
}

function doInstallTriggers(btn) {
  run(btn, async () => toast(await api('installTriggers'), true));
}

function doArchiveBatches(btn) {
  run(btn, async () => {
    const r = await api('archiveEmptyBatches', 180);
    toast('ย้ายออก ' + r.moved + ' batch · เหลือ ' + r.left, true);
  });
}

function loadAudit(btn) {
  run(btn, async () => {
    const rows = await api('getAuditLog', 60);
    $('audit-list').innerHTML = rows.length ? `
      <table class="w-full text-xs">
        <tr class="text-left text-slate-500"><th class="py-1">เวลา</th><th>ใคร</th><th>ทำอะไร</th>
            <th>เป้าหมาย</th><th>ช่อง</th><th>จาก</th><th>เป็น</th></tr>
        ${rows.map(a => `<tr class="border-t">
          <td class="py-1 whitespace-nowrap">${esc(a.ts)}</td><td>${esc(a.user)}</td>
          <td class="font-mono">${esc(a.action)}</td><td>${esc(a.target)}</td>
          <td>${esc(a.field)}</td><td class="text-slate-400">${esc(a.from)}</td><td>${esc(a.to)}</td>
        </tr>`).join('')}
      </table>` : '<p class="text-sm text-slate-400">ยังไม่มีประวัติ</p>';
  });
}
</script>
